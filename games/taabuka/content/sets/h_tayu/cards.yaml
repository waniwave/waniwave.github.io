# ター宿のほとり「ター湯とカレー」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: htayu_taayu
  name: "ター油"
  cat: ["食べ物", "湯", "ター"]
  grade: 上
  text: "「ター」がTier1以上なら倍率{x1.26}"
  flavor: "湯船に浮いている。湯には溶けない。溶けないことが強さだ。"
  fx:
    - {"when": "採点時", "if": {"番付": {"カテゴリ": "ター", "以上": "1"}}, "do": [{"掛け": 1.26}]}

- id: htayu_yuyu
  name: "ター油の湯"
  cat: ["湯", "ター"]
  grade: 特上
  text: "体力{+3.4}。2枚以上重なったカテゴリの数×{+0.6}の倍率"
  flavor: "湯にター油を浮かべたもの。浮かべただけ。"
  fx:
    - {"when": "採点時", "do": [{"体力": 3.4}]}
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.6"}]}

- id: htayu_sen
  name: "ター湯の栓"
  cat: ["湯"]
  grade: 極
  text: "採点されると、番付で一番低いカテゴリを1段上げる。体力が半分以下なら倍率{x1.23}"
  flavor: "栓を抜くと、何もかも流れていく。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "一番低い"}}]}
    - {"when": "採点時", "if": {"体力の割合以下": 0.5}, "do": [{"掛け": 1.23}]}

- id: htayu_obi
  name: "浴衣の帯"
  cat: ["宿", "湯"]
  grade: 特上
  text: "採点されると、番付で一番低いカテゴリを1段上げる。採点札のカテゴリの種類×{+5}の強さ"
  flavor: "ほどけると、どこかへ行く。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "一番低い"}}]}
    - {"when": "採点時", "do": [{"強さ": "カテゴリの種類*5"}]}

- id: htayu_turmeric
  name: "ターメリック"
  cat: ["食べ物", "ター"]
  grade: 並
  text: "「ター」がTier1以上なら倍率{x1.3}"
  flavor: "カレーになれば話は別、と本人は言っている。"
  fx:
    - {"when": "採点時", "if": {"番付": {"カテゴリ": "ター", "以上": "1"}}, "do": [{"掛け": 1.3}]}

- id: htayu_rice
  name: "ターメリックライス"
  cat: ["食べ物", "ター"]
  grade: 上
  text: "「食べ物」が3枚以上重なれば倍率{x1.26}"
  flavor: "ターメリックで炊いたご飯。あと一歩でカレー。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "食べ物"}, "do": [{"掛け": 1.26}]}

- id: htayu_akibin
  name: "ター油の空き瓶"
  cat: ["湯"]
  grade: 並
  text: "流したとき体力{+4}"
  flavor: "中身は湯船に浮いている。"
  fx:
    - {"when": "流した時", "do": [{"体力": 4}]}
