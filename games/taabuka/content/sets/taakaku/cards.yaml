# ター角の専用札（25枚）

- id: tk_hashira
  name: "角の柱"
  cat: ["ター", "宿"]
  grade: 並
  text: "採点されると、2割5分で狙った敵の次の行動を消す"
  flavor: "ぶつけると痛い。"
  fx:
    - {"when": "採点時", "if": {"確率": 0.25}, "do": [{"行動を消す": "狙い"}]}

- id: tk_sumi
  name: "部屋の隅"
  cat: ["宿", "死"]
  grade: 並
  text: "失った体力×{+0.6}の強さ"
  flavor: "ほこりが溜まる。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "失った体力*0.6"}]}

- id: tk_kado
  name: "曲がり角"
  cat: ["速さ", "ター"]
  grade: 並
  text: "採点されると「ター」を1段上げる"
  flavor: "パンをくわえた誰かとぶつかる。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "ター"}}]}

- id: tk_kakuza
  name: "角砂糖"
  cat: ["食べ物"]
  grade: 並
  text: "採点されると、次の出しの強さ{+18}"
  flavor: "溶けると角がなくなる。"
  fx:
    - {"when": "採点時", "do": [{"次の出しの強さ": 18}]}

- id: tk_kakuni
  name: "角煮"
  cat: ["食べ物", "麺"]
  grade: 並
  kw: ["連れ2"]
  text: "強さ{+12}"
  flavor: "箸で切れる。"
  fx:
    - {"when": "採点時", "do": [{"強さ": 12}]}

- id: tk_shikaku
  name: "四角い座布団"
  cat: ["宿", "老"]
  grade: 並
  kw: ["守り5"]
  text: "捨て札の枚数×{+1.5}の強さ"
  flavor: "角に座る。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "捨て札枚数*1.5"}]}

- id: tk_hidari
  name: "左端"
  cat: ["ター", "スレ"]
  grade: 並
  text: "採点されると、このターンの流し＋1"
  flavor: "右端の反対。"
  fx:
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}

- id: tk_migi
  name: "右端"
  cat: ["ター", "スレ"]
  grade: 並
  text: "採点されると、番付で一番低いカテゴリを1段上げる"
  flavor: "左端の反対。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "一番低い"}}]}

- id: tk_kakugari
  name: "角刈り"
  cat: ["格ゲー", "老"]
  grade: 上
  text: "捨て札の枚数×{+1.3}の強さ"
  flavor: "床屋の一番人気。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "捨て札枚数*1.3"}]}

- id: tk_kakutou
  name: "格闘ゲームの画面端"
  cat: ["格ゲー", "ター"]
  grade: 上
  text: "「格ゲー」と「ター」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "端に追い詰めたら勝ち。"
  fx:
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "格ゲー"}, {"重なり以上": 2, "カテゴリ": "ター"}], "do": [{"掛け": 1.3}]}

- id: tk_sankaku
  name: "三角定規"
  cat: ["校庭", "速さ"]
  grade: 上
  kw: ["呼び水1"]
  text: "最初に採点されると強さ{+12}"
  flavor: "角が三つもある。"
  fx:
    - {"when": "採点時", "if": {"採点の順番": "最初"}, "do": [{"強さ": 12}]}

- id: tk_kakudai
  name: "角度"
  cat: ["校庭", "スレ"]
  grade: 上
  text: "採点されると、2割で狙った敵を1ターン止める"
  flavor: "九十度。"
  fx:
    - {"when": "採点時", "if": {"確率": 0.2}, "do": [{"行動停止": {"対象": "狙い", "ターン": 1}}]}

- id: tk_kakusa
  name: "角刈りの格差"
  cat: ["スレ", "格ゲー"]
  grade: 上
  text: "「スレ」と「格ゲー」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "鋭い議論。"
  fx:
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "スレ"}, {"重なり以上": 2, "カテゴリ": "格ゲー"}], "do": [{"掛け": 1.3}]}

- id: tk_tsuno
  name: "鬼の角"
  cat: ["死", "ター"]
  grade: 上
  kw: ["一番槍"]
  text: "2枚以上重なったカテゴリの数×{+0.6}の倍率"
  flavor: "二本ある。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.6"}]}

- id: tk_kadoban
  name: "角番"
  cat: ["格ゲー", "ター", "死"]
  grade: 上
  text: "「ター」がTier1以上なら倍率{x1.26}"
  flavor: "負ければ陥落。"
  fx:
    - {"when": "採点時", "if": {"番付": {"カテゴリ": "ター", "以上": "1"}}, "do": [{"掛け": 1.26}]}

- id: tk_shikakui
  name: "四角い部屋を丸く掃く"
  cat: ["宿", "老"]
  grade: 上
  text: "戦闘の3ターン目以降なら倍率{x1.26}"
  flavor: "角は誰も見ていない。"
  fx:
    - {"when": "採点時", "if": {"戦闘のターン以上": 3}, "do": [{"掛け": 1.26}]}

- id: tk_kakumaku
  name: "角膜"
  cat: ["死", "ター"]
  grade: 特上
  text: "この札のTierの段の高さ×{+0.3}の倍率。2枚以上重なったカテゴリの数×{+0.6}の倍率"
  flavor: "目の角。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "Tierの段*0.3"}]}
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.6"}]}

- id: tk_tsukuda
  name: "四つ角の交番"
  cat: ["宿", "速さ"]
  grade: 特上
  kw: ["守り10"]
  text: "最初に採点されると強さ{+12}。採点札のカテゴリの種類×{+5}の強さ"
  flavor: "道を聞かれる。"
  fx:
    - {"when": "採点時", "if": {"採点の順番": "最初"}, "do": [{"強さ": 12}]}
    - {"when": "採点時", "do": [{"強さ": "カテゴリの種類*5"}]}

- id: tk_kakuu
  name: "鋭角"
  cat: ["ター", "速さ"]
  grade: 特上
  text: "戦闘の1回目の出しなら倍率{+1}。「ター」と「速さ」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "刺さる。"
  fx:
    - {"when": "採点時", "if": {"戦闘の出し": 1}, "do": [{"倍率": 1}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "ター"}, {"重なり以上": 2, "カテゴリ": "速さ"}], "do": [{"掛け": 1.3}]}

- id: tk_kado2
  name: "角の店"
  cat: ["食べ物", "宿", "麺"]
  grade: 特上
  text: "「麺」が3枚以上重なれば倍率{x1.25}。「食べ物」と「宿」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "入りやすい。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "麺"}, "do": [{"掛け": 1.25}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "食べ物"}, {"重なり以上": 2, "カテゴリ": "宿"}], "do": [{"掛け": 1.3}]}

- id: tk_kado3
  name: "袋小路"
  cat: ["死", "宿"]
  grade: 特上
  text: "体力−3。強さ{+20}。「死」と「宿」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "行き止まり。"
  fx:
    - {"when": "採点時", "do": [{"体力": -3}, {"強さ": 20}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "死"}, {"重なり以上": 2, "カテゴリ": "宿"}], "do": [{"掛け": 1.3}]}

- id: tk_kakuhen
  name: "角変"
  cat: ["ター", "スレ"]
  grade: 極
  text: "手札が4枚以下なら、採点されると{d2}枚引く。採点札のカテゴリの種類×{+4.6}の強さ"
  flavor: "角度が変わると、議論も変わる。"
  fx:
    - {"when": "採点時", "if": {"手札枚数以下": 4}, "do": [{"引く": 2}]}
    - {"when": "採点時", "do": [{"強さ": "カテゴリの種類*4.6"}]}

- id: tk_shikakuchu
  name: "四角柱"
  cat: ["ター", "校庭", "ロボ"]
  grade: 極
  text: "採点されると、2割で狙った敵を1ターン止める。採点札のカテゴリが3種類以上なら倍率{+0.9}"
  flavor: "角が八つ。"
  fx:
    - {"when": "採点時", "if": {"確率": 0.2}, "do": [{"行動停止": {"対象": "狙い", "ターン": 1}}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 0.9}]}

- id: tk_kadomatsu
  name: "門松"
  cat: ["宿", "ター", "老"]
  grade: 極
  text: "受けに回ると受け{+9}。採点されると受け{+3.8}。「宿」「ター」「老」が全部重なれば倍率{x1.46}"
  flavor: "右にもある。"
  fx:
    - {"when": "受けに回る", "do": [{"受け": 9}]}
    - {"when": "採点時", "do": [{"受け": 3.8}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "宿"}, {"重なり以上": 2, "カテゴリ": "ター"}, {"重なり以上": 2, "カテゴリ": "老"}], "do": [{"掛け": 1.46}]}

- id: tk_taakaku
  name: "ター角の真骨頂"
  cat: ["ター", "格ゲー", "速さ"]
  grade: 神
  text: "戦闘の1〜2ターン目なら倍率{x1.15}。採点札のカテゴリが3種類以上なら倍率{+0.7}。戦闘の1回目の出しなら倍率{+0.7}"
  flavor: "角を制する者が、ターを制する。"
  fx:
    - {"when": "採点時", "if": {"でない": {"戦闘のターン以上": 3}}, "do": [{"掛け": 1.15}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 0.7}]}
    - {"when": "採点時", "if": {"戦闘の出し": 1}, "do": [{"倍率": 0.7}]}
