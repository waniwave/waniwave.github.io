# ター宿のほとり「オッペンとタタ」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hoppen_golden
  name: "ゴールデン・オッペンターム"
  cat: ["校庭", "ター"]
  grade: 上
  text: "採点札のカテゴリが3種類以上なら倍率{+1}"
  flavor: "金色である。強くはない。"
  fx:
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 1}]}

- id: hoppen_silver
  name: "シルバー・オッペンターム"
  cat: ["校庭", "ター"]
  grade: 並
  text: "採点されると、1割5分で敵全員の次の行動を消す"
  flavor: "銀色である。金より弱い。"
  fx:
    - {"when": "採点時", "if": {"確率": 0.15}, "do": [{"行動を消す": "敵全員"}]}

- id: hoppen_bronze
  name: "ブロンズ・オッペンターム"
  cat: ["校庭", "ター"]
  grade: 並
  text: "戦闘の3ターン目以降なら倍率{+1.6}"
  flavor: "銅色である。表彰台にはのぼれる。"
  fx:
    - {"when": "採点時", "if": {"戦闘のターン以上": 3}, "do": [{"倍率": 1.6}]}

- id: hoppen_shoujou
  name: "オッペンタームの表彰状"
  cat: ["校庭"]
  grade: 特上
  text: "採点されると、1割5分で敵全員の次の行動を消す。戦闘の3ターン目以降なら倍率{+1.4}"
  flavor: "強くはない、と書いてある。"
  fx:
    - {"when": "採点時", "if": {"確率": 0.15}, "do": [{"行動を消す": "敵全員"}]}
    - {"when": "採点時", "if": {"戦闘のターン以上": 3}, "do": [{"倍率": 1.4}]}

- id: hoppen_tatagi
  name: "タタ木"
  cat: ["校庭"]
  grade: 特上
  text: "採点されると、2割で狙った敵を1ターン止める。残っている敵の数×{+6}の強さ"
  flavor: "屋上の物干し竿を支えている。"
  fx:
    - {"when": "採点時", "if": {"確率": 0.2}, "do": [{"行動停止": {"対象": "狙い", "ターン": 1}}]}
    - {"when": "採点時", "do": [{"強さ": "敵の数*6"}]}

- id: hoppen_tatabayashi
  name: "タタ林"
  cat: ["校庭"]
  grade: 上
  text: "残っている敵の数×{+6}の強さ"
  flavor: "木が2本で林。タタ木が2本でタタ林。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "敵の数*6"}]}

- id: hoppen_tatamori
  name: "タタ森"
  cat: ["校庭"]
  grade: 極
  text: "採点されると、1割5分で敵全員の次の行動を消す。残っている敵の数×{+5}の強さ"
  flavor: "木が集まると林になり、林が集まると森になる。"
  fx:
    - {"when": "採点時", "if": {"確率": 0.15}, "do": [{"行動を消す": "敵全員"}]}
    - {"when": "採点時", "do": [{"強さ": "敵の数*5"}]}
