# ター宿のほとり「下剋上の宿」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hgekoku_k_houi
  name: "包囲網"
  cat: ["スレ"]
  grade: 上
  text: "手札が4枚以下なら、採点されると{d2}枚引く"
  flavor: "「あいつのハーム、下げようぜ」"
  fx:
    - {"when": "採点時", "if": {"手札枚数以下": 4}, "do": [{"引く": 2}]}

- id: hgekoku_k_dangou
  name: "談合"
  cat: ["スレ"]
  grade: 並
  text: "流したとき{d1}枚引く"
  flavor: "宿の裏の喫煙所で決まった。"
  fx:
    - {"when": "流した時", "do": [{"引く": 1}]}

- id: hgekoku_k_sekigae
  name: "席替え"
  cat: ["スレ", "校庭"]
  grade: 神
  text: "手札が4枚以下なら、採点されると{d2}枚引く。「スレ」と「校庭」が両方2枚以上重なれば倍率{x1.21}。採点されると、1割5分で敵全員の次の行動を消す"
  flavor: "くじ引きの結果です（くじは見せない）。"
  fx:
    - {"when": "採点時", "if": {"手札枚数以下": 4}, "do": [{"引く": 2}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "スレ"}, {"重なり以上": 2, "カテゴリ": "校庭"}], "do": [{"掛け": 1.21}]}
    - {"when": "採点時", "if": {"確率": 0.15}, "do": [{"行動を消す": "敵全員"}]}

- id: hgekoku_k_zeimu
  name: "税務調査"
  cat: ["スレ"]
  grade: 上
  text: "手札の枚数×{+2.2}の強さ"
  flavor: "「この〈ハーム〉の仕入れ値は？」"
  fx:
    - {"when": "採点時", "do": [{"強さ": "手札枚数*2.2"}]}

- id: hgekoku_k_enjou
  name: "炎上"
  cat: ["スレ"]
  grade: 並
  text: "流したとき{d1}枚引く"
  flavor: "燃えている間は、何を言っても燃える。"
  fx:
    - {"when": "流した時", "do": [{"引く": 1}]}

- id: hgekoku_k_gyakushin
  name: "逆神の札"
  cat: ["スレ"]
  grade: 特上
  text: "採点されると、このターンの流し＋1。手札の枚数×{+2.1}の強さ"
  flavor: "1枚ではただの札。2枚で神になる。"
  fx:
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}
    - {"when": "採点時", "do": [{"強さ": "手札枚数*2.1"}]}
