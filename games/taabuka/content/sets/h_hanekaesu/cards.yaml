# ター宿のほとり「跳ね返す食卓と獣」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hhanekaesu_f_juubako
  name: "重箱"
  cat: ["食べ物"]
  grade: 神
  kw: ["守り30", "不壊"]
  text: "「食べ物」が3枚以上重なれば倍率{x1.18}。採点されると、次の出しの強さ{+11}。体力が満タンでなければ体力{+3}、満タンなら強さ{+9}"
  flavor: "三段重ねは、崩れない。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "食べ物"}, "do": [{"掛け": 1.18}]}
    - {"when": "採点時", "do": [{"次の出しの強さ": 11}]}
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以上": 1}}, "do": [{"体力": 3}]}
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以下": 0}}, "do": [{"強さ": 9}]}

- id: hhanekaesu_f_kashiori
  name: "お返しの菓子折り"
  cat: ["食べ物"]
  grade: 並
  kw: ["守り5"]
  text: "体力が満タンでなければ体力{+5}、満タンなら強さ{+15}"
  flavor: "「つまらないものですが」と、そっくりそのまま返す。"
  fx:
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以上": 1}}, "do": [{"体力": 5}]}
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以下": 0}}, "do": [{"強さ": 15}]}

- id: hhanekaesu_f_kashikiri
  name: "本日貸切"
  cat: ["食べ物", "宿"]
  grade: 上
  kw: ["呼び水1"]
  text: "採点されると、次の出しの強さ{+16}"
  flavor: "のれんの前に、札が一枚。"
  fx:
    - {"when": "採点時", "do": [{"次の出しの強さ": 16}]}

- id: hhanekaesu_a_yamaarashi
  name: "ヤマアラシター"
  cat: ["動物", "ター"]
  grade: 並
  kw: ["守り5"]
  text: "「動物」が3枚以上重なれば倍率{x1.3}"
  flavor: "さわったほうが痛い。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "動物"}, "do": [{"掛け": 1.3}]}

- id: hhanekaesu_a_boss
  name: "群れのボス"
  cat: ["動物"]
  grade: 特上
  text: "重なりの枚数×{+4.2}の強さ。「動物」が3枚以上重なれば倍率{x1.25}"
  flavor: "ボスがいるあいだ、群れには手が出せない。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "この札の重なり*4.2"}]}
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "動物"}, "do": [{"掛け": 1.25}]}

- id: hhanekaesu_a_sunaba
  name: "砂浴び"
  cat: ["動物"]
  grade: 特上
  kw: ["守り12"]
  text: "同じカテゴリの札と一緒なら倍率{+0.6}。重なりの枚数×{+4.2}の強さ"
  flavor: "ダニも除去も、はらい落とす。"
  fx:
    - {"when": "採点時", "if": {"同じカテゴリの札が他に": true}, "do": [{"倍率": 0.6}]}
    - {"when": "採点時", "do": [{"強さ": "この札の重なり*4.2"}]}

- id: hhanekaesu_t_sakujo
  name: "削除依頼"
  cat: ["スレ"]
  grade: 上
  kw: ["呼び水1"]
  text: "採点されると、このターンの流し＋1"
  flavor: "「該当レスの削除をお願いします」"
  fx:
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}
