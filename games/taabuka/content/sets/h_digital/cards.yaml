# ター宿のほとり「バグった宿」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hdigital_d_save
  name: "セーブデータ破損"
  cat: ["ロボ"]
  grade: 上
  kw: ["呼び水1"]
  text: "採点されると、手札の乱数の1枚に「ロボ」を足す（この戦闘）。強さ{+5}"
  flavor: "「冒険の書は消えてしまいました」"
  fx:
    - {"when": "採点時", "do": [{"札を変える": {"対象": "手札の乱数", "カテゴリを足す": "ロボ", "期間": "戦闘"}}, {"強さ": 5}]}

- id: hdigital_d_lag
  name: "ラグ"
  cat: ["ロボ"]
  grade: 上
  text: "採点されると、手札の乱数の1枚に「ロボ」を足す（この戦闘）。強さ{+5}"
  flavor: "回線が、詰まった。"
  fx:
    - {"when": "採点時", "do": [{"札を変える": {"対象": "手札の乱数", "カテゴリを足す": "ロボ", "期間": "戦闘"}}, {"強さ": 5}]}

- id: hdigital_d_rewind
  name: "巻き戻し"
  cat: ["ロボ"]
  grade: 並
  text: "採点札の効果の無い札1枚につき倍率{+0.6}"
  flavor: "議論は、なかったことになった。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "効果なしの札*0.6"}]}

- id: hdigital_d_zoushoku
  name: "バグ技：増殖"
  cat: ["ロボ"]
  grade: 特上
  text: "採点されると、手札の乱数の1枚に「ロボ」を足す（この戦闘）。強さ{+5}。採点されると、手札の一番弱い札に「ロボ」を足す（この戦闘）"
  flavor: "アイテム欄の6番目で、Aボタンを押しながら……"
  fx:
    - {"when": "採点時", "do": [{"札を変える": {"対象": "手札の乱数", "カテゴリを足す": "ロボ", "期間": "戦闘"}}, {"強さ": 5}]}
    - {"when": "採点時", "do": [{"札を変える": {"対象": "手札の一番弱い", "カテゴリを足す": "ロボ", "期間": "戦闘"}}]}

- id: hdigital_d_loop
  name: "無限ループ"
  cat: ["ロボ"]
  grade: 神
  text: "採点されると、手札の一番弱い札に「ロボ」を足す（この戦闘）。効果の無い札が2枚以上採点されていれば倍率{x1.21}。採点されると、手札の乱数の1枚に「ロボ」を足す（この戦闘）。強さ{+3.6}"
  flavor: "このスレは、終わらない。"
  fx:
    - {"when": "採点時", "do": [{"札を変える": {"対象": "手札の一番弱い", "カテゴリを足す": "ロボ", "期間": "戦闘"}}]}
    - {"when": "採点時", "if": {"効果なしの札": 2}, "do": [{"掛け": 1.21}]}
    - {"when": "採点時", "do": [{"札を変える": {"対象": "手札の乱数", "カテゴリを足す": "ロボ", "期間": "戦闘"}}, {"強さ": 3.6}]}

