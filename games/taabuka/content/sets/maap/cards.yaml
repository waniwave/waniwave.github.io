# 女将マープの専用札（10枚）

- id: mp_aisatsu
  name: 挨拶
  cat: [宿]
  tier: 3
  grade: 並
  text: 採配した回数だけ倍率＋
  flavor: いらっしゃいませ。
  fx:
    - when: 採点時
      do:
        - 倍率: 採配数
  test:
    - hand: [mp_aisatsu]
      guest: maap
      state: { 採配数: 3 }
      expect: { V: 44 }          # (5＋6)×(1＋3)

- id: mp_saihai
