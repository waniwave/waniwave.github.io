# ター宿のほとり「タムデンとタムボイス」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: htamden_tamden
  name: "タームデン・ボーイ"
  cat: ["ター"]
  grade: 極
  text: "採点されると「ター」を1段上げる。この札のTierの段の高さ×{+0.3}の倍率"
  flavor: "いつも少しだけ先回りしている。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "ター"}}]}
    - {"when": "採点時", "do": [{"倍率": "Tierの段*0.3"}]}

- id: htamden_tamgirl
  name: "タームデン・ガール"
  cat: ["ター"]
  grade: 特上
  text: "「ター」がTier1以上なら倍率{x1.25}。採点されると、番付で一番低いカテゴリを1段上げる"
  flavor: "ボーイよりさらに先回りしている。"
  fx:
    - {"when": "採点時", "if": {"番付": {"カテゴリ": "ター", "以上": "1"}}, "do": [{"掛け": 1.25}]}
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "一番低い"}}]}

- id: htamden_map
  name: "マープの地図"
  cat: ["宿"]
  grade: 特上
  text: "手札にあるまま終わると受け{+5}。採点されると、2割5分で狙った敵の次の行動を消す"
  flavor: "女将の頭の中の地図を、誰かが書き写したもの。"
  fx:
    - {"when": "ターン終了", "do": [{"受け": 5}]}
    - {"when": "採点時", "if": {"確率": 0.25}, "do": [{"行動を消す": "狙い"}]}

- id: htamden_kanae
  name: "叶（にじさんじライバー）"
  cat: ["スレ"]
  grade: 上
  text: "採点されると{d1}枚引く"
  flavor: "スレではTier2（強キャラ）として名前が挙がっている。"
  fx:
    - {"when": "採点時", "do": [{"引く": 1}]}

- id: htamden_kirby
  name: "たてながのカービィ"
  cat: ["スレ"]
  grade: 並
  text: "採点されると、このターンの流し＋1"
  flavor: "縦に長い。それだけで作中最強レベルに届いた。"
  fx:
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}

- id: htamden_rokuon
  name: "タムボイスの録音"
  cat: ["ター", "スレ"]
  grade: 並
  text: "採点されると、番付で一番低いカテゴリを1段上げる"
  flavor: "「……タム」（再生）"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "一番低い"}}]}

- id: htamden_haishi
  name: "タムボイス制度廃止法案"
  cat: ["スレ"]
  grade: 上
  text: "手札が4枚以下なら、採点されると{d2}枚引く"
  flavor: "可決されると、制度に積み上がっていたものが法案のほうに移る。"
  fx:
    - {"when": "採点時", "if": {"手札枚数以下": 4}, "do": [{"引く": 2}]}
