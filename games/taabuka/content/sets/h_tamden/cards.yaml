# ター宿のほとり「タムデンとタムボイス」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: htamden_tamden
  name: タームデン・ボーイ
  cat: [ター]
  tier: '4'
  grade: 極
  text: 採点されると〈ター〉の番付を2段上げる。採点されると掛け×2
  flavor: いつも少しだけ先回りしている。
  fx:
  - when: 採点時
    do:
    - 番付を上げる: {カテゴリ: ター, 段: 2}
  - when: 採点時
    do:
    - {掛け: 2}

- id: htamden_tamgirl
  name: タームデン・ガール
  cat: [ター]
  tier: '4'
  grade: 特上
  text: 〈ター〉が番付でT1以上なら掛け×1.5
  flavor: ボーイよりさらに先回りしている。
  fx:
  - when: 採点時
    if:
      番付: {カテゴリ: ター, 以上: '1'}
    do:
    - {掛け: 1.5}

- id: htamden_map
  name: マープの地図
  cat: [宿]
  tier: '3'
  grade: 特上
  text: この戦闘1回目の出しなら、このターンの出し＋1
  flavor: 女将の頭の中の地図を、誰かが書き写したもの。
  fx:
  - when: 出し
    if: {戦闘の出し: 1}
    do:
    - 出し回数: {増減: 1}

- id: htamden_kanae
  name: 叶（にじさんじライバー）
  cat: [スレ]
  tier: '4'
  grade: 上
  text: 〈スレ〉の札が2枚以上採点されると倍率＋5
  flavor: スレではTier2（強キャラ）として名前が挙がっている。
  fx:
  - when: 出し
    if: {採点札のカテゴリ: スレ, 枚数以上: 2}
    do:
    - {倍率: 5}

- id: htamden_kirby
  name: たてながのカービィ
  cat: [スレ]
  tier: '5'
  grade: 並
  text: 同じ出しに同じカテゴリの札があれば強さ＋15
  flavor: 縦に長い。それだけで作中最強レベルに届いた。
  fx:
  - when: 採点時
    if: {同じカテゴリの札が他に: true}
    do:
    - {強さ: 15}

- id: htamden_rokuon
  name: タムボイスの録音
  cat: [ター, スレ]
  tier: '5'
  grade: 並
  text: この戦闘1回目の出しなら、このターンの出し＋1
  flavor: 「……タム」（再生）
  fx:
  - when: 出し
    if: {戦闘の出し: 1}
    do:
    - 出し回数: {増減: 1}

- id: htamden_haishi
  name: タムボイス制度廃止法案
  cat: [スレ]
  tier: '4'
  grade: 上
  text: 出すと、狙った敵の主張を8%削る（層主は半分）
  flavor: 可決されると、制度に積み上がっていたものが法案のほうに移る。
  fx:
  - when: 出し
    do:
    - 主張を削る: {対象: 狙い, 割合: 0.08, 層主なら: 0.04}
