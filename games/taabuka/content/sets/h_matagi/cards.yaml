# ター宿のほとり「系統またぎ」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hmatagi_x_nekopunch
  name: "猫パンチ"
  cat: ["動物", "格ゲー"]
  grade: 特上
  text: "「動物」が5枚重なれば倍率{x1.51}。「動物」と「格ゲー」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "フレーム有利がとれる猫。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 5, "カテゴリ": "動物"}, "do": [{"掛け": 1.51}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "動物"}, {"重なり以上": 2, "カテゴリ": "格ゲー"}], "do": [{"掛け": 1.3}]}

- id: hmatagi_x_karaage
  name: "唐揚げコンボ"
  cat: ["食べ物", "格ゲー"]
  grade: 上
  text: "採点されると、狙った敵に{+16}の追撃"
  flavor: "つなぎがカリッと入る。"
  fx:
    - {"when": "採点時", "do": [{"主張を削る": {"対象": "狙い", "量": 16}}]}

- id: hmatagi_x_esayari
  name: "餌やり体験"
  cat: ["動物", "食べ物"]
  grade: 上
  text: "採点されると、次の出しの強さ{+16}"
  flavor: "ふれあい広場で100円。"
  fx:
    - {"when": "採点時", "do": [{"次の出しの強さ": 16}]}

- id: hmatagi_x_banken
  name: "スレの番犬"
  cat: ["動物", "スレ"]
  grade: 神
  text: "流したとき{d1}枚引く。採点札のカテゴリが3種類以上なら倍率{+0.7}。採点されると、このターンの流し＋1"
  flavor: "荒らしにだけ吠える。"
  fx:
    - {"when": "流した時", "do": [{"引く": 1}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 0.7}]}
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}

- id: hmatagi_x_yashoku
  name: "格ゲー勢の夜食"
  cat: ["食べ物", "格ゲー"]
  grade: 並
  text: "体力が満タンでなければ体力{+5}、満タンなら強さ{+15}"
  flavor: "深夜3時のカップ麺は、フレーム消費が少ない。"
  fx:
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以上": 1}}, "do": [{"体力": 5}]}
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以下": 0}}, "do": [{"強さ": 15}]}

- id: hmatagi_x_onsenzaru
  name: "温泉ザル"
  cat: ["動物", "湯"]
  grade: 並
  text: "採点されると、番付で一番低いカテゴリを1段上げる"
  flavor: "湯船の主。タオルを頭にのせている。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "一番低い"}}]}

- id: hmatagi_x_crane
  name: "クレーンゲームのぬいぐるみ"
  cat: ["動物", "格ゲー"]
  grade: 特上
  text: "「動物」が3枚以上重なれば倍率{x1.25}。採点札のカテゴリが3種類以上なら倍率{+1}"
  flavor: "格ゲー台の横の、アームが弱い台。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "動物"}, "do": [{"掛け": 1.25}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 1}]}
