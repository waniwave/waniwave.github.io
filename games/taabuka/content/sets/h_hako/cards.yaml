# ター宿のほとり「箱と角」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hhako_johnbox
  name: "ジョン・ボックス"
  cat: ["宿"]
  grade: 特上
  kw: ["守り12"]
  text: "手札にあるまま終わると受け{+5}。受けに回ると受け{+10}。採点されると受け{+4.2}"
  flavor: "外の様子は見ていないので知らない。"
  fx:
    - {"when": "ターン終了", "do": [{"受け": 5}]}
    - {"when": "受けに回る", "do": [{"受け": 10}]}
    - {"when": "採点時", "do": [{"受け": 4.2}]}

- id: hhako_karabox
  name: "空のボックス"
  cat: ["宿", "速さ"]
  grade: 上
  kw: ["守り8"]
  text: "2枚以上重なったカテゴリの数×{+0.6}の倍率"
  flavor: "ジョン・ボックスが出ていったあとの箱。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.6"}]}

- id: hhako_kakunokake
  name: "ター角の欠片"
  cat: ["ター"]
  grade: 極
  text: "「ター」がTier1以上なら倍率{x1.23}。この札のTierの段の高さ×{+0.3}の倍率"
  flavor: "角から欠けた。欠けても、角は角。"
  fx:
    - {"when": "採点時", "if": {"番付": {"カテゴリ": "ター", "以上": "1"}}, "do": [{"掛け": 1.23}]}
    - {"when": "採点時", "do": [{"倍率": "Tierの段*0.3"}]}

- id: hhako_tarmaru
  name: "ター丸"
  cat: ["ター"]
  grade: 並
  text: "採点されると「ター」をTier8（博打）に送る。強さ{+10}"
  flavor: "ター角の反対側にいる。角ではない。"
  fx:
    - {"when": "採点時", "do": [{"番付を移す": {"カテゴリ": "ター", "先": "8"}}, {"強さ": 10}]}

- id: hhako_cage
  name: "ゆ虐の檻"
  cat: ["宿"]
  grade: 並
  kw: ["呼び水1"]
  text: "受けに回ると受け{+12}。採点されると受け{+5}"
  flavor: "食べ物よりも弱いが、檻は強い。"
  fx:
    - {"when": "受けに回る", "do": [{"受け": 12}]}
    - {"when": "採点時", "do": [{"受け": 5}]}

- id: hhako_nafuda
  name: "佐々木の名札"
  cat: ["スレ"]
  grade: 特上
  text: "採点されると、このターンの流し＋1。手札の枚数×{+2.1}の強さ"
  flavor: "どの佐々木の名札かは、わからない。"
  fx:
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}
    - {"when": "採点時", "do": [{"強さ": "手札枚数*2.1"}]}

- id: hhako_hakusen
  name: "校庭の白線"
  cat: ["校庭"]
  grade: 上
  text: "残っている敵の数×{+6}の強さ"
  flavor: "白線を引き直すと、場所が変わる。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "敵の数*6"}]}
