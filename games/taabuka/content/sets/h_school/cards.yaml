# ター宿のほとり「校庭と自己紹介」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hschool_koutei
  name: "校庭変化"
  cat: ["校庭"]
  grade: 極
  kw: ["呼び水2"]
  text: "戦闘の3ターン目以降なら倍率{+1.2}。残っている敵の数×{+5}の強さ"
  flavor: "床に白線が引かれはじめたら、それが合図だ。"
  fx:
    - {"when": "採点時", "if": {"戦闘のターン以上": 3}, "do": [{"倍率": 1.2}]}
    - {"when": "採点時", "do": [{"強さ": "敵の数*5"}]}

- id: hschool_seigi
  name: "正義執行／校庭変化"
  cat: ["校庭"]
  grade: 特上
  kw: ["呼び水2"]
  text: "戦闘の3ターン目以降なら倍率{+1.4}。採点されると、1割5分で敵全員の次の行動を消す"
  flavor: "正義が執行されると、だいたい校庭になる。"
  fx:
    - {"when": "採点時", "if": {"戦闘のターン以上": 3}, "do": [{"倍率": 1.4}]}
    - {"when": "採点時", "if": {"確率": 0.15}, "do": [{"行動を消す": "敵全員"}]}

- id: hschool_taiikukan
  name: "体育館変化"
  cat: ["校庭"]
  grade: 特上
  text: "採点されると、1割5分で敵全員の次の行動を消す。採点されると、2割で狙った敵を1ターン止める"
  flavor: "雨の日の校庭変化。屋根ごと落ちてくる。"
  fx:
    - {"when": "採点時", "if": {"確率": 0.15}, "do": [{"行動を消す": "敵全員"}]}
    - {"when": "採点時", "if": {"確率": 0.2}, "do": [{"行動停止": {"対象": "狙い", "ターン": 1}}]}

