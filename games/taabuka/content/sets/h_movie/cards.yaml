# ター宿のほとり「『ターム　』」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hmovie_shuen
  name: "『ターム　』の主演ターマー"
  cat: ["ター"]
  grade: 極
  text: "この札のTierの段の高さ×{+0.3}の倍率。採点されると「ター」をTier8（博打）に送る。強さ{+8}"
  flavor: "タイトルの後ろの空白も含めて、主演である。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "Tierの段*0.3"}]}
    - {"when": "採点時", "do": [{"番付を移す": {"カテゴリ": "ター", "先": "8"}}, {"強さ": 8}]}

- id: hmovie_director
  name: "『ターム　』の監督"
  cat: ["ター"]
  grade: 上
  text: "採点されると「ター」を1段上げる"
  flavor: "「空白、もう少し長めに」"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "ター"}}]}

- id: hmovie_joen
  name: "『ターム　』の助演ターマー"
  cat: ["ター"]
  grade: 特上
  text: "この札のTierの段の高さ×{+0.3}の倍率。「ター」がTier1以上なら倍率{x1.25}"
  flavor: "主演より目立ってはいけない。空白より目立ってもいけない。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "Tierの段*0.3"}]}
    - {"when": "採点時", "if": {"番付": {"カテゴリ": "ター", "以上": "1"}}, "do": [{"掛け": 1.25}]}

- id: hmovie_sequel
  name: "『ターム　 』（続編）"
