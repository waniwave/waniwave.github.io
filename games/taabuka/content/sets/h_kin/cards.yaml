# ター宿のほとり「金武町タイム」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hkin_mukatteru
  name: "金武町タームくん「今向かってるタム」のとき"
  cat: ["速さ", "ター"]
  grade: 特上
  text: "戦闘の1〜2ターン目なら倍率{x1.21}。採点札のカテゴリが3種類以上なら倍率{+1}"
  flavor: "Tier1なのは「今向かってるタム」のときだけ。"
  fx:
    - {"when": "採点時", "if": {"でない": {"戦闘のターン以上": 3}}, "do": [{"掛け": 1.21}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 1}]}

- id: hkin_tsuita
  name: "金武町タームくん「着いたタム」のとき"
  cat: ["速さ", "ター"]
  grade: 極
  text: "最初に採点されると強さ{+11}。採点札のカテゴリの種類×{+4.6}の強さ"
  flavor: "着いたら、Tier5だったタム。"
  fx:
    - {"when": "採点時", "if": {"採点の順番": "最初"}, "do": [{"強さ": 11}]}
    - {"when": "採点時", "do": [{"強さ": "カテゴリの種類*4.6"}]}

- id: hkin_neteru
  name: "金武町タームくん「まだ寝てるタム」のとき"
  cat: ["速さ", "ター"]
  grade: 並
  text: "「ター」がTier1以上なら倍率{x1.3}"
  flavor: "向かってすらいないタム。"
  fx:
    - {"when": "採点時", "if": {"番付": {"カテゴリ": "ター", "以上": "1"}}, "do": [{"掛け": 1.3}]}

- id: hkin_bus
  name: "金武町行きのバス"
  cat: ["速さ"]
  grade: 特上
  text: "戦闘の1〜2ターン目なら倍率{x1.21}。このターン最初の出しで採点されると、このターンの出し＋1"
  flavor: "今向かってるバス。"
  fx:
    - {"when": "採点時", "if": {"でない": {"戦闘のターン以上": 3}}, "do": [{"掛け": 1.21}]}
    - {"when": "採点時", "if": {"このターンの出し": 1}, "do": [{"出し回数": {"増減": 1, "期間": "ターン"}}]}

- id: hkin_syrup
  name: "syrup16g"
  cat: ["死"]
  grade: 上
  text: "採点されると手札の一番弱い札を捨て、倍率{+1}"
  flavor: "スレでは「敵意をもたないもの」としてTier4に分類されている。"
  fx:
    - {"when": "採点時", "do": [{"捨てる": {"対象": "手札の一番弱い", "枚数": 1}}, {"倍率": 1}]}

- id: hkin_chiko
  name: "チコリータ"
  cat: ["動物", "死"]
  grade: 上
  text: "採点札のカテゴリが3種類以上なら倍率{+1}"
  flavor: "スレではTier5（食べ物よりも弱い）に置かれている。育つ。"
  fx:
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 1}]}

- id: hkin_tamvoice
  name: "タムボイス制度"
  cat: ["速さ", "スレ"]
  grade: 並
  text: "採点されると{d1}枚引く"
  flavor: "制度なので、置いておくだけで毎手番何かが積み上がる。"
  fx:
    - {"when": "採点時", "do": [{"引く": 1}]}
