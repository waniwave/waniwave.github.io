# ター宿のほとり「水辺と夜の動物」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hmizube_kame
  name: "カメーム"
  cat: ["動物"]
  grade: 極
  kw: ["守り18", "不壊"]
  text: "同じカテゴリの札と一緒なら倍率{+0.5}。「動物」が3枚以上重なれば倍率{x1.23}"
  flavor: "万年生きる。この局も、たぶん生き残る。"
  fx:
    - {"when": "採点時", "if": {"同じカテゴリの札が他に": true}, "do": [{"倍率": 0.5}]}
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "動物"}, "do": [{"掛け": 1.23}]}

- id: hmizube_rakko
  name: "ラッコーム"
  cat: ["動物"]
  grade: 特上
  text: "「動物」が5枚重なれば倍率{x1.51}。「動物」が3枚以上重なれば倍率{x1.25}"
  flavor: "お気に入りの石を、脇の下にしまっている。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 5, "カテゴリ": "動物"}, "do": [{"掛け": 1.51}]}
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "動物"}, "do": [{"掛け": 1.25}]}

- id: hmizube_fukurou
  name: "フクロウター"
  cat: ["動物", "ター"]
  grade: 特上
  text: "採点されると「ター」を1段上げる。2枚以上重なったカテゴリの数×{+0.6}の倍率"
  flavor: "ホー。深夜の自販機の前にいる。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "ター"}}]}
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.6"}]}

- id: hmizube_hiyoko
  name: "ヒヨコーム"
  cat: ["動物"]
  grade: 並
  text: "重なりの枚数×{+5}の強さ"
  flavor: "ピヨ。そのうちニワトリになる、と本人は言っている。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "この札の重なり*5"}]}

- id: hmizube_harinezumi
  name: "ハリネズミター"
  cat: ["動物", "ター"]
  grade: 上
  text: "採点されると「ター」を1段上げる"
  flavor: "さわると痛い。さわらなくても痛い。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "ター"}}]}

- id: hmizube_namakemono
  name: "ナマケモノター"
  cat: ["動物", "ター"]
  grade: 並
  text: "採点されると、番付で一番低いカテゴリを1段上げる"
  flavor: "動くのは、最終手番だけ。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "一番低い"}}]}

- id: hmizube_ferret
  name: "フェレッター"
  cat: ["動物", "速さ", "ター"]
  grade: 上
  kw: ["呼び水1"]
  text: "2枚以上重なったカテゴリの数×{+0.6}の倍率"
  flavor: "靴下が、片方ない。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.6"}]}
