# ター宿のほとり「ワニ騒動」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hwani_leon
  name: "タームのことをワニだと勘違いして発砲しているレオン"
  cat: ["死"]
  grade: 上
  text: "採点されると手札の一番弱い札を捨て、倍率{+1}"
  flavor: "「ワニだ！」――ワニではない。自分の名前にも「ター」が入っていることには、まだ気づいていない。"
  fx:
    - {"when": "採点時", "do": [{"捨てる": {"対象": "手札の一番弱い", "枚数": 1}}, {"倍率": 1}]}

- id: hwani_bullet
  name: "レオンの弾丸"
  cat: ["死"]
  grade: 極
  text: "失った体力×{+0.5}の強さ。体力−3。強さ{+19}"
  flavor: "ワニ用。ワニ以外にも当たる。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "失った体力*0.5"}]}
    - {"when": "採点時", "do": [{"体力": -3}, {"強さ": 19}]}

- id: hwani_wani
  name: "ワニ（本物）"
  cat: ["動物"]
  grade: 特上
  text: "重なりの枚数×{+4.2}の強さ。「動物」が3枚以上重なれば倍率{x1.25}"
  flavor: "レオンが正しかった唯一の例。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "この札の重なり*4.2"}]}
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "動物"}, "do": [{"掛け": 1.25}]}

- id: hwani_guterm
  name: "グターム"
  cat: ["死"]
  grade: 特上
  text: "体力−3。強さ{+20}。体力が3割以下なら倍率{x1.51}"
  flavor: "暗闇でのみ出現する。詳細はグタームに食べられた方にお尋ねください。"
  fx:
    - {"when": "採点時", "do": [{"体力": -3}, {"強さ": 20}]}
    - {"when": "採点時", "if": {"体力の割合以下": 0.3}, "do": [{"掛け": 1.51}]}

- id: hwani_thief
  name: "泥棒"
  cat: ["速さ"]
  grade: 上
  text: "最初に採点されると強さ{+12}"
  flavor: "痩せた男。宿のどこかに隠れ家があるらしい。"
  fx:
    - {"when": "採点時", "if": {"採点の順番": "最初"}, "do": [{"強さ": 12}]}

- id: hwani_ibukuro
  name: "グタームの胃袋"
  cat: ["死"]
  grade: 並
  text: "体力−3。強さ{+25}"
  flavor: "食べたものは、ぜんぶここにある。"
  fx:
    - {"when": "採点時", "do": [{"体力": -3}, {"強さ": 25}]}

- id: hwani_karte
  name: "ドクタームのカルテ"
  cat: ["死"]
  grade: 並
  text: "失った体力×{+0.6}の強さ"
  flavor: "「再診です」"
  fx:
    - {"when": "採点時", "do": [{"強さ": "失った体力*0.6"}]}
