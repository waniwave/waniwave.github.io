# ター宿のほとり「ワニ騒動」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hwani_leon
  name: タームのことをワニだと勘違いして発砲しているレオン
  cat: [死]
  tier: '3'
  grade: 上
  text: 出すと、狙った敵の次の行動を消す
  flavor: 「ワニだ！」――ワニではない。自分の名前にも「ター」が入っていることには、まだ気づいていない。
  fx:
  - when: 出し
    do:
    - {行動を消す: 狙い}

- id: hwani_bullet
  name: レオンの弾丸
  cat: [死]
  tier: '2'
  grade: 極
  text: 出すと、狙った敵が2ターン行動できない。採点されると掛け×2
  flavor: ワニ用。ワニ以外にも当たる。
  fx:
  - when: 出し
    do:
    - 行動停止: {対象: 狙い, ターン: 2}
  - when: 採点時
    do:
    - {掛け: 2}

- id: hwani_wani
  name: ワニ（本物）
  cat: [動物]
  tier: '2'
  grade: 特上
  text: 採点されると倍率＋（捨て札の枚数×0.5）
  flavor: レオンが正しかった唯一の例。
  fx:
  - when: 採点時
    do:
    - {倍率: 捨て札枚数*0.5}

- id: hwani_guterm
  name: グターム
  cat: [死]
  tier: '2'
  grade: 特上
  text: 同じ出しに同じカテゴリの札があれば強さ＋60
  flavor: 暗闇でのみ出現する。詳細はグタームに食べられた方にお尋ねください。
  fx:
  - when: 採点時
    if: {同じカテゴリの札が他に: true}
    do:
    - {強さ: 60}

- id: hwani_thief
  name: 泥棒
  cat: [速さ]
  tier: '3'
  grade: 上
  text: 出すと、狙った敵の主張を8%削る（層主は半分）
  flavor: 痩せた男。宿のどこかに隠れ家があるらしい。
  fx:
  - when: 出し
    do:
    - 主張を削る: {対象: 狙い, 割合: 0.08, 層主なら: 0.04}

- id: hwani_ibukuro
  name: グタームの胃袋
  cat: [死]
  tier: '5'
  grade: 並
  text: 採点されると倍率＋（捨て札の枚数×0.2）
  flavor: 食べたものは、ぜんぶここにある。
  fx:
  - when: 採点時
    do:
    - {倍率: 捨て札枚数*0.2}

- id: hwani_karte
  name: ドクタームのカルテ
  cat: [死]
  tier: '3'
  grade: 並
  text: 採点されると強さ＋20
  flavor: 「再診です」
  fx:
  - when: 採点時
    do:
    - {強さ: 20}
