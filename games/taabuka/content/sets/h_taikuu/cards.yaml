# ター宿のほとり「対空と読み」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: htaikuu_hadou
  name: "波動拳コマンド"
  cat: ["格ゲー"]
  grade: 極
  text: "この戦闘で出した回数×{+2.3}の強さ。「格ゲー」の重なりの枚数×{+0.5}の倍率"
  flavor: "↓↘→＋P。遠くから撃つのが基本。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "戦闘の出し回数*2.3"}]}
    - {"when": "採点時", "do": [{"倍率": "この札の重なり*0.5"}]}

