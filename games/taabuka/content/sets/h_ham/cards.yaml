# ター宿のほとり「ハーム」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hham_ham
  name: ハーム
  cat: [食べ物]
  tier: '2'
  grade: 極
  text: 採点されると掛け×2.2
  flavor: ハームです。
  fx:
  - when: 採点時
    do:
    - {掛け: 2.2}

- id: hham_namaham
  name: 生ハーム
  cat: [食べ物]
  tier: '4'
  grade: 上
  text: 採点されると倍率＋3
  flavor: 生ハームは生のハームです。ハームがいないと、ただの生です。
  fx:
  - when: 採点時
    do:
    - {倍率: 3}

- id: hham_namanama
  name: 生生ハーム
  cat: [食べ物]
  tier: '5'
  grade: 並
  text: 〈食べ物〉の札が2枚以上採点されると倍率＋3
  flavor: 生ハームより、さらに生。
  fx:
  - when: 出し
    if: {採点札のカテゴリ: 食べ物, 枚数以上: 2}
    do:
    - {倍率: 3}

- id: hham_hamegg
  name: ハームエッグ
  cat: [食べ物]
  tier: '2'
  grade: 特上
  text: 採点されると掛け×1.5
  flavor: ハームが先か、エッグが先か。
  fx:
  - when: 採点時
    do:
    - {掛け: 1.5}

- id: hham_jewelham
  name: 宝石をちりばめた生ハーム
  cat: [食べ物]
  tier: '3'
  grade: 特上
  text: 採点されると〈食べ物〉の番付を2段上げる
  flavor: 屋上の鳥の巣にあった。卵ではなかった。
  fx:
  - when: 採点時
    do:
    - 番付を上げる: {カテゴリ: 食べ物, 段: 2}

- id: hham_kunsei
  name: ハームの燻製
  cat: [食べ物, 死]
  tier: '4'
  grade: 上
  text: 出すと、狙った敵の主張を8%削る（層主は半分）
  flavor: 煙の中に、ハームの意地がある。
  fx:
  - when: 出し
    do:
    - 主張を削る: {対象: 狙い, 割合: 0.08, 層主なら: 0.04}

- id: hham_nokori
  name: 冷蔵庫の残り物
  cat: [食べ物, 死]
  tier: '5'
  grade: 並
  text: 採点されると倍率＋（捨て札の枚数×0.2）
  flavor: 賞味期限は、聞かないでください。
  fx:
  - when: 採点時
    do:
    - {倍率: 捨て札枚数*0.2}
