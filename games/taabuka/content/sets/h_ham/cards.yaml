# ター宿のほとり「ハーム」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hham_ham
  name: "ハーム"
  cat: ["食べ物"]
  grade: 極
  text: "採点されると、次の出しの強さ{+14}。「食べ物」が3枚以上重なれば倍率{x1.23}"
  flavor: "ハームです。"
  fx:
    - {"when": "採点時", "do": [{"次の出しの強さ": 14}]}
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "食べ物"}, "do": [{"掛け": 1.23}]}

- id: hham_namaham
  name: "生ハーム"
  cat: ["食べ物"]
  grade: 上
  text: "「食べ物」が3枚以上重なれば倍率{x1.26}"
  flavor: "生ハームは生のハームです。ハームがいないと、ただの生です。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "食べ物"}, "do": [{"掛け": 1.26}]}

- id: hham_namanama
