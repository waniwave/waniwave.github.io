    - {"when": "採点時", "do": [{"次の出しの強さ": 18}]}

- id: hham_hamegg
  name: "ハームエッグ"
  cat: ["食べ物"]
  grade: 特上
  text: "体力が満タンでなければ体力{+4.2}、満タンなら強さ{+13}。体力{+2.5}、倍率{+0.3}"
  flavor: "ハームが先か、エッグが先か。"
  fx:
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以上": 1}}, "do": [{"体力": 4.2}]}
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以下": 0}}, "do": [{"強さ": 13}]}
    - {"when": "採点時", "do": [{"体力": 2.5}, {"倍率": 0.3}]}

