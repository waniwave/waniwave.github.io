  do: [ { 番付を入れ替える: { カテゴリ: 選ぶ, 相手: 一番高い } } ]

- id: tj_bz_soirekae
  name: 総入れ替え
  kind: 番付札
  use: いつでも
  text: 番付を上下反転
  do: [ 番付を反転 ]

- id: tj_bz_suretate
  name: スレ立て
  kind: 番付札
  use: いつでも
  text: 乱数の3カテゴリを＋1段
  do:
    - 番付を上げる: { カテゴリ: 乱数, 段: 1 }
    - 番付を上げる: { カテゴリ: 乱数, 段: 1 }
    - 番付を上げる: { カテゴリ: 乱数, 段: 1 }

