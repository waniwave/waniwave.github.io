# 番付札（欠番送りは第四層以降でだけ出る：fromLayer）
- id: tj_bz_kakuage
  name: 格上げ
  kind: 番付札
  use: いつでも
  ask: [カテゴリ]
  text: 選んだカテゴリの番付＋1段
  do: [ { 番付を上げる: { カテゴリ: 選ぶ, 段: 1 } } ]

- id: tj_bz_gekokujo
