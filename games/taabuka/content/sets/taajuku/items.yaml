  fromLayer: 4
  ask: [カテゴリ]
  text: 選んだカテゴリを欠番「欠7」へ（採点札1枚ごとに倍率×1.5、その札は受けにならない。段では動かなくなる）
  do: [ { 番付を移す: { カテゴリ: 選ぶ, 先: 欠7 } } ]

