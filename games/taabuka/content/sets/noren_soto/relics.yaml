# 暖簾の外側：縁起物（置物）

- id: nr_r_neko
  name: 招き猫の置物
  grade: 上
  text: この戦闘1回目の出しの強さ＋40
  flavor: 麺ザードリィの縁起物。もとは「一番手の丼の旨味+4」。
  fx:
  - when: 出し
    if: {戦闘の出し: 1}
    do:
    - {強さ: 40}

- id: nr_r_okonomi
  name: 家系の「お好み」札
  grade: 特上
  text: 〈食べ物〉の札が3枚以上採点されると倍率＋5
  flavor: 麺ザードリィの縁起物。もとは「〈濃厚〉が3枚以上の丼の旨味+5」。
  fx:
  - when: 出し
    if: {採点札のカテゴリ: 食べ物, 枚数以上: 3}
    do:
    - {倍率: 5}

- id: nr_r_yunomi
  name: 昭和の湯呑み
  grade: 上
  text: 採点が4枚以下の出しは強さ＋30
  flavor: 麺ザードリィの縁起物。もとは「札が4枚以下の丼の旨味+3」。
  fx:
  - when: 出し
    if:
      値: {式: 採点枚数, 以下: 4}
    do:
    - {強さ: 30}

- id: nr_r_togarashi
  name: 赤い唐辛子のお守り
  grade: 上
