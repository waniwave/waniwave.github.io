# ター宿のほとり「濁点とスレ立て」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hdakuten_vyu
  name: "う゛ゅ゛"
  cat: ["スレ"]
  grade: 特上
  text: "手札が4枚以下なら、採点されると{d2}枚引く。採点されると{d1}枚引く"
  flavor: "う゛ゅ゛。"
  fx:
    - {"when": "採点時", "if": {"手札枚数以下": 4}, "do": [{"引く": 2}]}
    - {"when": "採点時", "do": [{"引く": 1}]}

- id: hdakuten_vyu2
  name: "う゛ゅ゛゛"
  cat: ["スレ"]
  grade: 極
  text: "採点されると{d1}枚引く。採点されると、このターンの流し＋1"
  flavor: "う゛ゅ゛゛。"
  fx:
    - {"when": "採点時", "do": [{"引く": 1}]}
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}

- id: hdakuten_yugyaku
  name: "ゆ虐"
  cat: ["スレ"]
  grade: 特上
  text: "採点されると{d1}枚引く。流したとき{d1}枚引く"
  flavor: "食べ物より弱いが、もっと弱いものを見つけるのはうまい。"
  fx:
    - {"when": "採点時", "do": [{"引く": 1}]}
    - {"when": "流した時", "do": [{"引く": 1}]}

- id: hdakuten_suretate
  name: "スレ立て人"
  cat: ["スレ"]
  grade: 並
  text: "採点されると{d1}枚引く"
  flavor: "「ター宿について語るスレ part1」"
  fx:
    - {"when": "採点時", "do": [{"引く": 1}]}

- id: hdakuten_tamtrol
  name: "トローム"
  cat: ["スレ"]
  grade: 上
  kw: ["呼び水1"]
  text: "流したとき{d1}枚引く"
  flavor: "2Fの廊下に立っている。通行料は一回ごと。"
  fx:
    - {"when": "流した時", "do": [{"引く": 1}]}

- id: hdakuten_meishicard
  name: "自己紹介カード"
  cat: ["校庭"]
  grade: 上
  text: "残っている敵の数×{+6}の強さ"
  flavor: "「土です」と印刷されている。全部。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "敵の数*6"}]}

- id: hdakuten_hachi
  name: "土の鉢植え"
  cat: ["校庭"]
  grade: 並
  kw: ["呼び水1"]
  text: "戦闘の3ターン目以降なら倍率{+1.6}"
  flavor: "土から、同じものが生えてくる。"
  fx:
    - {"when": "採点時", "if": {"戦闘のターン以上": 3}, "do": [{"倍率": 1.6}]}
