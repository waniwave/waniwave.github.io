# ター宿のほとり「スレ崩壊」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hhoukai_h_arashi
  name: "スレ立て荒らし"
  cat: ["スレ"]
  grade: 特上
  text: "採点されると、このターンの流し＋1。手札の枚数×{+2.1}の強さ"
  flavor: "「このスレは俺が乗っ取った」"
  fx:
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}
    - {"when": "採点時", "do": [{"強さ": "手札枚数*2.1"}]}

- id: hhoukai_h_kagami
  name: "逆さ宿の鏡"
  cat: ["スレ", "宿"]
  grade: 神
  text: "流したとき{d1}枚引く。「スレ」と「宿」が両方2枚以上重なれば倍率{x1.21}。いまの受け×{+0.3}の強さ（守った分を返す）"
  flavor: "鏡の中では、食べ物が神だった。"
  fx:
    - {"when": "流した時", "do": [{"引く": 1}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "スレ"}, {"重なり以上": 2, "カテゴリ": "宿"}], "do": [{"掛け": 1.21}]}
    - {"when": "採点時", "do": [{"強さ": "受け*0.3"}]}

- id: hhoukai_h_otsu
  name: ">>1乙"
  cat: ["スレ"]
  grade: 上
  text: "採点されると{d1}枚引く"
  flavor: "乙と言った者が、次のスレを立てる。"
  fx:
    - {"when": "採点時", "do": [{"引く": 1}]}

- id: hhoukai_h_jisure
  name: "次スレ"
  cat: ["スレ"]
  grade: 上
  text: "採点されると、このターンの流し＋1"
  flavor: "「次スレはこちら」→ルールが増えている。"
  fx:
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}

- id: hhoukai_h_dat
  name: "dat落ち職人"
  cat: ["スレ"]
  grade: 特上
  text: "手札の枚数×{+2.1}の強さ。手札が4枚以下なら、採点されると{d2}枚引く"
  flavor: "書き込まないことで、スレを殺す。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "手札枚数*2.1"}]}
    - {"when": "採点時", "if": {"手札枚数以下": 4}, "do": [{"引く": 2}]}

- id: hhoukai_h_jien
  name: "IDの変わる人"
  cat: ["スレ"]
  grade: 並
  text: "採点されると、このターンの流し＋1"
  flavor: "「自演乙」「別人だが？」"
  fx:
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}

- id: hhoukai_h_matome
  name: "まとめサイト転載"
  cat: ["スレ"]
  grade: 並
  kw: ["呼び水1"]
  text: "採点されると{d1}枚引く"
  flavor: "【悲報】ター宿、まとめられる"
  fx:
    - {"when": "採点時", "do": [{"引く": 1}]}
