# ター宿のほとり「守りの宿」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hmamori_m_kagami
  name: "合わせ鏡"
  cat: ["宿"]
  grade: 並
  kw: ["守り5"]
  text: "いまの受け×{+0.5}の強さ（守った分を返す）"
  flavor: "洗面所の鏡と、廊下の鏡が向かい合っている。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "受け*0.5"}]}

- id: hmamori_m_kekkai
  name: "立入禁止テープ"
  cat: ["宿"]
  grade: 極
  kw: ["呼び水2"]
  text: "受けに回ると受け{+9}。採点されると受け{+3.8}。採点されると、2割5分で狙った敵の次の行動を消す"
  flavor: "清掃中。"
  fx:
    - {"when": "受けに回る", "do": [{"受け": 9}]}
    - {"when": "採点時", "do": [{"受け": 3.8}]}
    - {"when": "採点時", "if": {"確率": 0.25}, "do": [{"行動を消す": "狙い"}]}

- id: hmamori_m_migawari
  name: "身代わりの浴衣"
  cat: ["宿"]
  grade: 並
  text: "受けに回ると受け{+12}。採点されると受け{+5}"
  flavor: "中身は、もういない。"
  fx:
    - {"when": "受けに回る", "do": [{"受け": 12}]}
    - {"when": "採点時", "do": [{"受け": 5}]}

- id: hmamori_k_bousai
  name: "防災ずきん"
  cat: ["宿"]
  grade: 上
  kw: ["守り8"]
  text: "手札にあるまま終わると受け{+5}"
  flavor: "避難訓練は、毎月第2水曜日。"
  fx:
    - {"when": "ターン終了", "do": [{"受け": 5}]}

- id: hmamori_k_kekkai2
  name: "宿の結界"
  cat: ["宿"]
  grade: 上
  text: "いまの受け×{+0.4}の強さ（守った分を返す）"
  flavor: "チェックアウトの直前に、いちばん強く張られる。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "受け*0.4"}]}

- id: hmamori_m_kakolog
