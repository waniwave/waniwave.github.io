# ター宿のほとり「移動の旅」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hidou_backstep
  name: "バクステ"
  cat: ["格ゲー", "速さ"]
  grade: 特上
  kw: ["呼び水2"]
  text: "戦闘の1回目の出しなら倍率{+1}。「格ゲー」と「速さ」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "←←。とりあえず下がる。"
  fx:
    - {"when": "採点時", "if": {"戦闘の出し": 1}, "do": [{"倍率": 1}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "格ゲー"}, {"重なり以上": 2, "カテゴリ": "速さ"}], "do": [{"掛け": 1.3}]}

- id: hidou_mekuri
  name: "めくり"
  cat: ["格ゲー", "速さ"]
  grade: 特上
  kw: ["呼び水2"]
  text: "このターン2回目の出しなら倍率{+1.4}。「格ゲー」と「速さ」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "どっちにガードすればいいのか、わからない。"
  fx:
    - {"when": "採点時", "if": {"このターンの出し": 2}, "do": [{"倍率": 1.4}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "格ゲー"}, {"重なり以上": 2, "カテゴリ": "速さ"}], "do": [{"掛け": 1.3}]}

- id: hidou_komanage
  name: "コマ投げ"
  cat: ["格ゲー", "速さ"]
  grade: 上
  text: "「格ゲー」と「速さ」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "レバーを一回転。"
  fx:
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "格ゲー"}, {"重なり以上": 2, "カテゴリ": "速さ"}], "do": [{"掛け": 1.3}]}

- id: hidou_zanzou
  name: "秒速5タームメートルの残像"
  cat: ["速さ", "ター"]
  grade: 並
  text: "このターン最初の出しで採点されると、このターンの出し＋1"
  flavor: "本体はもう3部屋先にいる。"
  fx:
    - {"when": "採点時", "if": {"このターンの出し": 1}, "do": [{"出し回数": {"増減": 1, "期間": "ターン"}}]}

- id: hidou_sneaker
  name: "秒速のスニーカー"
  cat: ["速さ"]
  grade: 上
  text: "戦闘の1〜2ターン目なら倍率{x1.22}"
  flavor: "履くと秒速5タームメートル。"
  fx:
    - {"when": "採点時", "if": {"でない": {"戦闘のターン以上": 3}}, "do": [{"掛け": 1.22}]}

- id: hidou_penguin
  name: "ペンギンター"
  cat: ["動物", "速さ", "ター"]
  grade: 並
  text: "最初に採点されると強さ{+14}"
  flavor: "廊下は、よく滑る。"
  fx:
    - {"when": "採点時", "if": {"採点の順番": "最初"}, "do": [{"強さ": 14}]}

- id: hidou_iruka
  name: "イルカーム"
  cat: ["動物", "速さ"]
  grade: 極
  text: "このターン最初の出しで採点されると、このターンの出し＋1。採点札のカテゴリの種類×{+4.6}の強さ"
  flavor: "ター湯で、ジャンプの練習をしている。"
  fx:
    - {"when": "採点時", "if": {"このターンの出し": 1}, "do": [{"出し回数": {"増減": 1, "期間": "ターン"}}]}
    - {"when": "採点時", "do": [{"強さ": "カテゴリの種類*4.6"}]}
