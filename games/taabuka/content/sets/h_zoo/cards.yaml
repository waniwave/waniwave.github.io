# ター宿のほとり「屋上動物園」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hzoo_tanuki
  name: "ターヌキ"
  cat: ["動物", "ター"]
  grade: 特上
  text: "採点されると、番付で一番低いカテゴリを1段上げる。採点札のカテゴリが3種類以上なら倍率{+1}"
  flavor: "葉っぱを頭にのせると、ター宿の札に化ける。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "一番低い"}}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 1}]}

- id: hzoo_kitsune
  name: "キターツネ"
  cat: ["動物", "ター"]
  grade: 特上
  text: "採点されると「ター」をTier8（博打）に送る。強さ{+8}。採点札のカテゴリの種類×{+5}の強さ"
  flavor: "こんこん。化かされた札は、自分が何Tierか忘れる。"
  fx:
    - {"when": "採点時", "do": [{"番付を移す": {"カテゴリ": "ター", "先": "8"}}, {"強さ": 8}]}
    - {"when": "採点時", "do": [{"強さ": "カテゴリの種類*5"}]}

- id: hzoo_neko
  name: "ネコターン"
  cat: ["動物", "ター"]
  grade: 上
  text: "採点されると、番付で一番低いカテゴリを1段上げる"
  flavor: "ごはんの時間を、絶対に忘れない。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "一番低い"}}]}

- id: hzoo_koneko
  name: "子ネコターン"
  cat: ["動物", "ター"]
  grade: 並
  text: "この札のTierの段の高さ×{+0.4}の倍率"
  flavor: "親のまねをして、ごはんの皿をひっくり返す。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "Tierの段*0.4"}]}

- id: hzoo_kapibara
  name: "カピバターラ"
  cat: ["動物", "湯", "ター"]
  grade: 上
  text: "採点札のカテゴリが3種類以上なら倍率{+1}"
  flavor: "ずっと湯に浸かっている。チルの化身。"
  fx:
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 1}]}

- id: hzoo_gorilla
  name: "ゴリラーム"
  cat: ["動物"]
  grade: 極
  text: "同じカテゴリの札と一緒なら倍率{+0.5}。重なりの枚数×{+3.8}の強さ"
  flavor: "ウホ。胸を叩くたびに、Tierが上がる。"
  fx:
    - {"when": "採点時", "if": {"同じカテゴリの札が他に": true}, "do": [{"倍率": 0.5}]}
    - {"when": "採点時", "do": [{"強さ": "この札の重なり*3.8"}]}

- id: hzoo_shiikuin
  name: "動物園の飼育員"
  cat: ["動物"]
  grade: 並
  text: "重なりの枚数×{+5}の強さ"
  flavor: "餌の時間を、すべての動物に知らせる係。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "この札の重なり*5"}]}
