# ター宿のほとり「屋上動物園」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hzoo_tanuki
  name: ターヌキ
  cat: [動物, ター]
  tier: '4'
  grade: 特上
  text: 〈食べ物〉の札が2枚以上採点されると掛け×1.6
  flavor: 葉っぱを頭にのせると、ター宿の札に化ける。
  fx:
  - when: 出し
    if: {採点札のカテゴリ: 食べ物, 枚数以上: 2}
    do:
    - {掛け: 1.6}

