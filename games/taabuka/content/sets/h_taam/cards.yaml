# ター宿のほとり「TAAM」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: htaam_obaasan
  name: "TAAMで最初に死んだおばあさん"
  cat: ["死", "老"]
  grade: 並
  text: "採点されるたびに育つ。育ち×{+0.2}の倍率（この潜行のあいだ残る）"
  flavor: "最初に死ぬ。それが彼女の役目。"
  fx:
    - {"when": "採点時", "do": [{"育つ": 1}, {"倍率": "育ち*0.2"}]}

- id: htaam_ojiisan
  name: "TAAMで最後死んだおじいさん"
  cat: ["死", "老"]
  grade: 特上
  text: "採点されるたびに育つ。育ち×{+0.2}の倍率（この潜行のあいだ残る）。採点札のカテゴリが3種類以上なら倍率{+1}"
  flavor: "最後に死ぬ。それまでは元気だ。"
  fx:
    - {"when": "採点時", "do": [{"育つ": 1}, {"倍率": "育ち*0.2"}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 1}]}

- id: htaam_mago
  name: "TAAMで最後生き残った孫"
  cat: ["死"]
  grade: 上
  text: "採点されると手札の一番弱い札を捨て、倍率{+1}"
  flavor: "おじいさんもおばあさんも死んだ。孫は強くなった。"
  fx:
    - {"when": "採点時", "do": [{"捨てる": {"対象": "手札の一番弱い", "枚数": 1}}, {"倍率": 1}]}

- id: htaam_eterm
  name: "エターム"
  cat: ["死"]
  grade: 並
  text: "失った体力×{+0.6}の強さ"
  flavor: "永遠のターム。今度こそ本当に永遠。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "失った体力*0.6"}]}

- id: htaam_before
  name: "ビフォー・エターム"
  cat: ["死"]
  grade: 特上
  text: "体力−3。強さ{+20}。体力が3割以下なら倍率{x1.51}"
  flavor: "永遠になる前のターム。"
  fx:
    - {"when": "採点時", "do": [{"体力": -3}, {"強さ": 20}]}
    - {"when": "採点時", "if": {"体力の割合以下": 0.3}, "do": [{"掛け": 1.51}]}

- id: htaam_terjr
  name: "ターミネーターの弟、ターミネータジュニア"
  cat: ["死", "ター"]
  grade: 極
  text: "採点されると「ター」を1段上げる。「死」と「ター」が両方2枚以上重なれば倍率{x1.27}"
  flavor: "兄は来ていない。代わりに、何度でも強くなって来る。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "ター"}}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "死"}, {"重なり以上": 2, "カテゴリ": "ター"}], "do": [{"掛け": 1.27}]}

- id: htaam_doctor
  name: "ドクターム"
  cat: ["死"]
  grade: 上
  text: "体力−3。強さ{+20}"
  flavor: "湯治の先生。処方はだいたい「湯」。"
  fx:
    - {"when": "採点時", "do": [{"体力": -3}, {"強さ": 20}]}
