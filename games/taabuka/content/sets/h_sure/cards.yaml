# ター宿のほとり「佐々木強さ議論スレ」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hsure_sasakisure
  name: "佐々木強さ議論スレ"
  cat: ["スレ"]
  grade: 上
  text: "採点されると、このターンの流し＋1"
  flavor: "どの佐々木なのかは、スレの中でも結論が出ていない。"
  fx:
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}

- id: hsure_sasaki
  name: "佐々木"
  cat: ["スレ"]
  grade: 並
  text: "採点されると、このターンの流し＋1"
  flavor: "「どの佐々木？」「この佐々木」"
  fx:
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}

- id: hsure_sasasa
  name: "佐々木の佐々木"
  cat: ["スレ"]
  grade: 極
  text: "採点されると、このターンの流し＋1。手札の枚数×{+1.9}の強さ"
  flavor: "佐々木の中の佐々木。"
  fx:
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}
    - {"when": "採点時", "do": [{"強さ": "手札枚数*1.9"}]}

- id: hsure_nanashi
  name: "名無しのター"
  cat: ["スレ", "ター"]
  grade: 並
  text: "手札の枚数×{+2.5}の強さ"
  flavor: "1 名無しのター：佐々木は強い"
  fx:
    - {"when": "採点時", "do": [{"強さ": "手札枚数*2.5"}]}

- id: hsure_anchor
  name: ">>1"
  cat: ["スレ"]
  grade: 特上
  text: "流したとき{d1}枚引く。手札が4枚以下なら、採点されると{d2}枚引く"
  flavor: ">>1 乙"
  fx:
    - {"when": "流した時", "do": [{"引く": 1}]}
    - {"when": "採点時", "if": {"手札枚数以下": 4}, "do": [{"引く": 2}]}

- id: hsure_datochi
  name: "スレのdat落ち"
  cat: ["スレ"]
  grade: 上
  text: "流したとき{d1}枚引く"
  flavor: "過去ログに、さようなら。"
  fx:
    - {"when": "流した時", "do": [{"引く": 1}]}
