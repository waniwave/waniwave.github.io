# ター宿のほとり「起き攻めとゲージ」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hokizeme_okizeme
  name: "起き攻め"
  cat: ["格ゲー"]
  grade: 特上
  text: "「格ゲー」の重なりの枚数×{+0.5}の倍率。このターン2回目の出しなら倍率{+1.4}"
  flavor: "倒れた相手に、重ねる。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "この札の重なり*0.5"}]}
    - {"when": "採点時", "if": {"このターンの出し": 2}, "do": [{"倍率": 1.4}]}

