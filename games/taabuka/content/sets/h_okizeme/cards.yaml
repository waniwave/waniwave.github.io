# ター宿のほとり「起き攻めとゲージ」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hokizeme_okizeme
  name: 起き攻め
  cat: [格ゲー]
  tier: '2'
  grade: 特上
  text: 同じ出しに同じカテゴリの札があれば強さ＋60
  flavor: 倒れた相手に、重ねる。
  fx:
  - when: 採点時
    if: {同じカテゴリの札が他に: true}
