# ター宿のほとり「守りと心理戦」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hshinri_tairyoku
  name: "体力リード"
  cat: ["格ゲー"]
  grade: 上
  text: "採点されると、狙った敵に{+16}の追撃"
  flavor: "リードしたら、守る。"
  fx:
    - {"when": "採点時", "do": [{"主張を削る": {"対象": "狙い", "量": 16}}]}

- id: hshinri_timeup
  name: "タイムアップ"
  cat: ["格ゲー"]
  grade: 極
  text: "この戦闘で出した回数×{+2.3}の強さ。採点されると、狙った敵に{+14}の追撃"
  flavor: "体力リードしていれば、勝ち。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "戦闘の出し回数*2.3"}]}
    - {"when": "採点時", "do": [{"主張を削る": {"対象": "狙い", "量": 14}}]}

- id: hshinri_leverless
  name: "レバーレス"
  cat: ["格ゲー"]
  grade: 上
  text: "「格ゲー」の重なりの枚数×{+0.5}の倍率"
  flavor: "ボタンだけで、昇龍が出る。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "この札の重なり*0.5"}]}

- id: hshinri_kezuri
  name: "逆張り"
  cat: ["格ゲー", "スレ"]
  grade: 並
  text: "手札が4枚以下なら、採点されると{d2}枚引く"
  flavor: "みんなが上げるなら、下げる。"
  fx:
    - {"when": "採点時", "if": {"手札枚数以下": 4}, "do": [{"引く": 2}]}

- id: hshinri_kusshin
  name: "屈伸煽り"
  cat: ["格ゲー"]
  grade: 並
  text: "このターン2回目の出しなら倍率{+1.6}"
  flavor: "マナーは悪い。効果はある。"
  fx:
    - {"when": "採点時", "if": {"このターンの出し": 2}, "do": [{"倍率": 1.6}]}

- id: hshinri_fg_guard
  name: "しゃがみガード"
  cat: ["格ゲー"]
  grade: 特上
  text: "この戦闘で出した回数×{+2.5}の強さ。採点されると、狙った敵に{+15}の追撃"
  flavor: "下段も中段も、全部ガードすればいい。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "戦闘の出し回数*2.5"}]}
    - {"when": "採点時", "do": [{"主張を削る": {"対象": "狙い", "量": 15}}]}

- id: hshinri_m_ukemi
  name: "受け身"
  cat: ["格ゲー"]
  grade: 特上
  text: "採点されると、狙った敵に{+15}の追撃。この戦闘で出した回数×{+2.5}の強さ"
  flavor: "起き攻めは、受け身から始まる。"
  fx:
    - {"when": "採点時", "do": [{"主張を削る": {"対象": "狙い", "量": 15}}]}
    - {"when": "採点時", "do": [{"強さ": "戦闘の出し回数*2.5"}]}
