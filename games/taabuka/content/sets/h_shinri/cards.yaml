# ター宿のほとり「守りと心理戦」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hshinri_tairyoku
  name: 体力リード
  cat: [格ゲー]
  tier: '2'
  grade: 上
  text: ターン終了時に手札にあれば受け＋6
  flavor: リードしたら、守る。
  fx:
  - when: ターン終了
    do:
    - {受け: 6}

- id: hshinri_timeup
  name: タイムアップ
  cat: [格ゲー]
  tier: '1'
  grade: 極
  text: 出すと、狙った敵が2ターン行動できない。採点されると掛け×2
  flavor: 体力リードしていれば、勝ち。
  fx:
  - when: 出し
    do:
    - 行動停止: {対象: 狙い, ターン: 2}
  - when: 採点時
    do:
    - {掛け: 2}

- id: hshinri_leverless
