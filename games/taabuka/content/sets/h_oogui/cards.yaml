# ター宿のほとり「大食い」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hoogui_ramen
  name: "ラーメーン"
  cat: ["食べ物", "麺"]
  grade: 特上
  text: "「食べ物」が3枚以上重なれば倍率{x1.25}。採点札のカテゴリが3種類以上なら倍率{+1}"
  flavor: "スープはター油ベース。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "食べ物"}, "do": [{"掛け": 1.25}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 1}]}

- id: hoogui_gekikara
  name: "激辛ターリー"
  cat: ["食べ物", "ター"]
  grade: 極
  text: "採点されると、次の出しの強さ{+14}。「食べ物」と「ター」が両方2枚以上重なれば倍率{x1.27}"
  flavor: "カレーの上位版。辛さはTier God。"
  fx:
    - {"when": "採点時", "do": [{"次の出しの強さ": 14}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "食べ物"}, {"重なり以上": 2, "カテゴリ": "ター"}], "do": [{"掛け": 1.27}]}

- id: hoogui_wasabi
  name: "わさび"
  cat: ["食べ物"]
  grade: 上
  text: "「食べ物」が3枚以上重なれば倍率{x1.26}"
  flavor: "定食の刺身に、いつのまにか付いてくる。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "食べ物"}, "do": [{"掛け": 1.26}]}

- id: hoogui_gohan
  name: "ごはんのおかわり"
  cat: ["食べ物"]
  grade: 特上
  text: "体力が満タンでなければ体力{+4.2}、満タンなら強さ{+13}。体力{+2.5}、倍率{+0.3}"
  flavor: "おかわりは自由です。"
  fx:
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以上": 1}}, "do": [{"体力": 4.2}]}
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以下": 0}}, "do": [{"強さ": 13}]}
    - {"when": "採点時", "do": [{"体力": 2.5}, {"倍率": 0.3}]}

- id: hoogui_makanai
  name: "まかない"
  cat: ["食べ物", "宿"]
  grade: 上
  text: "採点札のカテゴリの種類×{+5}の強さ"
  flavor: "宿の従業員だけが食べられる。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "カテゴリの種類*5"}]}

- id: hoogui_dessert
  name: "デザートは別腹"
  cat: ["食べ物"]
  grade: 並
  text: "体力{+3}、倍率{+0.4}"
  flavor: "定食のあとでも入る。"
  fx:
    - {"when": "採点時", "do": [{"体力": 3}, {"倍率": 0.4}]}

- id: hoogui_takoyaki
  name: "ター焼き"
  cat: ["食べ物", "ター"]
  grade: 並
  text: "「食べ物」が3枚以上重なれば倍率{x1.3}"
  flavor: "中に入っているのは、ターコ。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "食べ物"}, "do": [{"掛け": 1.3}]}
