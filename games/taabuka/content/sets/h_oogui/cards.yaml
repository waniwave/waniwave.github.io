# ター宿のほとり「大食い」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hoogui_ramen
  name: ラーメーン
  cat: [食べ物, 麺]
  tier: '3'
  grade: 特上
  text: 〈食べ物〉の札が2枚以上採点されると掛け×1.6
  flavor: スープはター油ベース。
  fx:
  - when: 出し
    if: {採点札のカテゴリ: 食べ物, 枚数以上: 2}
    do:
    - {掛け: 1.6}

- id: hoogui_gekikara
  name: 激辛ターリー
  cat: [食べ物, ター]
  tier: '2'
  grade: 極
  text: 出すと、狙った敵の主張を18%削る（層主は半分）。採点されると掛け×2
  flavor: カレーの上位版。辛さはTier God。
  fx:
  - when: 出し
    do:
    - 主張を削る: {対象: 狙い, 割合: 0.18, 層主なら: 0.09}
  - when: 採点時
    do:
    - {掛け: 2}

