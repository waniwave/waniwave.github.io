# ター宿のほとり「欠番と専用」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hkesu_kesu6
  name: "欠番Tier6"
  cat: ["死"]
  grade: 特上
  text: "失った体力×{+0.5}の強さ。体力−3。強さ{+20}"
  flavor: "宿泊約款第8条「Tier6とTier7は欠番とする。理由は聞かない」"
  fx:
    - {"when": "採点時", "do": [{"強さ": "失った体力*0.5"}]}
    - {"when": "採点時", "do": [{"体力": -3}, {"強さ": 20}]}

- id: hkesu_kesu7
  name: "欠番Tier7"
  cat: ["死"]
  grade: 特上
  text: "採点されると手札の一番弱い札を捨て、倍率{+1}。体力が3割以下なら倍率{x1.51}"
  flavor: "理由は聞かない。"
  fx:
    - {"when": "採点時", "do": [{"捨てる": {"対象": "手札の一番弱い", "枚数": 1}}, {"倍率": 1}]}
    - {"when": "採点時", "if": {"体力の割合以下": 0.3}, "do": [{"掛け": 1.51}]}

- id: hkesu_kesu9
  name: "欠番Tier9（存在しない）"
  cat: ["死"]
  grade: 上
  text: "採点されると手札の一番弱い札を捨て、倍率{+1}"
  flavor: "有識者会議で「Tier9は？」と聞いた人が、こうなった。"
  fx:
    - {"when": "採点時", "do": [{"捨てる": {"対象": "手札の一番弱い", "枚数": 1}}, {"倍率": 1}]}

- id: hkesu_senyou
  name: "taaaam様専用"
  cat: ["ター"]
  grade: 並
  text: "採点されると「ター」を1段上げる"
  flavor: "専用とは、他の誰も使えないということだ。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "ター"}}]}

- id: hkesu_slipper
  name: "taaaam様専用スリッパ"
  cat: ["ター", "宿"]
  grade: 並
  text: "採点されると、2割5分で狙った敵の次の行動を消す"
  flavor: "専用のスリッパも、専用だ。"
  fx:
    - {"when": "採点時", "if": {"確率": 0.25}, "do": [{"行動を消す": "狙い"}]}

- id: hkesu_gesoku
  name: "下足札"
  cat: ["宿"]
  grade: 極
  kw: ["呼び水2"]
  text: "手札にあるまま終わると受け{+4.6}。受けに回ると受け{+9}。採点されると受け{+3.8}"
  flavor: "番号は合っている。中身が違う。"
  fx:
    - {"when": "ターン終了", "do": [{"受け": 4.6}]}
    - {"when": "受けに回る", "do": [{"受け": 9}]}
    - {"when": "採点時", "do": [{"受け": 3.8}]}

- id: hkesu_setsudan
  name: "負け確切断"
  cat: ["格ゲー"]
  grade: 上
  text: "このターン2回目の出しなら倍率{+1.4}"
  flavor: "マナーは悪い。Tier8。"
  fx:
    - {"when": "採点時", "if": {"このターンの出し": 2}, "do": [{"倍率": 1.4}]}
