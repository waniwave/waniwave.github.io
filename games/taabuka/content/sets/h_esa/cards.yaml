# ター宿のほとり「動物と餌」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hesa_hamster
  name: "ハムスター"
  cat: ["動物"]
  grade: 上
  text: "「動物」が5枚重なれば倍率{x1.52}"
  flavor: "ほお袋に、ター宿の半分が入っている。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 5, "カテゴリ": "動物"}, "do": [{"掛け": 1.52}]}

- id: hesa_panda
  name: "パンダーム"
  cat: ["動物"]
  grade: 特上
  text: "「動物」が5枚重なれば倍率{x1.51}。重なりの枚数×{+4.2}の強さ"
  flavor: "笹がないので、定食を食べている。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 5, "カテゴリ": "動物"}, "do": [{"掛け": 1.51}]}
    - {"when": "採点時", "do": [{"強さ": "この札の重なり*4.2"}]}

- id: hesa_kuma
  name: "クマーム"
  cat: ["動物"]
  grade: 極
  text: "「動物」が3枚以上重なれば倍率{x1.23}。重なりの枚数×{+3.8}の強さ"
  flavor: "冬眠の前に、宴会場を一周する。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "動物"}, "do": [{"掛け": 1.23}]}
    - {"when": "採点時", "do": [{"強さ": "この札の重なり*3.8"}]}

- id: hesa_wanta
  name: "ワンターン"
  cat: ["動物", "ター"]
  grade: 上
  text: "2枚以上重なったカテゴリの数×{+0.6}の倍率"
  flavor: "おすわり、まで1手番かかる。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.6"}]}

- id: hesa_risu
  name: "リスーム"
  cat: ["動物"]
  grade: 並
  text: "重なりの枚数×{+5}の強さ"
  flavor: "隠した場所は、たいてい忘れる。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "この札の重なり*5"}]}

- id: hesa_alpaca
  name: "アルパカーター"
  cat: ["動物", "ター"]
  grade: 特上
  text: "重なりの枚数×{+4.2}の強さ。採点札のカテゴリが3種類以上なら倍率{+1}"
  flavor: "怒るとつばを吐く。怒っていなくても吐く。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "この札の重なり*4.2"}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 1}]}

- id: hesa_onigiri
  name: "おにぎりーム"
  cat: ["食べ物"]
  grade: 並
  text: "体力{+3}、倍率{+0.4}"
  flavor: "具は、ター油。"
  fx:
    - {"when": "採点時", "do": [{"体力": 3}, {"倍率": 0.4}]}
