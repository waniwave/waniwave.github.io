# ター宿のほとり「動物と餌」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hesa_hamster
  name: ハムスター
  cat: [動物]
  tier: '4'
  grade: 上
  text: 採点されると倍率＋3
  flavor: ほお袋に、ター宿の半分が入っている。
  fx:
  - when: 採点時
    do:
    - {倍率: 3}

- id: hesa_panda
  name: パンダーム
  cat: [動物]
  tier: '1'
  grade: 特上
  text: 〈食べ物〉の札が2枚以上採点されると掛け×1.6
  flavor: 笹がないので、定食を食べている。
  fx:
  - when: 出し
    if: {採点札のカテゴリ: 食べ物, 枚数以上: 2}
    do:
    - {掛け: 1.6}

- id: hesa_kuma
  name: クマーム
  cat: [動物]
  tier: '0'
  grade: 極
  text: 採点されると倍率＋（捨て札の枚数×0.8）。採点されると掛け×2
  flavor: 冬眠の前に、宴会場を一周する。
  fx:
  - when: 採点時
    do:
    - {倍率: 捨て札枚数*0.8}
  - when: 採点時
    do:
    - {掛け: 2}

- id: hesa_wanta
  name: ワンターン
  cat: [動物, ター]
  tier: '3'
  grade: 上
  text: 体力が半分以下なら掛け×1.5
  flavor: おすわり、まで1手番かかる。
  fx:
  - when: 採点時
    if: {体力の割合以下: 0.5}
    do:
    - {掛け: 1.5}

- id: hesa_risu
  name: リスーム
  cat: [動物]
  tier: '5'
  grade: 並
  text: 採点されると強さ＋12
  flavor: 隠した場所は、たいてい忘れる。
  fx:
  - when: 採点時
    do:
    - {強さ: 12}

- id: hesa_alpaca
  name: アルパカーター
  cat: [動物, ター]
  tier: '2'
  grade: 特上
  text: 同じ出しに同じカテゴリの札があれば強さ＋60
  flavor: 怒るとつばを吐く。怒っていなくても吐く。
  fx:
  - when: 採点時
    if: {同じカテゴリの札が他に: true}
    do:
    - {強さ: 60}

- id: hesa_onigiri
  name: おにぎりーム
  cat: [食べ物]
  tier: '4'
  grade: 並
  text: 採点されると強さ＋16
  flavor: 具は、ター油。
  fx:
  - when: 採点時
    do:
    - {強さ: 16}
