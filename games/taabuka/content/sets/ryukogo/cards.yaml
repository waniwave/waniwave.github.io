- id: rk_taipa
  name: タイパ悪すぎ
  cat: [速さ]
  tier: 2
  grade: 上
  text: 演出が止まり、早送りできない。代わりに論破値×10
  flavor: 倍速で見ても長い。
  fx:
    - when: 出しの前
      do:
        - ルール: { 名前: 演出を早送り不可に, 範囲: この出し }
    - when: 採点時
      do:
        - 論破値を掛ける: 10
  show:
    - 読み込み中
  test:
    - hand: [rk_taipa]
      expect: { V: 130 }

