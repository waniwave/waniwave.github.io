# 流行語（企画書 第5章）。30枚

- id: rk_jujo_satosatoru
  name: 十条さとさとる
  cat: [ター]
  tier: God
  grade: 神
  kw: [二倍]
  text: 採点されると敵全員が2ターン行動できない
  flavor: 五条悟の二倍の強さを誇る。
  fx:
    - when: 採点時
      do:
        - 行動停止: { 対象: 敵全員, ターン: 2 }   # 二倍なので4ターン
  show:
    - 二重像
    - カットイン: 領域領域てんかてんか展開むりょむりょ無量くうしょくうしょ
  test:
    - hand: [rk_jujo_satosatoru, { tier: God, cat: [ター] }]
      expect: { 組: 対, V: 140, 行動停止: { 0: 4 }, なしより大きい: true, 演出: [文字二回] }

- id: rk_shineei
  name: 死ねーぃ
  cat: [死]
  tier: 1
  grade: 特上
  text: 狙った敵の主張を0にする（層主・底の主は半分）。その戦闘の残りは出し−1
  flavor: 一言で終わる。
  fx:
    - when: 採点時
      do:
        - 主張を削る: { 対象: 狙い, 割合: 1.0, 層主なら: 0.5 }
        - 出し回数: { 増減: -1, 期間: 戦闘 }
  show:
    - 筆文字: 死ねーぃ
    - 斬る
  test:
    - hand: [rk_shineei, { tier: 3, cat: [麺] }]
      play: [0]
      enemies: [{ claim: 1000 }]
      expect: { enemy0: 0, 結果: win }
    - hand: [rk_shineei, { tier: 3, cat: [麺] }]
      play: [0]
      enemies: [{ claim: 1000, kind: 層主 }]
      expect: { enemy0: 485, 出し残り: 0 }

