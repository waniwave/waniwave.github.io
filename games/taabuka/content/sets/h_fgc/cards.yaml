# ター宿のほとり「ゲーセン」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hfgc_shoryu
  name: "昇龍拳コマンド"
  cat: ["格ゲー"]
  grade: 特上
  text: "この戦闘で出した回数×{+2.5}の強さ。このターン2回目の出しなら倍率{+1.4}"
  flavor: "→↓↘＋P。出せるまで、宿に泊まり込みで練習した。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "戦闘の出し回数*2.5"}]}
    - {"when": "採点時", "if": {"このターンの出し": 2}, "do": [{"倍率": 1.4}]}

- id: hfgc_kakuhan
  name: "確定反撃"
  cat: ["格ゲー"]
  grade: 上
  text: "「格ゲー」の重なりの枚数×{+0.5}の倍率"
  flavor: "通称「確反」。動いたら、負け。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "この札の重なり*0.5"}]}

- id: hfgc_nuke
  name: "投げ抜け"
  cat: ["格ゲー"]
  grade: 上
  text: "採点されると、狙った敵に{+16}の追撃"
  flavor: "つかまれたら、すぐ押す。"
  fx:
    - {"when": "採点時", "do": [{"主張を削る": {"対象": "狙い", "量": 16}}]}

- id: hfgc_matsu
  name: "待ち"
  cat: ["格ゲー"]
  grade: 並
  text: "この戦闘で出した回数×{+3}の強さ"
  flavor: "動いたほうが負け。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "戦闘の出し回数*3"}]}

- id: hfgc_umehara
  name: "ウメハラ"
  cat: ["格ゲー"]
  grade: 並
  text: "採点されると、狙った敵に{+18}の追撃"
  flavor: "格ゲーの伝説として、スレでもよく名前が挙がる。"
  fx:
    - {"when": "採点時", "do": [{"主張を削る": {"対象": "狙い", "量": 18}}]}

- id: hfgc_taipan
  name: "台パン"
  cat: ["格ゲー"]
  grade: 極
  text: "「格ゲー」の重なりの枚数×{+0.5}の倍率。この戦闘で出した回数×{+2.3}の強さ"
  flavor: "マナーは悪い。筐体も悪くない。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "この札の重なり*0.5"}]}
    - {"when": "採点時", "do": [{"強さ": "戦闘の出し回数*2.3"}]}

- id: hfgc_tenin
  name: "ゲームセンターの店員"
  cat: ["格ゲー"]
  grade: 特上
  text: "このターン2回目の出しなら倍率{+1.4}。「格ゲー」の重なりの枚数×{+0.5}の倍率"
  flavor: "台パンには、厳しい。"
  fx:
    - {"when": "採点時", "if": {"このターンの出し": 2}, "do": [{"倍率": 1.4}]}
