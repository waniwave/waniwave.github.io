# ター宿のほとり「ゲーセン」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hfgc_shoryu
  name: 昇龍拳コマンド
  cat: [格ゲー]
  tier: '3'
  grade: 特上
  text: 同じ出しに同じカテゴリの札があれば強さ＋60
  flavor: →↓↘＋P。出せるまで、宿に泊まり込みで練習した。
  fx:
  - when: 採点時
    if: {同じカテゴリの札が他に: true}
    do:
    - {強さ: 60}

- id: hfgc_kakuhan
  name: 確定反撃
  cat: [格ゲー]
  tier: '3'
  grade: 上
  text: 出すと、狙った敵の次の行動を消す
  flavor: 通称「確反」。動いたら、負け。
  fx:
  - when: 出し
    do:
    - {行動を消す: 狙い}

- id: hfgc_nuke
  name: 投げ抜け
  cat: [格ゲー]
  tier: '3'
  grade: 上
  text: 採点されると倍率＋3
  flavor: つかまれたら、すぐ押す。
  fx:
  - when: 採点時
    do:
    - {倍率: 3}

- id: hfgc_matsu
  name: 待ち
  cat: [格ゲー]
  tier: '3'
  grade: 並
  text: 採点されると倍率＋（組の段位）
  flavor: 動いたほうが負け。
  fx:
  - when: 採点時
    do:
    - {倍率: 段位}

- id: hfgc_umehara
  name: ウメハラ
  cat: [格ゲー]
  tier: '4'
  grade: 並
  text: 体力が半分以下なら掛け×1.3
  flavor: 格ゲーの伝説として、スレでもよく名前が挙がる。
  fx:
  - when: 採点時
    if: {体力の割合以下: 0.5}
    do:
    - {掛け: 1.3}

- id: hfgc_taipan
  name: 台パン
  cat: [格ゲー]
  tier: '2'
  grade: 極
  text: 出すと、狙った敵の主張を18%削る（層主は半分）。採点されると掛け×2
  flavor: マナーは悪い。筐体も悪くない。
  fx:
  - when: 出し
    do:
    - 主張を削る: {対象: 狙い, 割合: 0.18, 層主なら: 0.09}
  - when: 採点時
    do:
    - {掛け: 2}

- id: hfgc_tenin
  name: ゲームセンターの店員
  cat: [格ゲー]
  tier: '4'
  grade: 特上
  text: 採点されると〈格ゲー〉の番付を2段上げる
  flavor: 台パンには、厳しい。
  fx:
  - when: 採点時
    do:
    - 番付を上げる: {カテゴリ: 格ゲー, 段: 2}
