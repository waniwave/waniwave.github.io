# ター宿のほとり「リミナル・スペース・オペラ」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hlso_reroi
  name: "リロイ"
  cat: ["麺", "ロボ"]
  grade: 特上
  text: "効果の無い札が2枚以上採点されていれば倍率{x1.3}。「麺」と「ロボ」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "「俺は行くぞ」"
  fx:
    - {"when": "採点時", "if": {"効果なしの札": 2}, "do": [{"掛け": 1.3}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "麺"}, {"重なり以上": 2, "カテゴリ": "ロボ"}], "do": [{"掛け": 1.3}]}

- id: hlso_menboiler
  name: "MEN-Boiler"
  cat: ["ロボ", "麺"]
  grade: 上
  kw: ["守り8"]
  text: "採点されるたびに育つ。育ち×{+2.6}の強さ（この潜行のあいだ残る）"
  flavor: "「……ワタシ、ハ、ズンドウ、デス」"
  fx:
    - {"when": "採点時", "do": [{"育つ": 1}, {"強さ": "育ち*2.6"}]}

- id: hlso_rayudan
  name: "特製ラー油弾"
  cat: ["食べ物", "ロボ"]
  grade: 特上
  text: "効果の無い札が2枚以上採点されていれば倍率{x1.3}。「食べ物」と「ロボ」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "三種の唐辛子と花椒と焦がしニンニクを、胡麻油で抽出してある。"
  fx:
    - {"when": "採点時", "if": {"効果なしの札": 2}, "do": [{"掛け": 1.3}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "食べ物"}, {"重なり以上": 2, "カテゴリ": "ロボ"}], "do": [{"掛け": 1.3}]}

- id: hlso_sudan
  name: "自家製ブレンド酢弾"
  cat: ["食べ物", "ロボ"]
  grade: 並
  text: "採点されると、手札の一番弱い札に「ロボ」を足す（この戦闘）"
  flavor: "米酢と黒酢を七対三で合わせ、わずかに柑橘を効かせている。"
  fx:
    - {"when": "採点時", "do": [{"札を変える": {"対象": "手札の一番弱い", "カテゴリを足す": "ロボ", "期間": "戦闘"}}]}

- id: hlso_kelp
  name: "スペース・ケルプ（昆布）"
  cat: ["食べ物", "ロボ"]
  grade: 上
  text: "採点されると、手札の一番弱い札に「ロボ」を足す（この戦闘）"
  flavor: "海賊が貨物船を襲っていたのは、昆布のためだった。"
  fx:
    - {"when": "採点時", "do": [{"札を変える": {"対象": "手札の一番弱い", "カテゴリを足す": "ロボ", "期間": "戦闘"}}]}

- id: hlso_umamiko
  name: "旨味粉"
  cat: ["食べ物"]
  grade: 神
  text: "採点されると、次の出しの強さ{+11}。体力{+1.8}、倍率{+0.2}。体力が満タンでなければ体力{+3}、満タンなら強さ{+9}"
  flavor: "四日目には何も感じなくなる粉が、まだ路地の奥で売られている。"
  fx:
    - {"when": "採点時", "do": [{"次の出しの強さ": 11}]}
    - {"when": "採点時", "do": [{"体力": 1.8}, {"倍率": 0.2}]}
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以上": 1}}, "do": [{"体力": 3}]}
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以下": 0}}, "do": [{"強さ": 9}]}

- id: hlso_akaenpitsu
  name: "赤鉛筆の男"
  cat: ["麺"]
  grade: 並
  text: "重なりの枚数×{+0.5}の倍率"
  flavor: "ラーメンウォーカーを執筆中の男。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "この札の重なり*0.5"}]}
