# ター宿のほとり「ワイルドとごった煮」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hwild_x_surameshi
  name: "実況スレの出前"
  cat: ["スレ", "食べ物"]
  grade: 特上
  text: "手札が4枚以下なら、採点されると{d2}枚引く。「スレ」と「食べ物」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "「ピザきた」「うp」「はよ」"
  fx:
    - {"when": "採点時", "if": {"手札枚数以下": 4}, "do": [{"引く": 2}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "スレ"}, {"重なり以上": 2, "カテゴリ": "食べ物"}], "do": [{"掛け": 1.3}]}

- id: hwild_x_gottani
  name: "ごった煮"
  cat: ["食べ物"]
  grade: 上
  text: "「食べ物」が3枚以上重なれば倍率{x1.26}"
  flavor: "何が入っているかは、誰も知らない。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "食べ物"}, "do": [{"掛け": 1.26}]}

- id: hwild_x_oshi
  name: "推し札"
  cat: ["スレ"]
  grade: 並
  text: "手札が4枚以下なら、採点されると{d2}枚引く"
  flavor: "推しは、どのジャンルにもいる。"
  fx:
    - {"when": "採点時", "if": {"手札枚数以下": 4}, "do": [{"引く": 2}]}

- id: hwild_x_yaminabe
  name: "闇鍋"
  cat: ["食べ物"]
  grade: 特上
  text: "体力{+2.5}、倍率{+0.3}。「食べ物」が3枚以上重なれば倍率{x1.25}"
  flavor: "箸でつかんだものは、必ず食べる。"
  fx:
    - {"when": "採点時", "do": [{"体力": 2.5}, {"倍率": 0.3}]}
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "食べ物"}, "do": [{"掛け": 1.25}]}

- id: hwild_x_ishu
  name: "異種格闘技戦"
  cat: ["格ゲー", "動物"]
  grade: 神
  text: "「格ゲー」の重なりの枚数×{+0.4}の倍率。2枚以上重なったカテゴリの数×{+0.4}の倍率。「動物」が5枚重なれば倍率{x1.36}"
  flavor: "ゴリラ対昇龍拳。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "この札の重なり*0.4"}]}
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.4"}]}
    - {"when": "採点時", "if": {"重なり以上": 5, "カテゴリ": "動物"}, "do": [{"掛け": 1.36}]}

- id: hwild_x_kanji
  name: "社員旅行の幹事"
  cat: ["宿"]
  grade: 上
  text: "受けに回ると受け{+10}。採点されると受け{+4.3}"
  flavor: "食べ物好きも、動物好きも、格ゲー勢も、全員まとめて連れてくる。"
  fx:
    - {"when": "受けに回る", "do": [{"受け": 10}]}
    - {"when": "採点時", "do": [{"受け": 4.3}]}

- id: hwild_x_bento
  name: "動物園のお弁当"
  cat: ["食べ物", "動物"]
  grade: 並
  text: "採点されると、次の出しの強さ{+18}"
  flavor: "ゾウの形のおにぎりが入っている。"
  fx:
    - {"when": "採点時", "do": [{"次の出しの強さ": 18}]}
