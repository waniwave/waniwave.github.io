# ター宿のほとり「IKEAとセレブ婚」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hikea_ikea
  name: "IKEA"
  cat: ["宿"]
  grade: 特上
  text: "いまの受け×{+0.4}の強さ（守った分を返す）。受けに回ると受け{+10}。採点されると受け{+4.2}"
  flavor: "説明書には図しかない。言葉はいらない。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "受け*0.4"}]}
    - {"when": "受けに回る", "do": [{"受け": 10}]}
    - {"when": "採点時", "do": [{"受け": 4.2}]}

- id: hikea_meatball
  name: "IKEAのミートボール"
  cat: ["宿", "食べ物"]
  grade: 上
  text: "体力{+2.6}、倍率{+0.3}"
  flavor: "皿の下に、家具の部品が入っていた。"
  fx:
    - {"when": "採点時", "do": [{"体力": 2.6}, {"倍率": 0.3}]}

- id: hikea_manual
  name: "IKEAの説明書"
  cat: ["宿"]
  grade: 並
  text: "手札にあるまま終わると受け{+6}"
  flavor: "図しかない。でも伝わる。"
  fx:
    - {"when": "ターン終了", "do": [{"受け": 6}]}

