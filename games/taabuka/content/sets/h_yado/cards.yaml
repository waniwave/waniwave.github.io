# ター宿のほとり「女将の宿」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hyado_maap
  name: "マープ"
  cat: ["宿"]
  grade: 極
  text: "いまの受け×{+0.4}の強さ（守った分を返す）。受けに回ると受け{+9}。採点されると受け{+3.8}"
  flavor: "ター宿の女将。宿の地図はすべて彼女の頭の中にある。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "受け*0.4"}]}
    - {"when": "受けに回る", "do": [{"受け": 9}]}
    - {"when": "採点時", "do": [{"受け": 3.8}]}

- id: hyado_tarkaku
  name: "ター角"
  cat: ["ター"]
  grade: 特上
  text: "採点されると、番付で一番低いカテゴリを1段上げる。採点されると「ター」をTier8（博打）に送る。強さ{+8}"
  flavor: "宿の、いちばん角にある。いる。ある。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "一番低い"}}]}
    - {"when": "採点時", "do": [{"番付を移す": {"カテゴリ": "ター", "先": "8"}}, {"強さ": 8}]}

- id: hyado_banto
  name: "番頭"
  cat: ["宿"]
  grade: 特上
  text: "いまの受け×{+0.4}の強さ（守った分を返す）。手札にあるまま終わると受け{+5}"
  flavor: "そろばんの音で強さを計る。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "受け*0.4"}]}
    - {"when": "ターン終了", "do": [{"受け": 5}]}

- id: hyado_soroban
  name: "番頭のそろばん"
  cat: ["宿"]
  grade: 並
  text: "手札にあるまま終わると受け{+6}"
  flavor: "パチパチ。権限が増えた。"
  fx:
    - {"when": "ターン終了", "do": [{"受け": 6}]}

- id: hyado_techou
  name: "マープの手帳"
  cat: ["宿"]
  grade: 上
  kw: ["呼び水1"]
  text: "受けに回ると受け{+10}。採点されると受け{+4.3}"
  flavor: "予約は、女将の手帳にしか書かれていない。"
  fx:
    - {"when": "受けに回る", "do": [{"受け": 10}]}
    - {"when": "採点時", "do": [{"受け": 4.3}]}

- id: hyado_suzu
  name: "女将の鈴"
  cat: ["宿"]
  grade: 上
  text: "採点されると、2割5分で狙った敵の次の行動を消す"
  flavor: "チリン。襖が一斉に開く。"
  fx:
    - {"when": "採点時", "if": {"確率": 0.25}, "do": [{"行動を消す": "狙い"}]}

- id: hyado_yukata
  name: "浴衣"
  cat: ["宿", "湯"]
  grade: 並
  text: "採点されると、2割5分で狙った敵の次の行動を消す"
  flavor: "サイズはフリー。概念にも合う。"
  fx:
    - {"when": "採点時", "if": {"確率": 0.25}, "do": [{"行動を消す": "狙い"}]}
