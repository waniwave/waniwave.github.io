# ター宿のほとり「女将の宿」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hyado_maap
  name: マープ
  cat: [宿]
  tier: '1'
  grade: 極
  text: 採点されると〈宿〉の番付を2段上げる。採点されると掛け×2
  flavor: ター宿の女将。宿の地図はすべて彼女の頭の中にある。
  fx:
  - when: 採点時
    do:
    - 番付を上げる: {カテゴリ: 宿, 段: 2}
  - when: 採点時
    do:
    - {掛け: 2}

- id: hyado_tarkaku
