# 限定の札（縛り潜行の初回脱出の報酬）

- id: gt_shokuji
  name: "縛りの食卓"
  cat: ["食べ物", "宿"]
  grade: 極
  text: "体力が満タンでなければ体力{+3.8}、満タンなら強さ{+12}。採点札のカテゴリが3種類以上なら倍率{+0.9}"
  flavor: "残さず食べた。"
  fx:
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以上": 1}}, "do": [{"体力": 3.8}]}
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以下": 0}}, "do": [{"強さ": 12}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 0.9}]}

- id: gt_ippon
  name: "一本勝負"
  cat: ["格ゲー", "ター"]
  grade: 極
  text: "「ター」がTier1以上なら倍率{x1.23}。2枚以上重なったカテゴリの数×{+0.5}の倍率"
  flavor: "二度目はない。"
  fx:
    - {"when": "採点時", "if": {"番付": {"カテゴリ": "ター", "以上": "1"}}, "do": [{"掛け": 1.23}]}
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.5"}]}

- id: gt_nagasanai
  name: "流さない主義"
  cat: ["老", "スレ"]
  grade: 特上
  text: "手札に残ると倍率{+0.3}。採点札のカテゴリが3種類以上なら倍率{+1}"
  flavor: "全部抱えていく。"
  fx:
    - {"when": "手札に残る", "do": [{"倍率": 0.3}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 1}]}

- id: gt_rokumai
  name: "六枚の手札"
  cat: ["宿", "校庭"]
  grade: 特上
  text: "採点されると、2割で狙った敵を1ターン止める。採点札のカテゴリが3種類以上なら倍率{+1}"
  flavor: "少ないほうが、よく見える。"
  fx:
    - {"when": "採点時", "if": {"確率": 0.2}, "do": [{"行動停止": {"対象": "狙い", "ターン": 1}}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 1}]}

- id: gt_tanki
  name: "単騎がけ"
  cat: ["速さ", "死"]
  grade: 極
  text: "最初に採点されると強さ{+11}。2枚以上重なったカテゴリの数×{+0.5}の倍率"
  flavor: "一人で行く。"
  fx:
    - {"when": "採点時", "if": {"採点の順番": "最初"}, "do": [{"強さ": 11}]}
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.5"}]}

- id: gt_gomai
  name: "五枚出しの作法"
  cat: ["宿", "スレ"]
  grade: 極
  text: "手札が4枚以下なら、採点されると{d2}枚引く。採点札のカテゴリが3種類以上なら倍率{+0.9}"
  flavor: "五枚ずつ、お出しください。"
  fx:
    - {"when": "採点時", "if": {"手札枚数以下": 4}, "do": [{"引く": 2}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 0.9}]}

- id: gt_mamorazu
  name: "守らない"
  cat: ["死", "格ゲー"]
  grade: 極
  text: "採点されると、狙った敵に{+14}の追撃。「死」と「格ゲー」が両方2枚以上重なれば倍率{x1.27}"
  flavor: "攻めるしかない。"
  fx:
    - {"when": "採点時", "do": [{"主張を削る": {"対象": "狙い", "量": 14}}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "死"}, {"重なり以上": 2, "カテゴリ": "格ゲー"}], "do": [{"掛け": 1.27}]}

- id: gt_sakasa
  name: "逆さの番付表"
  cat: ["スレ", "ター"]
  grade: 極
  text: "採点されると、このターンの流し＋1。採点札のカテゴリが3種類以上なら倍率{+0.9}"
  flavor: "下から読む。"
  fx:
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 0.9}]}

- id: gt_hachi
  name: "八の誇り"
  cat: ["ター", "死"]
  grade: 極
  text: "採点されると、番付で一番低いカテゴリを1段上げる。2枚以上重なったカテゴリの数×{+0.5}の倍率"
  flavor: "8でも、勝てる。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "一番低い"}}]}
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.5"}]}

- id: gt_kotei
  name: "動かざる番付"
  cat: ["宿", "老"]
  grade: 極
  text: "採点されるたびに育つ。育ち×{+0.2}の倍率（この潜行のあいだ残る）。2枚以上重なったカテゴリの数×{+0.5}の倍率"
  flavor: "微動だにしない。"
  fx:
    - {"when": "採点時", "do": [{"育つ": 1}, {"倍率": "育ち*0.2"}]}
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.5"}]}

- id: gt_hanbun
  name: "半分の体力"
  cat: ["湯", "死"]
  grade: 極
  text: "体力{+3.1}。「湯」と「死」が両方2枚以上重なれば倍率{x1.27}"
  flavor: "半分あれば、足りる。"
  fx:
    - {"when": "採点時", "do": [{"体力": 3.1}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "湯"}, {"重なり以上": 2, "カテゴリ": "死"}], "do": [{"掛け": 1.27}]}

- id: gt_mukyu
  name: "休みなし"
  cat: ["速さ", "校庭"]
  grade: 極
  text: "戦闘の1〜2ターン目なら倍率{x1.19}。「速さ」と「校庭」が両方2枚以上重なれば倍率{x1.27}"
  flavor: "湯には寄らない。"
  fx:
    - {"when": "採点時", "if": {"でない": {"戦闘のターン以上": 3}}, "do": [{"掛け": 1.19}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "速さ"}, {"重なり以上": 2, "カテゴリ": "校庭"}], "do": [{"掛け": 1.27}]}
