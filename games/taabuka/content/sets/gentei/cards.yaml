# 限定の札（縛り潜行の初回脱出の報酬）

- id: gt_shokuji
  name: 縛りの食卓
  cat: [食べ物, 宿]
  tier: 0
  grade: 極
  text: 〈食べ物〉の札が3枚以上採点されると掛け×2
  flavor: 残さず食べた。
  fx:
  - when: 出し
    if: {採点札のカテゴリ: 食べ物, 枚数以上: 3}
    do:
    - {掛け: 2}

