# ター宿のほとり「定食」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hteishoku_teishoku
  name: "定食"
  cat: ["食べ物"]
  grade: 極
  text: "体力が満タンでなければ体力{+3.8}、満タンなら強さ{+12}。体力{+2.3}、倍率{+0.3}"
  flavor: "主菜と副菜と汁物の連合。"
  fx:
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以上": 1}}, "do": [{"体力": 3.8}]}
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以下": 0}}, "do": [{"強さ": 12}]}
    - {"when": "採点時", "do": [{"体力": 2.3}, {"倍率": 0.3}]}

- id: hteishoku_kobachi
  name: "定食の小鉢"
  cat: ["食べ物"]
  grade: 特上
  text: "採点されると、次の出しの強さ{+15}。「食べ物」が3枚以上重なれば倍率{x1.25}"
  flavor: "ひじき。"
  fx:
    - {"when": "採点時", "do": [{"次の出しの強さ": 15}]}
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "食べ物"}, "do": [{"掛け": 1.25}]}

- id: hteishoku_miso
  name: "定食のみそ汁"
  cat: ["食べ物", "湯"]
  grade: 上
  text: "2枚以上重なったカテゴリの数×{+0.6}の倍率"
  flavor: "ほぼ湯。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.6"}]}

- id: hteishoku_tsuke
  name: "定食の漬物"
  cat: ["食べ物"]
  grade: 並
  text: "「食べ物」が3枚以上重なれば倍率{x1.3}"
  flavor: "時間とともに強くなる、唯一の食べ物。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "食べ物"}, "do": [{"掛け": 1.3}]}

- id: hteishoku_waribashi
  name: "定食の割り箸"
  cat: ["食べ物"]
  grade: 特上
  text: "体力が満タンでなければ体力{+4.2}、満タンなら強さ{+13}。体力{+2.5}、倍率{+0.3}"
  flavor: "きれいに割れたら、いいことがある。"
  fx:
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以上": 1}}, "do": [{"体力": 4.2}]}
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以下": 0}}, "do": [{"強さ": 13}]}
    - {"when": "採点時", "do": [{"体力": 2.5}, {"倍率": 0.3}]}

- id: hteishoku_oomori
  name: "大盛り"
  cat: ["食べ物"]
  grade: 上
  text: "体力{+2.6}、倍率{+0.3}"
  flavor: "無料です。"
  fx:
    - {"when": "採点時", "do": [{"体力": 2.6}, {"倍率": 0.3}]}

- id: hteishoku_foodfighter
  name: "フードファイター"
  cat: ["死"]
  grade: 並
  text: "失った体力×{+0.6}の強さ"
  flavor: "大食いTier God。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "失った体力*0.6"}]}
