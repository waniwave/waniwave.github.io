# ター宿のほとり「EOと秒速」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: heo_eo
  name: "EO"
  cat: ["速さ"]
  grade: 特上
  text: "戦闘の1〜2ターン目なら倍率{x1.21}。最初に採点されると強さ{+12}"
  flavor: "EO。"
  fx:
    - {"when": "採点時", "if": {"でない": {"戦闘のターン以上": 3}}, "do": [{"掛け": 1.21}]}
    - {"when": "採点時", "if": {"採点の順番": "最初"}, "do": [{"強さ": 12}]}

- id: heo_oe
  name: "OE"
  cat: ["速さ"]
  grade: 特上
  text: "このターン最初の出しで採点されると、このターンの出し＋1。最初に採点されると強さ{+12}"
  flavor: "EOを裏返したもの。"
  fx:
    - {"when": "採点時", "if": {"このターンの出し": 1}, "do": [{"出し回数": {"増減": 1, "期間": "ターン"}}]}
    - {"when": "採点時", "if": {"採点の順番": "最初"}, "do": [{"強さ": 12}]}

- id: heo_eoeo
  name: "EOEO"
