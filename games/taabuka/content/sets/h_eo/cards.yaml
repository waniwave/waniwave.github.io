  fx:
    - {"when": "採点時", "if": {"でない": {"戦闘のターン以上": 3}}, "do": [{"掛け": 1.22}]}

- id: heo_byousoku
  name: "秒速5タームメートル"
  cat: ["速さ", "ター"]
  grade: 並
  kw: ["呼び水1"]
  text: "このターン最初の出しで採点されると、このターンの出し＋1"
  flavor: "Tier8。議論の外を、秒速5タームメートルで通り過ぎていく。"
  fx:
    - {"when": "採点時", "if": {"このターンの出し": 1}, "do": [{"出し回数": {"増減": 1, "期間": "ターン"}}]}

- id: heo_funsoku
  name: "分速300タームメートル"
  cat: ["速さ", "ター"]
  grade: 並
  text: "戦闘の1回目の出しなら倍率{+1.2}"
  flavor: "計算すると同じ。"
  fx:
    - {"when": "採点時", "if": {"戦闘の出し": 1}, "do": [{"倍率": 1.2}]}

- id: heo_passing
  name: "秒速5タームメートルで通り過ぎた何か"
  cat: ["速さ"]
  grade: 極
  kw: ["呼び水2"]
  text: "戦闘の1回目の出しなら倍率{+0.9}。最初に採点されると強さ{+11}"
  flavor: "何だったのかはわからない。速かった。"
  fx:
    - {"when": "採点時", "if": {"戦闘の出し": 1}, "do": [{"倍率": 0.9}]}
    - {"when": "採点時", "if": {"採点の順番": "最初"}, "do": [{"強さ": 11}]}
