  flavor: "EOEO。"
  fx:
    - {"when": "採点時", "if": {"でない": {"戦闘のターン以上": 3}}, "do": [{"掛け": 1.22}]}

- id: heo_oeo
  name: "OEO"
  cat: ["速さ"]
  grade: 上
