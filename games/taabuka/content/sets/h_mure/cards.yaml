# ター宿のほとり「群れ」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hmure_shiba
  name: "シバターヌ"
  cat: ["動物", "ター"]
  grade: 特上
  text: "この札のTierの段の高さ×{+0.3}の倍率。採点札のカテゴリが3種類以上なら倍率{+1}"
  flavor: "柴犬とたぬきの、どちらでもある。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "Tierの段*0.3"}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 1}]}

- id: hmure_ookami
  name: "オオカミーム"
  cat: ["動物"]
  grade: 上
  text: "同じカテゴリの札と一緒なら倍率{+0.6}"
  flavor: "満月の夜は、Tierが1つ上がる。"
  fx:
    - {"when": "採点時", "if": {"同じカテゴリの札が他に": true}, "do": [{"倍率": 0.6}]}

- id: hmure_zou
  name: "ゾウターム"
  cat: ["動物", "ター"]
  grade: 極
  text: "採点されると、番付で一番低いカテゴリを1段上げる。「動物」と「ター」が両方2枚以上重なれば倍率{x1.27}"
  flavor: "宿の床が、少したわむ。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "一番低い"}}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "動物"}, {"重なり以上": 2, "カテゴリ": "ター"}], "do": [{"掛け": 1.27}]}

- id: hmure_kirin
  name: "キリンター"
  cat: ["動物", "ター"]
  grade: 特上
  text: "採点されると、番付で一番低いカテゴリを1段上げる。「動物」と「ター」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "首が長い。隣の部屋が見える。"
  fx:
    - {"when": "採点時", "do": [{"番付を上げる": {"カテゴリ": "一番低い"}}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "動物"}, {"重なり以上": 2, "カテゴリ": "ター"}], "do": [{"掛け": 1.3}]}

- id: hmure_fureai
  name: "ふれあい広場"
  cat: ["動物"]
  grade: 並
  text: "重なりの枚数×{+5}の強さ"
  flavor: "餌やり体験：ター油（100円）。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "この札の重なり*5"}]}

- id: hmure_usagi
  name: "ウサギター"
  cat: ["動物", "ター"]
  grade: 上
  text: "2枚以上重なったカテゴリの数×{+0.6}の倍率"
  flavor: "気がつくと、増えている。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.6"}]}

- id: hmure_koala
  name: "コアラーム"
  cat: ["動物"]
  grade: 並
  text: "「動物」が3枚以上重なれば倍率{x1.3}"
  flavor: "1日22時間寝る。残り2時間も寝ている。"
  fx:
    - {"when": "採点時", "if": {"重なり以上": 3, "カテゴリ": "動物"}, "do": [{"掛け": 1.3}]}
