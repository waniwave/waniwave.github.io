# 自己紹介をする土の専用札（10枚）

- id: ts_nanori
  name: "名乗りを上げる土"
  cat: ["宿"]
  grade: 並
  flavor: "名乗るだけで、ひと仕事。"

- id: ts_meishi
  name: "肩書きがやたら長い名刺"
  cat: ["スレ"]
  grade: 並
  text: "採点されると、このターンの流し＋1"
  flavor: "裏面にも続きがある。"
  fx:
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}

- id: ts_jikoshokai
  name: "自己紹介をする土の自己紹介"
  cat: ["宿", "校庭"]
  grade: 並
  text: "受けに回ると受け{+12}。採点されると受け{+5}"
  flavor: "「土です」から始まる。"
  fx:
    - {"when": "受けに回る", "do": [{"受け": 12}]}
    - {"when": "採点時", "do": [{"受け": 5}]}

- id: ts_furigana
  name: "ふりがなの多すぎる履歴書"
  cat: ["スレ", "校庭"]
  grade: 並
  text: "採点されると、1割5分で敵全員の次の行動を消す"
  flavor: "全部の漢字に、ふりがな。"
  fx:
    - {"when": "採点時", "if": {"確率": 0.15}, "do": [{"行動を消す": "敵全員"}]}

- id: ts_kataduke
  name: "肩書きの続き"
  cat: ["スレ"]
  grade: 並
  kw: ["呼び水1"]
  text: "採点されると、このターンの流し＋1"
  flavor: "裏面の、さらに裏。"
  fx:
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}

- id: ts_tsuchikure
  name: "土くれ"
  cat: ["宿"]
  grade: 並
  text: "採点されると、2割5分で狙った敵の次の行動を消す"
  flavor: "名前は短いが、数で勝負。"
  fx:
    - {"when": "採点時", "if": {"確率": 0.25}, "do": [{"行動を消す": "狙い"}]}

- id: ts_jiko_pr
  name: "自己ＰＲが三分を超える土"
  cat: ["宿", "速さ"]
  grade: 上
  text: "手札にあるまま終わると受け{+5}"
  flavor: "「もう少しだけ」。"
  fx:
    - {"when": "ターン終了", "do": [{"受け": 5}]}

- id: ts_meibo
  name: "名簿のいちばん上に書いてある土"
  cat: ["宿", "老"]
  grade: 上
  kw: ["一番槍"]
  text: "「宿」と「老」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "あいうえお順ではない。"
  fx:
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "宿"}, {"重なり以上": 2, "カテゴリ": "老"}], "do": [{"掛け": 1.3}]}

- id: ts_hoshi
  name: "自己紹介の途中で日が暮れる"
  cat: ["宿", "湯"]
  grade: 特上
  text: "体力{+3.4}。採点札のカテゴリが3種類以上なら倍率{+1}"
  flavor: "夕飯の支度が始まる。"
  fx:
    - {"when": "採点時", "do": [{"体力": 3.4}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 1}]}

- id: ts_seimei
  name: "自己紹介をする土の正式名称（略さない）"
  cat: ["ター", "宿"]
  grade: 極
  kw: ["根回し"]
  text: "受けに回ると受け{+9}。採点されると受け{+3.8}。採点札のカテゴリが3種類以上なら倍率{+0.9}"
  flavor: "読み終えた者はいない。"
  fx:
    - {"when": "受けに回る", "do": [{"受け": 9}]}
    - {"when": "採点時", "do": [{"受け": 3.8}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 0.9}]}

- id: ts_namae
  name: "名前の長い宿帳"
  cat: ["宿", "スレ"]
  grade: 並
  text: "いまの受け×{+0.5}の強さ（守った分を返す）"
  flavor: "書く欄が足りない。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "受け*0.5"}]}

- id: ts_furigana2
  name: "振り仮名"
  cat: ["スレ"]
  grade: 並
  kw: ["守り5"]
  text: "手札が4枚以下なら、採点されると{d2}枚引く"
  flavor: "読めればいい。"
  fx:
    - {"when": "採点時", "if": {"手札枚数以下": 4}, "do": [{"引く": 2}]}

- id: ts_aisatsu
  name: "はじめまして"
  cat: ["宿", "校庭"]
  grade: 並
  kw: ["一番槍"]
  text: "いまの受け×{+0.5}の強さ（守った分を返す）"
  flavor: "二回目もはじめまして。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "受け*0.5"}]}

- id: ts_tsuchi
  name: "ただの土"
  cat: ["校庭", "死"]
  grade: 並
  kw: ["呼び水1"]
  text: "体力−3。強さ{+25}"
  flavor: "自己紹介はしない。"
  fx:
    - {"when": "採点時", "do": [{"体力": -3}, {"強さ": 25}]}

- id: ts_kenjou
  name: "謙譲語の長い言い回し"
  cat: ["スレ", "老"]
  grade: 上
  text: "採点札のカテゴリの種類×{+5}の強さ"
  flavor: "申し上げます。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "カテゴリの種類*5"}]}

- id: ts_gakureki
  name: "やたら長い経歴"
  cat: ["スレ", "校庭"]
  grade: 上
  text: "「スレ」と「校庭」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "中学から書いてある。"
  fx:
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "スレ"}, {"重なり以上": 2, "カテゴリ": "校庭"}], "do": [{"掛け": 1.3}]}

- id: ts_shimei
  name: "氏名・年齢・職業・趣味・特技"
  cat: ["宿", "スレ", "校庭"]
  grade: 上
  text: "手札にあるまま終わると受け{+5}"
  flavor: "特技：自己紹介。"
  fx:
    - {"when": "ターン終了", "do": [{"受け": 5}]}

- id: ts_jiman
  name: "自慢話"
  cat: ["スレ", "老"]
  grade: 上
  kw: ["連れ3"]
  text: "流したとき{d1}枚引く"
  flavor: "三回目。"
  fx:
    - {"when": "流した時", "do": [{"引く": 1}]}

- id: ts_nanoru
  name: "名乗るほどの者ではない"
  cat: ["死", "ター"]
  grade: 上
  text: "採点札のカテゴリの種類×{+5}の強さ"
  flavor: "名乗っている。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "カテゴリの種類*5"}]}

- id: ts_jikopr
  name: "三分間の自己PR"
  cat: ["スレ", "宿", "速さ"]
  grade: 特上
  text: "採点されると、このターンの流し＋1。2枚以上重なったカテゴリの数×{+0.6}の倍率"
  flavor: "強みは、強みを語れること。"
  fx:
    - {"when": "採点時", "do": [{"流し回数": {"増減": 1, "期間": "ターン"}}]}
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.6"}]}

- id: ts_rirekisho
  name: "職務経歴書（全十二頁）"
  cat: ["スレ", "宿", "老"]
  grade: 特上
  text: "流したとき{d1}枚引く。「スレ」と「宿」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "目次がある。"
  fx:
    - {"when": "流した時", "do": [{"引く": 1}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "スレ"}, {"重なり以上": 2, "カテゴリ": "宿"}], "do": [{"掛け": 1.3}]}

- id: ts_nafuda2
  name: "大きすぎる名札"
  cat: ["宿", "校庭"]
  grade: 特上
  text: "いまの受け×{+0.4}の強さ（守った分を返す）。「宿」と「校庭」が両方2枚以上重なれば倍率{x1.3}"
  flavor: "胸からはみ出す。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "受け*0.4"}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "宿"}, {"重なり以上": 2, "カテゴリ": "校庭"}], "do": [{"掛け": 1.3}]}

- id: ts_onamae
  name: "お名前をフルネームでお願いします"
  cat: ["宿", "スレ", "ター"]
  grade: 極
  text: "採点されると「ター」をTier8（博打）に送る。強さ{+8}。2枚以上重なったカテゴリの数×{+0.5}の倍率"
  flavor: "言い終わる前に呼ばれた。"
  fx:
    - {"when": "採点時", "do": [{"番付を移す": {"カテゴリ": "ター", "先": "8"}}, {"強さ": 8}]}
    - {"when": "採点時", "do": [{"倍率": "重なったカテゴリの数*0.5"}]}

- id: ts_jugemu
  name: "寿限無寿限無五劫の擦り切れ"
  cat: ["老", "ター", "スレ"]
  grade: 極
  text: "戦闘の3ターン目以降なら倍率{x1.23}。「老」「ター」「スレ」が全部重なれば倍率{x1.46}"
  flavor: "続きは長い。"
  fx:
    - {"when": "採点時", "if": {"戦闘のターン以上": 3}, "do": [{"掛け": 1.23}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "老"}, {"重なり以上": 2, "カテゴリ": "ター"}, {"重なり以上": 2, "カテゴリ": "スレ"}], "do": [{"掛け": 1.46}]}

- id: ts_tsuchigami
  name: "自己紹介をし終えた土"
  cat: ["ター", "校庭", "宿"]
  grade: 神
  text: "受けに回ると受け{+7}。採点されると受け{+3}。「ター」と「校庭」が両方2枚以上重なれば倍率{x1.21}。いまの受け×{+0.3}の強さ（守った分を返す）"
  flavor: "拍手が起きた。"
  fx:
    - {"when": "受けに回る", "do": [{"受け": 7}]}
    - {"when": "採点時", "do": [{"受け": 3}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "ター"}, {"重なり以上": 2, "カテゴリ": "校庭"}], "do": [{"掛け": 1.21}]}
    - {"when": "採点時", "do": [{"強さ": "受け*0.3"}]}
