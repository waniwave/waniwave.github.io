# ター宿のほとり「相当」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hsoutou_soutourou
  name: 相当老
  cat: [老]
  tier: '3'
  grade: 極
  text: 同じ出しに同じカテゴリの札があれば強さ＋100。採点されると掛け×2
  flavor: 相当、老いている。どれくらいかと聞くと「相当」と答える。
