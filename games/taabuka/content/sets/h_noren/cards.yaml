# ター宿のほとり「暖簾の外側」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hnoren_gravity
  name: "麺処グラヴィティ・ウェル"
  cat: ["麺", "宿"]
  grade: 特上
  text: "重なりの枚数×{+0.4}の倍率。採点札のカテゴリが3種類以上なら倍率{+1}"
  flavor: "換気扇は三百年もの。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "この札の重なり*0.4"}]}
    - {"when": "採点時", "if": {"カテゴリの種類以上": 3}, "do": [{"倍率": 1}]}

- id: hnoren_yoru
  name: "劇団員の女（ヨル）"
  cat: ["宿"]
  grade: 上
  text: "受けに回ると受け{+10}。採点されると受け{+4.3}"
  flavor: "ここではないどこかへ、行きたがっていた。"
  fx:
    - {"when": "受けに回る", "do": [{"受け": 10}]}
    - {"when": "採点時", "do": [{"受け": 4.3}]}

- id: hnoren_walker
  name: "審査AI〈WALKER〉"
  cat: ["ロボ"]
  grade: 特上
  text: "採点されると、手札の乱数の1枚に「ロボ」を足す（この戦闘）。強さ{+5}。採点札の効果の無い札1枚につき倍率{+0.5}"
  flavor: "同じ一杯には、いつも同じ点がつく。"
  fx:
    - {"when": "採点時", "do": [{"札を変える": {"対象": "手札の乱数", "カテゴリを足す": "ロボ", "期間": "戦闘"}}, {"強さ": 5}]}
    - {"when": "採点時", "do": [{"倍率": "効果なしの札*0.5"}]}

- id: hnoren_yonhonude
  name: "四本腕の老人"
  cat: ["老", "ロボ"]
  grade: 上
  kw: ["呼び水1"]
  text: "手札に残ると倍率{+0.3}"
  flavor: "十九日かけて、油そばが届いた。"
  fx:
    - {"when": "手札に残る", "do": [{"倍率": 0.3}]}

- id: hnoren_holochashu
  name: "ホログラムのチャーシュー"
  cat: ["食べ物", "ロボ"]
  grade: 神
  text: "体力が満タンでなければ体力{+3}、満タンなら強さ{+9}。「食べ物」と「ロボ」が両方2枚以上重なれば倍率{x1.21}。効果の無い札が2枚以上採点されていれば倍率{x1.21}"
  flavor: "召し上がった気分だけを、確実にお届けする。"
  fx:
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以上": 1}}, "do": [{"体力": 3}]}
    - {"when": "採点時", "if": {"値": {"式": "失った体力", "以下": 0}}, "do": [{"強さ": 9}]}
    - {"when": "採点時", "if": [{"重なり以上": 2, "カテゴリ": "食べ物"}, {"重なり以上": 2, "カテゴリ": "ロボ"}], "do": [{"掛け": 1.21}]}
    - {"when": "採点時", "if": {"効果なしの札": 2}, "do": [{"掛け": 1.21}]}

- id: hnoren_grandprix
  name: "ラーメングランプリ"
  cat: ["麺"]
  grade: 並
  text: "採点されるたびに育つ。育ち×{+3}の強さ（この潜行のあいだ残る）"
  flavor: "審査員席には、なぜか寸胴が座っている。"
  fx:
    - {"when": "採点時", "do": [{"育つ": 1}, {"強さ": "育ち*3"}]}

- id: hnoren_kenbaiki
  name: "券売機"
  cat: ["麺", "ロボ"]
  grade: 並
  kw: ["呼び水1"]
  text: "効果の無い札が2枚以上採点されていれば倍率{x1.35}"
  flavor: "選べない食券には「売切」が付く。"
  fx:
    - {"when": "採点時", "if": {"効果なしの札": 2}, "do": [{"掛け": 1.35}]}
