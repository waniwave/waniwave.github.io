# ター宿のほとり「汎用の城塞」の移植（名前・カテゴリ・フレーバーは元のまま。効果はター深用に作り直し）

- id: hhanyou2_g_soldier
  name: "歩兵"
  cat: ["格ゲー"]
  grade: 並
  text: "「格ゲー」の重なりの枚数×{+0.6}の倍率"
  flavor: "どのゲームにもいる。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "この札の重なり*0.6"}]}

- id: hhanyou2_g_shield
  name: "盾兵"
  cat: ["格ゲー"]
  grade: 特上
  text: "「格ゲー」の重なりの枚数×{+0.5}の倍率。このターン2回目の出しなら倍率{+1.4}"
  flavor: "盾を持っている。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "この札の重なり*0.5"}]}
    - {"when": "採点時", "if": {"このターンの出し": 2}, "do": [{"倍率": 1.4}]}

- id: hhanyou2_g_wall
  name: "城壁"
  cat: ["格ゲー"]
  grade: 並
  text: "この戦闘で出した回数×{+3}の強さ"
  flavor: "壁。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "戦闘の出し回数*3"}]}

- id: hhanyou2_g_golem
  name: "ゴーレム"
  cat: ["格ゲー"]
  grade: 特上
  text: "「格ゲー」の重なりの枚数×{+0.5}の倍率。採点されると、狙った敵に{+15}の追撃"
  flavor: "岩でできている。"
  fx:
    - {"when": "採点時", "do": [{"倍率": "この札の重なり*0.5"}]}
    - {"when": "採点時", "do": [{"主張を削る": {"対象": "狙い", "量": 15}}]}

- id: hhanyou2_g_dragon
  name: "ドラゴン"
  cat: ["格ゲー"]
  grade: 神
  text: "このターン2回目の出しなら倍率{+1}。採点されると、狙った敵に{+11}の追撃。この戦闘で出した回数×{+1.8}の強さ"
  flavor: "強い。"
  fx:
    - {"when": "採点時", "if": {"このターンの出し": 2}, "do": [{"倍率": 1}]}
    - {"when": "採点時", "do": [{"主張を削る": {"対象": "狙い", "量": 11}}]}
    - {"when": "採点時", "do": [{"強さ": "戦闘の出し回数*1.8"}]}

- id: hhanyou2_g_counter
  name: "カウンター"
  cat: ["格ゲー"]
  grade: 上
  text: "この戦闘で出した回数×{+2.6}の強さ"
  flavor: "反撃する。"
  fx:
    - {"when": "採点時", "do": [{"強さ": "戦闘の出し回数*2.6"}]}

- id: hhanyou2_sample
  name: "食品サンプル"
  cat: ["食べ物"]
  grade: 上
  text: "採点されると、次の出しの強さ{+16}"
  flavor: "食べられないが、強さはそっくり。"
  fx:
    - {"when": "採点時", "do": [{"次の出しの強さ": 16}]}
