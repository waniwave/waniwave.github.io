# 第一層の謎（仕様書 第4章「謎」）。ファイル名の layer1 から出る層が決まる
# 選択肢の下には do から作った目安が出る。hide: true の選択肢は「？？？」になる
- id: ev_saisen
  title: 底抜けの賽銭箱
  text: 賽銭箱に「Tier祈願」と書いてある。底が抜けていて、下の階の誰かの頭に小銭が当たる音がする。
  choices:
    - label: 10入れて祈る
      if: { 宿銭以上: 10 }
      do: [ { 宿銭: -10 }, { お品書きを得る: 番付札 } ]
      result: 下の階から「いてっ」と聞こえ、お礼に札が一枚投げ返されてきた。
    - label: 底から覗く
      do: [ { 気配: 2 }, { 宿銭: 8 } ]
      result: 下の階の誰かと目が合った。気まずいので、落ちていた小銭を拾って戻った。
    - label: 拝むだけ
      result: 賽銭箱が「チッ」と舌打ちした。
    - label: "説明書どおり賽銭箱を組み直す"
      guest: [ikea]
      do: [ { 宿銭: 15 }, { お品書きを得る: 番付札 } ]
      result: "底が付いた。今まで落ちた小銭が全部こちらに戻ってきた。"
    - label: "【名無しさん】匿名で寄付する"
      regular: [tj_r_nanashi]
      do: [ { 宿銭: -5 }, { 番付を上げる: { カテゴリ: 乱数, 段: 3 } } ]
      result: "下の階から「名無しさん、ありがとう」と聞こえた。"

- id: ev_kakejiku
  title: 番付の掛け軸
  text: 床の間に掛け軸。達筆すぎて「麺」と「死」の区別がつかない番付表。
  choices:
    - label: 読めたことにして写す
      do: [ { 体力: -5 }, { 番付を上げる: { カテゴリ: 乱数, 段: 2 } } ]
      result: 墨が指に付いて取れない。自信満々に書き写したので、番付のほうが合わせてくれた。
    - label: 裏返す
      do: [ { 宿銭: 6 }, { 気配: 1 } ]
      result: 裏に「へそくり」と書いた封筒が貼ってあった。女将の字だった。
    - label: "掛け軸の角だけ見る"
      guest: [taakaku]
      do: [ { 番付を上げる: { カテゴリ: ター, 段: 3 } } ]
      result: "角に小さく「ター」と書いてあった。ター角が満足げだ。"
    - label: "ターのデッキを掛け軸の前に並べる"
      deckCat: ター
      do: [ { 番付を移す: { カテゴリ: ター, 先: God } }, { 気配: 2 } ]
      result: "掛け軸が「ター」と読めるようになった。"

- id: ev_wasuremono
  title: 忘れ物の棚
  text: 「お忘れ物」の棚。片方だけの下駄、読みかけのスレの印刷、そして誰かの札が一枚。
  choices:
    - label: 札の癖だけもらう
      do: [ { 気配: 2 }, { 札に付ける: { 対象: 乱数, 仕込み: 乱数 } } ]
      result: 札を握ると、前の持ち主の手汗が移ってきた。デッキの札が少しだけ強くなった。
    - label: スレの印刷を読む
      do: [ { 体力: 6 } ]
      result: 「>>1 乙」。それだけで、なんだか回復した。
    - label: "忘れ物に自己紹介する"
      guest: [tsuchi]
      do: [ { 常連客を得る: 乱数 } ]
      result: "「はじめまして、下駄です」。下駄の持ち主が名乗り出て、宿の常連になった。"

- id: ev_kakikomi
  title: 書き込みのある柱
  text: 柱にびっしり「ここが一番Tier高い」「いや隣の柱のほうが高い」「柱にTierとかないから」。
  choices:
    - label: 一番下の行に加勢する
      do: [ { 番付を上げる: { カテゴリ: 一番低い, 段: 2 } }, { 気配: 1 } ]
      result: 弱いほうの味方をしたら、柱が少しだけ傾いた。番付の一番下が2段上がった。
    - label: 消しゴムで消す
      do: [ { 宿銭: 5 } ]
      result: 消しかすの山から硬貨が出てきた。議論とはそういうものだ。
    - label: "「昔はこの柱もTier1じゃった」"
      guest: [soutourou]
      do: [ { 番付を上げる: { カテゴリ: 老, 段: 3 } }, { 気配: -2 } ]
      result: "柱が照れて黙った。議論も静まった。"
    - label: "【Tier表職人】柱を清書する"
      regular: [tj_r_tierhyou]
      do: [ { 番付を上げる: { カテゴリ: 一番低い, 段: 3 } }, { 宿銭: 5 } ]
      result: "柱が読みやすくなった。揉めていた人たちが黙った。"

- id: ev_soroban
  title: 誰もいない帳場
  text: 算盤がひとりでにパチパチ鳴っている。帳簿の最後の行に「ター　一泊　∞円」。
  choices:
    - label: 帳尻を合わせる
      if: { 宿銭以上: 8 }
      do: [ { 宿銭: -8 }, { お品書きを得る: 議題 }, { お品書きを得る: 番付札 } ]
      result: 算盤が「まいど」と言って止まった。引き出しからお品書きが二枚。
    - label: ∞を8に書き換える
      do: [ { 宿銭: 12 }, { 気配: 3 } ]
      result: 帳簿が横に倒れて∞が8に戻った。奥で誰かが「見たぞ」と言った。
    - label: 見なかったことにする
      result: 算盤が、こちらの背中を数え始めた。
    - label: "マープに帳簿を任せる"
      guest: [maap]
      do: [ { 宿銭: 30 }, { お品書きを得る: 品 } ]
      result: "マープの算盤は算盤より速い。帳尻が合いすぎて、黒字になった。"

- id: ev_jihanki
  title: 光る自販機
  text: 地下なのに自販機が光っている。商品は全部「Tier」。値段は全部「気分」。
  choices:
    - label: 取り出し口に手を突っ込む
      do: [ { 体力: -4 }, { お土産を得る: sv_jihankizeni } ]
      result: 指を挟まれた。代わりに誰かのお釣りを掴んで出てきた。
    - label: 下を覗く
      do: [ { 宿銭: 3 } ]
      result: 定番どおり、小銭が三枚落ちていた。
    - label: "taaaam様のためにボタンを全部押す"
      guest: [taaaam]
      do: [ { お品書きを得る: 品 }, { お品書きを得る: 品 }, { 宿銭: -5 } ]
      result: "全部出てきた。taaaam様はひとつも飲まなかった。"
    - label: "食べ物のデッキで、自販機に補充する"
      deckCat: 食べ物
      do: [ { 宿銭: 20 }, { 番付を上げる: { カテゴリ: 食べ物, 段: 2 } } ]
      result: "売れ行きがよかった。売上の一部をもらった。"

- id: ev_kouteiden
  title: 校庭の放送
  text: 地下なのに校内放送。「ピンポンパンポーン。ターさん、ターさん、至急Tierまでお越しください」。
  choices:
    - label: 代わりに返事をする
      do: [ { 気配: -3 } ]
      result: 「はーい」と返したら、放送が満足して静かになった。追っ手の気配も少し引いた。
    - label: 放送室に乗り込む
      do: [ { 番付を上げる: { カテゴリ: 乱数 } } ]
      result: 誰もいない。マイクのスイッチを切ると、番付がひとつだけ照れたように上がった。
    - label: "放送に「次は体育館です」と答える"
      guest: [koutei]
      do: [ { 番付を上げる: { カテゴリ: 校庭, 段: 2 } }, { 気配: -3 } ]
      result: "放送が「了解」と言った。校庭変化がうれしそうだ。"
    - label: "【校庭の主】「放送室は俺の庭だ」"
      regular: [tj_r_kouteinonushi]
      do: [ { 番付を上げる: { カテゴリ: 校庭, 段: 3 } } ]
      result: "主が放送をジャックした。全校に校庭の素晴らしさが流れた。"
    - label: "校庭のデッキで、全校集会を開く"
      deckCat: 校庭
      do: [ { 番付を上げる: { カテゴリ: 校庭, 段: 3 } }, { 気配: 3 } ]
      result: "校長先生の話が始まった。長い。"

- id: ev_jikoshoukai2
  title: 自己紹介の続き
  text: 襖の向こうから「……で、趣味はTier付けです。次の人どうぞ」。こちらを見ている。
  choices:
    - label: 全力で自己紹介する
      do: [ { 気配: 3 }, { 宿銭: 15 } ]
      result: 拍手が起きた。祝儀袋が飛んできた。ただし、声が大きすぎて遠くまで響いた。
    - label: 「パスで」
      do: [ { 宿銭: 4 } ]
      result: 「パス」の札が配られた。裏に4と書いてあったので宿銭にした。
    - label: "【実況民】自己紹介を実況する"
      regular: [tj_r_jikkyou]
      do: [ { 宿銭: 20 }, { 気配: 3 } ]
      result: "「さあ趣味の話に入りました！」。投げ銭が飛んできた。"

- id: ev_okami_note
  title: 女将の書き置き
  text: 「ご飯は冷蔵庫。番付は鍋の中。鍋は冷蔵庫の中。冷蔵庫は宿の中。宿はあなたの中」。
  choices:
    - label: 冷蔵庫を開ける
      do: [ { 体力: 8 }, { 気配: 2 } ]
      result: おにぎりが入っていた。具は「宿」だった。
    - label: 鍋の中を見る
      do: [ { 番付を上げる: { カテゴリ: 宿, 段: 1 } } ]
      result: 宿の番付が煮えていた。少しやわらかく、少し上がった。
    - label: "マープに書き置きの続きを書いてもらう"
      guest: [maap]
      do: [ { 体力: 20 }, { 番付を上げる: { カテゴリ: 宿, 段: 2 } } ]
      result: "「宿はあなたの中。あなたは宿の中」。読んだら元気が出た。"
    - label: "【食いしん坊】冷蔵庫を全部食べる"
      regular: [tj_r_kuishinbou]
      do: [ { 体力: 25 }, { 番付を上げる: { カテゴリ: 食べ物, 段: 2 } } ]
      result: "鍋の中の番付まで食べた。おいしかったらしい。"

- id: ev_hari_tanuki
  title: 梁の上の狸
  text: 天井の梁から狸がぶら下がって「この梁、Tier何？」と聞いてくる。
  choices:
    - label: 「God」と答える
      flag: tanuki_god
      do: [ { お土産を得る: sv_kaketahari }, { 気配: 2 } ]
      result: 狸が感激して梁の端を折ってくれた。いらないけど、持って帰れば何かに使えそうだ。
    - label: 「8」と答える
      do: [ { 体力: -3 }, { 宿銭: 10 } ]
      result: 狸に梁で殴られた。慰謝料として宿銭を置いていった。律儀だ。
    - label: 「梁にTierはない」
      hide: true
      do: [ { 番付を均す: "3" } ]
      result: 狸が泣き出した。泣き声で、全部の番付がT3に揃ってしまった。

- id: ev_kagi_ana
  title: 鍵穴だけの扉
  text: 壁に鍵穴だけがある。扉はない。鍵穴の向こうから「合言葉は？」。
  choices:
    - label: 「異論は認める」
      flag: aikotoba
      do: [ { お土産を得る: sv_furuikagi } ]
      result: 鍵穴から鍵が吐き出された。鍵穴が鍵を持っているのは、どう考えてもおかしい。
    - label: 「ターは最強」
      do: [ { 番付を上げる: { カテゴリ: ター, 段: 1 } }, { 気配: 1 } ]
      result: 「知ってる」と言われた。ターの番付が少し上がった。

- id: ev_men_nagare
  title: 流しそうめん
  text: 廊下の雨樋をそうめんが流れてくる。上流から「Tier高い順に流してまーす」。
  choices:
    - label: 最初の一本を取る
      do: [ { 体力: 6 }, { 番付を上げる: { カテゴリ: 麺 } } ]
      result: Godのそうめんだった。のどごしがGodだった。麺の番付が上がった。
    - label: 最後の一本を待つ
      do: [ { 宿銭: 12 }, { 気配: 2 } ]
      result: Tier8のそうめんは、なぜか五百円玉に巻きついて流れてきた。
    - label: "そうめんを植える"
      guest: [tatagi]
      do: [ { 番付を上げる: { カテゴリ: 麺, 段: 3 } }, { 体力: -4 } ]
      result: "タタ木が手伝ってくれた。麺の木が生えた。"
    - label: "【麺打ち】「このそうめん、打ち直させて」"
      regular: [tj_r_menuchi]
      do: [ { 番付を移す: { カテゴリ: 麺, 先: God } } ]
      result: "打ち直されたそうめんは、Godの細さだった。"
    - label: "麺のデッキで、そうめんと共鳴する"
      deckCat: 麺
      do: [ { 番付を上げる: { カテゴリ: 麺, 段: 2 } }, { 体力: 10 } ]
      result: "デッキの麺札たちが一斉にすすった。"
