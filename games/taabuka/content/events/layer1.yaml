# 第一層の謎（仕様書 第4章「謎」）。ファイル名の layer1 から出る層が決まる
- id: ev_saisen
  title: 底抜けの賽銭箱
  text: 帳場の隅に、賽銭箱。底が抜けている。
  choices:
    - label: 10入れる
      if: { 宿銭以上: 10 }
      do: [ { 宿銭: -10 }, { お品書きを得る: 番付札 } ]
      result: 落ちる音はしなかった。手の中に、札が一枚。
    - label: 覗く
      do: [ { 気配: 2 }, { 宿銭: 8 } ]
      result: 底の向こうから、硬貨が少しだけ返ってきた。
    - label: 立ち去る
      result: 背中で、何かが転がった。

- id: ev_kakejiku
  title: 掛け軸
  text: 床の間に掛け軸。読めない字で、番付が書いてある。
  choices:
    - label: 写す
      do: [ { 体力: -5 }, { 番付を上げる: { カテゴリ: 乱数, 段: 2 } } ]
      result: 指が墨で黒くなった。番付が、少し動いた。
    - label: 外す
      do: [ { 宿銭: 6 }, { 気配: 1 } ]
      result: 裏に、小銭が貼り付けてあった。

- id: ev_wasuremono
  title: 忘れ物の棚
  text: 「お忘れ物」と書かれた棚。傘と、片方だけの靴と、札が一枚。
  choices:
    - label: 札を持っていく
      do: [ { 気配: 2 }, { 札に付ける: { 対象: 乱数, 仕込み: 乱数 } } ]
      result: 持ち主の癖が、手に残った。デッキの札に仕込みが付いた。
    - label: 傘を借りる
      do: [ { 体力: 6 } ]
      result: 地下なのに、少し安心した。

- id: ev_kakikomi
  title: 書き込みのある柱
  text: 柱に、細かい字でびっしりと書き込み。「ここが一番Tier高い」。
  choices:
    - label: 書き足す
      do: [ { 番付を上げる: { カテゴリ: 一番低い, 段: 2 } }, { 気配: 1 } ]
      result: 誰かが、すぐ下に反論を書いた。
    - label: 消す
      do: [ { 宿銭: 5 } ]
      result: 消しかすの中から、硬貨が出てきた。

- id: ev_soroban
  title: 誰もいない帳場
  text: 算盤が、ひとりでに鳴っている。帳簿は開いたまま。
  choices:
    - label: 帳尻を合わせる
      if: { 宿銭以上: 8 }
      do: [ { 宿銭: -8 }, { お品書きを得る: 議題 }, { お品書きを得る: 番付札 } ]
      result: 算盤が止まった。引き出しから、お品書きが二枚。
    - label: 一行だけ書き換える
      do: [ { 宿銭: 12 }, { 気配: 3 } ]
      result: 奥で、誰かが顔を上げた気がする。
    - label: 見なかったことにする
      result: 算盤は、また鳴り始めた。

- id: ev_jihanki
  title: 光る自販機
  text: 廊下の突き当たりに自販機。売り切れの赤い点が、全部ついている。
  choices:
    - label: 叩く
      do: [ { 体力: -4 }, { お土産を得る: sv_jihankizeni } ]
      result: 釣り銭口から、小銭がこぼれた。
    - label: 下を覗く
      do: [ { 宿銭: 3 } ]
      result: 誰かの落とした硬貨。

- id: ev_kouteiden
  title: 校庭の放送
  text: どこからか、校内放送。「自己紹介をする土さん、帳場までお越しください」。
  choices:
    - label: 帳場へ行く
      do: [ { 気配: -3 } ]
      result: 帳場には誰もいなかった。足音も、遠のいた。
    - label: 聞かなかったことにする
      do: [ { 段位を上げる: { 組: 単騎 } } ]
      result: 一人で行くと決めた。「単騎」の段位が上がった。
