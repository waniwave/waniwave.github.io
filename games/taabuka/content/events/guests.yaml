# 宿泊客ごとの連作（guest でその宿泊客の潜行だけ。after で前の話を見たあとに出る。once で一度きり）
# 1話→2話→3話。潜行をまたいで続く（宿が覚えている）
# ───── IKEA ─────
- id: ev_g_ikea_1
  guest: [ikea]
  once: true
  title: IKEAと説明書（第一話）
  text: 床に説明書が一枚。絵しかない。IKEAが「これは……宿の説明書だ」と言う。
  choices:
    - label: 一緒に読む
      do: [ { 札に付ける: { 対象: 乱数, 仕込み: 多才 } } ]
      result: 宿は六角レンチ一本で組み立てられるらしい。デッキの札が一枚、組み替えやすくなった。
    - label: 説明書を畳む
      do: [ { 体力: 6 } ]
      result: IKEAが「あとで読もう」と言った。たぶん読まない。

- id: ev_g_ikea_2
  guest: [ikea]
  once: true
  after: ev_g_ikea_1
  title: IKEAと余ったネジ（第二話）
  text: あの説明書のとおりに組んだ宿が、地下にもう一軒あった。ネジが一本余っている。
  choices:
    - label: ネジを探す場所を探す
      do: [ { お土産を得る: sv_dg_koujou }, { 番付を上げる: { カテゴリ: 宿, 段: 2 } } ]
      result: ネジ穴は宿の看板の裏にあった。締めたら、宿の番付が上がった。
    - label: 余ったままにする
      do: [ { 宿銭: 15 } ]
      result: 余ったネジは売れた。

- id: ev_g_ikea_3
  guest: [ikea]
  once: true
  after: ev_g_ikea_2
  title: IKEAと完成品（最終話）
  text: 「完成した」。IKEAが指さす先に、Tier表の形をした本棚。全カテゴリ分の段がある。
  choices:
    - label: 本棚に札を並べる
      do: [ 番付を均す, { 番付を上げる: { カテゴリ: 乱数, 段: 3 } }, { お品書きを得る: 番付札 } ]
      result: 並べたら番付が整い、一つだけ一番上の段に収まった。IKEAが満足そうに頷いた。
    - label: 本棚を宿に持って帰る
      do: [ { お土産を得る: sv_kaketahari }, { お土産を得る: sv_kaketahari }, { お土産を得る: sv_furuikagi } ]
      result: 分解したら梁と鍵になった。IKEAは「次はもっと大きいのを作る」と言っている。

# ───── 校庭変化 ─────
- id: ev_g_koutei_1
  guest: [koutei]
  once: true
  title: 校庭と朝礼台（第一話）
  text: 地下に、地上の校庭とそっくりな校庭がある。朝礼台に誰も立っていない。
  choices:
    - label: 校庭変化を朝礼台に立たせる
      do: [ { 番付を上げる: { カテゴリ: 校庭, 段: 2 } }, { 気配: 2 } ]
      result: 校庭変化が「校庭、体育館、朝礼台」と三回言った。地下の校庭が少し明るくなった。
    - label: 白線を引き直す
      do: [ { お土産を得る: sv_hakusen } ]
      result: まっすぐ引けた。初めてかもしれない。

- id: ev_g_koutei_2
  guest: [koutei]
  once: true
  after: ev_g_koutei_1
  title: 校庭と体育館（第二話）
  text: 地下の校庭が体育館になっている。バスケットゴールに番付表が刺さっている。
  choices:
    - label: シュートする
      do: [ { 番付を上げる: { カテゴリ: 速さ, 段: 2 } }, { 番付を上げる: { カテゴリ: 校庭 } } ]
      result: スリーポイント。番付表が揺れて、二か所上がった。
    - label: 体育倉庫を覗く
      do: [ { お品書きを得る: 品 }, { お品書きを得る: 議題 } ]
      result: 跳び箱の中にお品書きが二枚。誰が入れたのか。

- id: ev_g_koutei_3
  guest: [koutei]
  once: true
  after: ev_g_koutei_2
  title: 校庭と卒業式（最終話）
  text: 体育館で卒業式。卒業生は「校庭変化」一人。来賓席に、地上の校庭そのものが座っている。
  choices:
    - label: 卒業証書を読み上げる
      do: [ { 番付を移す: { カテゴリ: 校庭, 先: God } }, { 体力: 10 } ]
      result: 「以下同文」。校庭がGodになった。来賓の校庭が泣いている。
    - label: 第二ボタンをもらう
      do: [ { 札に付ける: { 対象: 乱数, 判: 金判 } }, { 宿銭: 20 } ]
      result: 第二ボタンは金色の判だった。

# ───── 女将マープ ─────
- id: ev_g_maap_1
  guest: [maap]
  once: true
  title: マープと帳簿（第一話）
  text: 地下の帳場に、もう一冊の帳簿。マープが開くと「宿の本当の売上」。
  choices:
    - label: マープに見せない
      do: [ { 宿銭: 20 }, { 気配: 2 } ]
      result: 見せなかったが、マープは全部覚えていた。「足りない分、あとで返してね」。
    - label: 一緒に数える
      do: [ { お品書きを得る: 品 }, { 体力: 6 } ]
      result: マープは算盤より速い。数え終わったら、お茶が出てきた。

- id: ev_g_maap_2
  guest: [maap]
  once: true
  after: ev_g_maap_1
  title: マープと帯留め（第二話）
  text: マープの帯留めが一つ足りない。「前の潜行で落としたの。13個全部、カテゴリ別なのよ」。
  choices:
    - label: 探す
      do: [ { お土産を得る: sv_obidome }, { 体力: -6 } ]
      result: 床板の隙間から出てきた。「死」の帯留めだった。
    - label: 自分の札で代わりを作る
      do: [ { デッキから除く: 乱数 }, { 番付を上げる: { カテゴリ: 宿, 段: 3 } } ]
      result: マープは札の帯留めを気に入った。宿の番付が3段上がった。

- id: ev_g_maap_3
  guest: [maap]
  once: true
  after: ev_g_maap_2
  title: マープと宿の秘密（最終話）
  text: 「ここ、昔の宿なの。私がまだ仲居だった頃の」。廊下の柱に、小さなマープの背丈の傷。
  choices:
    - label: 柱に今の背丈を刻む
      do: [ { 番付を上げる: { カテゴリ: 一番低い, 段: 3 } }, { 番付を上げる: { カテゴリ: 宿, 段: 2 } } ]
      result: マープが少し照れた。一番弱いカテゴリも、背伸びをした。
    - label: 柱を宿に持って帰る
      do: [ { お土産を得る: sv_kaketahari }, { お土産を得る: sv_noren }, { 宿銭: 30 } ]
      result: 「持っていけるの、これ」。持っていけた。

# ───── 相当老 ─────
- id: ev_g_rou_1
  guest: [soutourou]
  once: true
  title: 相当老の昔話（第一話）
  text: 相当老が立ち止まる。「ここはな、昔、わしが論破された場所じゃ」。
  choices:
    - label: 話を聞く
      do: [ { 番付を上げる: { カテゴリ: 老, 段: 2 } }, { 気配: 3 } ]
      result: 話は三時間続いた。追っ手が聞きに集まってきた。
    - label: 話の途中で先へ進む
      do: [ { 体力: 6 } ]
      result: 相当老は気づかず話し続けている。

- id: ev_g_rou_2
  guest: [soutourou]
  once: true
  after: ev_g_rou_1
  title: 相当老の仇（第二話）
  text: 「あいつじゃ」。昔、相当老を論破した論客が、まだここで同じことを言っている。
  choices:
    - label: 代わりに言い返す
      do: [ { 体力: -10 }, { お品書きを得る: 議題 }, { お品書きを得る: 番付札 } ]
      result: 相手は「……時代が変わったな」と言って帰った。相当老が目を潤ませている。
    - label: 二人を仲直りさせる
      do: [ { 常連客を得る: 乱数 }, { 番付を上げる: { カテゴリ: 老 } } ]
      result: 二人で湯に入りに行った。一人は宿の常連になった。

- id: ev_g_rou_3
  guest: [soutourou]
  once: true
  after: ev_g_rou_2
  title: 相当老の熟成（最終話）
  text: 相当老の手札に、ずっと残していた一枚。「これを出す時が来た」。
  choices:
    - label: 出させてあげる
      do: [ { 札に付ける: { 対象: 乱数, 版: 箔押し } }, { 番付を移す: { カテゴリ: 老, 先: God } } ]
      result: 八十年熟成した札だった。老がGodになり、デッキの札が一枚、箔押しになった。
    - label: 「まだ早い」と止める
      do: [ { 体力: 15 }, { 宿銭: 15 } ]
      result: 「そうか、まだか」。相当老はうれしそうだった。

# ───── taaaam様専用 ─────
- id: ev_g_taaaam_1
  guest: [taaaam]
  once: true
  title: taaaam様の玉座（第一話）
  text: 「taaaam様専用」と書かれた椅子。座布団が13枚重ねてある。
  choices:
    - label: taaaam様に座っていただく
      do: [ { 番付を上げる: { カテゴリ: 乱数, 段: 3 } } ]
      result: taaaam様は一番上の座布団のカテゴリを指さした。それが3段上がった。
    - label: 座布団を一枚抜く
      do: [ { 宿銭: 12 }, { 気配: 2 } ]
      result: 抜いた座布団の下に、小銭が挟まっていた。

- id: ev_g_taaaam_2
  guest: [taaaam]
  once: true
  after: ev_g_taaaam_1
  title: taaaam様の親衛隊（第二話）
  text: 「taaaam様に忠誠を」。法被を着た一団が、こちらの手札を検めに来る。
  choices:
    - label: 手札を差し出す
      do: [ { デッキから除く: 乱数 }, { お品書きを得る: 番付札 }, { お品書きを得る: 番付札 } ]
      result: 一枚没収された。代わりに親衛隊の番付札を二枚もらった。
    - label: 親衛隊に入る
      do: [ { 常連客を得る: 乱数 }, { 気配: 3 } ]
      result: 法被をもらった。隊員が一人、宿までついてくる。

- id: ev_g_taaaam_3
  guest: [taaaam]
  once: true
  after: ev_g_taaaam_2
  title: taaaam様のお言葉（最終話）
  text: taaaam様が初めて口を開く。「……a、が、四つ」。
  choices:
    - label: 意味を考える
      do: [ { 番付を移す: { カテゴリ: 一番高い, 先: God } }, { 体力: 10 } ]
      result: 考えても分からなかった。でも一番強いカテゴリがGodになった。
    - label: 「a は五つでは？」と聞く
      hide: true
      do: [ 番付を反転, { 宿銭: 50 } ]
      result: taaaam様が笑った。番付が全部ひっくり返り、宿銭が降ってきた。

# ───── ター角 ─────
- id: ev_g_taakaku_1
  guest: [taakaku]
  once: true
  title: ター角と角部屋（第一話）
  text: 角部屋ばかりの廊下。真ん中の部屋が一つもない。ター角が「落ち着く」と言う。
  choices:
    - label: 一番端の角部屋に入る
      do: [ { 札に付ける: { 対象: 乱数, 仕込み: 鋼 } } ]
      result: 角で札を研いだ。一枚が硬くなった。
    - label: 真ん中を探す
      do: [ { 気配: 3 }, { 宿銭: 10 } ]
      result: なかった。真ん中を探す人用の募金箱があったので、少しもらった。

- id: ev_g_taakaku_2
  guest: [taakaku]
  once: true
  after: ev_g_taakaku_1
  title: ター角の四隅（第二話）
  text: 正方形の部屋。四隅にそれぞれ「ター」「ター」「ター」「角」。
  choices:
    - label: 「角」の隅に立つ
      do: [ { 番付を上げる: { カテゴリ: ター, 段: 3 } } ]
      result: ター角が「わかってる」と言った。
    - label: 部屋の真ん中に立つ
      do: [ { 体力: -8 }, { お品書きを得る: 議題 }, { 宿銭: 15 } ]
      result: 四隅から一斉に議論が飛んできた。拾った議題と宿銭で手を打った。

- id: ev_g_taakaku_3
  guest: [taakaku]
  once: true
  after: ev_g_taakaku_2
  title: ター角の丸（最終話）
  text: 丸い部屋。角がない。ター角が震えている。
  choices:
    - label: 札で角を作る
      do: [ { 札に付ける: { 対象: 乱数, 判: 金判 } }, { 札に付ける: { 対象: 乱数, 仕込み: 鋼 } } ]
      result: 二枚の札を立てかけて角を作った。ター角は落ち着き、札は二枚とも強くなった。
    - label: 丸も悪くないと言う
      do: [ { 番付を均す: "3" }, { 体力: 15 } ]
      result: ター角は少しだけ丸くなった。番付も丸く揃った。

# ───── タタ木 ─────
- id: ev_g_tatagi_1
  guest: [tatagi]
  once: true
  title: タタ木と鉢植え（第一話）
  text: 地下なのに日が当たる一角。鉢植えが一つ。タタ木が「ここに植えたい」。
  choices:
    - label: 札を一枚植える
      do: [ { デッキから除く: 乱数 }, { 番付を上げる: { カテゴリ: 動物, 段: 2 } }, { 宿銭: 10 } ]
      result: 札が一枚、土に還った。芽が出たら、また来よう。
    - label: 水だけやる
      do: [ { 体力: 8 } ]
      result: タタ木もついでに水をかぶった。

- id: ev_g_tatagi_2
  guest: [tatagi]
  once: true
  after: ev_g_tatagi_1
  title: タタ木と芽（第二話）
  text: あの鉢植えから芽が出ていた。芽の先に、小さな番付札が一枚。
  choices:
    - label: 摘む
      do: [ { お品書きを得る: 番付札 }, { お品書きを得る: 番付札 } ]
      result: 摘んだら、もう一枚生えてきた。
    - label: 育てる
      do: [ { 気配: 3 }, { 番付を上げる: { カテゴリ: 乱数, 段: 2 } } ]
      result: タタ木が子守唄を歌った。番付も少し伸びた。

- id: ev_g_tatagi_3
  guest: [tatagi]
  once: true
  after: ev_g_tatagi_2
  title: タタ木の大樹（最終話）
  text: 鉢植えが天井を突き破るほどの木になっている。枝の一本一本に、札が実っている。
  choices:
    - label: 一番高い枝の実をとる
      do: [ { 札に付ける: { 対象: 乱数, 版: ホロ } }, { 番付を移す: { カテゴリ: 乱数, 先: God } } ]
      result: 実は虹色に光っていた。デッキの札に移すと、ホロの版になった。
    - label: 木の下で昼寝する
      do: [ { 体力: 25 }, { 気配: -4 } ]
      result: 木陰はTier1だった。

# ───── 自己紹介をする土 ─────
- id: ev_g_tsuchi_1
  guest: [tsuchi]
  once: true
  title: 土の自己紹介（第一話）
  text: 「はじめまして、土です。趣味は」。土が自己紹介を始める。相手は壁。
  choices:
    - label: 最後まで聞く
      do: [ { 体力: -4 }, { 番付を上げる: { カテゴリ: 一番低い, 段: 2 } } ]
      result: 趣味は「Tier付け」、特技は「Tier付け」、好きなものは「Tier」だった。
    - label: 壁の自己紹介を促す
      do: [ { 気配: 2 }, { 宿銭: 10 } ]
      result: 壁が「壁です」と言った。土は感動して小銭をくれた。

- id: ev_g_tsuchi_2
  guest: [tsuchi]
  once: true
  after: ev_g_tsuchi_1
  title: 土の自己紹介の続き（第二話）
  text: 「……で、趣味の続きですが」。前回の自己紹介がまだ終わっていなかった。
  choices:
    - label: 相槌を打つ
      do: [ { お品書きを得る: 議題 }, { 体力: 6 } ]
      result: 相槌の打ち方が気に入られた。議題を一枚くれた。
    - label: 自分も自己紹介する
      do: [ { 常連客を得る: 乱数 }, { 気配: 3 } ]
      result: 二人の自己紹介を聞きつけて、常連客が一人増えた。

- id: ev_g_tsuchi_3
  guest: [tsuchi]
  once: true
  after: ev_g_tsuchi_2
  title: 土の自己紹介の終わり（最終話）
  text: 「以上です」。土の自己紹介が、ついに終わった。拍手する者は、こちら一人。
  choices:
    - label: 拍手する
      do: [ { 番付を移す: { カテゴリ: 乱数, 先: God } }, { 番付を上げる: { カテゴリ: 乱数, 段: 2 } }, { 体力: 10 } ]
      result: 土は泣いた。泣いた土から芽が出て、番付が二つ伸びた。
    - label: 「質問いいですか」
      hide: true
      do: [ { 体力: -10 }, { お品書きを得る: 番付札 }, { お品書きを得る: 番付札 }, { お品書きを得る: 品 } ]
      result: 自己紹介がもう一周始まった。お礼にお品書きを三枚もらった。
