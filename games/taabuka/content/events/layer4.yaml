# 第四層の謎（欠番区画）
- id: ev_ketsuban_heya
  title: 欠番の部屋
  text: 部屋番号が「6」と「7」。宿にそんな番号の部屋はない。でもある。
  choices:
    - label: 6号室に入る
      do: [ { 番付を移す: { カテゴリ: 乱数, 先: 欠6 } }, { 気配: 2 } ]
      result: 6号室の布団に、カテゴリが一つ寝かされていた。そのカテゴリは今日から欠6だ。
    - label: 7号室に入る
      do: [ { 体力: -15 }, { 番付を移す: { カテゴリ: 乱数, 先: 欠7 } } ]
      result: 7号室は受けが効かない部屋だった。体を強く打った。カテゴリが一つ欠7に住みついた。
    - label: 5と8の間の壁を叩く
      result: 「入ってます」と返事があった。

- id: ev_sakujo_irai
  title: 削除依頼
  text: 「削除依頼：あなたのデッキの札　理由：Tierが気に入らない　依頼者：あなたのデッキの別の札」。
  choices:
    - label: 依頼を受理する
      do: [ { デッキから除く: 乱数 }, { 宿銭: 25 } ]
      result: 札が一枚消えた。依頼者の札から、手数料として宿銭が支払われた。
    - label: 依頼者を説得する
      do: [ { お品書きを得る: 品 } ]
      result: 二枚は仲直りし、記念のお品書きをくれた。

- id: ev_kiyaku_doc
  title: 宿泊約款
  text: 「第8条：ターはTier1とする。第9条：前条に異議のある者は、Tier8とする」。分厚い。
  choices:
    - label: 全部読む
      do: [ { 番付を上げる: { カテゴリ: 乱数 } }, { 番付を上げる: { カテゴリ: 乱数 } }, { 気配: 2 } ]
      result: 第4,812条まで読んだ。細かい条項の隙間に、番付を二つ上げる方法が書いてあった。
    - label: 枕にする
      do: [ { 宿銭: 20 } ]
      result: 高さがちょうどよかった。挟まっていた違約金を回収した。

- id: ev_kesareta
  title: 消された常連
  text: 宿帳の名前が一つ、修正液で消されている。修正液の下から「出して」と声がする。
  choices:
    - label: 修正液を削る
      do: [ { 常連客を得る: 乱数 }, { 体力: -10 } ]
      result: 爪が割れた。消されていた常連客が出てきて、ついてくることになった。
    - label: もう一度塗る
      do: [ { 気配: -3 } ]
      result: 声は静かになった。代わりに、ここにいたことも誰にも知られなかった。

- id: ev_bango
  title: 番号札
  text: 下足札が並んでいる。1、2、3、5、8、God。4と6と7が抜けている。
  choices:
    - label: 抜けた所に自分の名前を入れる
      do: [ { お土産を得る: sv_ketsubanfuda }, { 気配: 3 } ]
      result: 自分の名前の札が「欠番」に変わった。それを持って帰っていいらしい。
    - label: 札を数え直す
      do: [ { 体力: 8 }, { 宿銭: 5 } ]
      result: 何度数えても六枚だった。落ち着いたので、体力が戻った。

- id: ev_ketsuban_bus
  title: 欠番行きのバス
  text: 地下にバス停。時刻表には「欠6行き」「欠7行き」「Tier8経由God行き」。
  choices:
    - label: Tier8経由God行きに乗る
      do: [ { 番付を移す: { カテゴリ: 一番低い, 先: God } }, { 体力: -8 } ]
      result: 一番低かったカテゴリがGodまで運ばれた。バスは乗り心地が最悪だった。
    - label: 時刻表を書き換える
      hide: true
      do: [ { 番付を入れ替える: { カテゴリ: 一番低い, 相手: 一番高い } }, { 気配: 3 } ]
      result: 一番低いカテゴリと一番高いカテゴリが、行き先を間違えて入れ替わった。運転手が怒っている。

- id: ev_tensai_sokuhou
  title: 速報の号外
  text: 号外が舞っている。「速報：速さ、ついにTier1へ」「速報：さっきの速報は誤報」。
  choices:
    - label: 最初の号外を拾う
      do: [ { 番付を上げる: { カテゴリ: 速さ, 段: 2 } }, { 気配: 2 } ]
      result: 誤報だったが、速さは信じて2段上がった。
    - label: 二枚目の号外を拾う
      do: [ { 宿銭: 15 } ]
      result: 誤報の訂正記事は高く売れた。

- id: ev_shinigami_ryokan
  title: 死神の宿泊
  text: 死神がチェックインしている。宿帳の職業欄に「Tier付け（終身）」。
  choices:
    - label: 荷物を運ぶ
      do: [ { 体力: -6 }, { 番付を上げる: { カテゴリ: 死, 段: 2 } }, { 宿銭: 10 } ]
      result: 鎌が重かった。チップと、死の番付の推薦をもらった。
    - label: 「当館は満室です」と言う
      do: [ { 気配: -2 }, { お品書きを得る: 番付札 } ]
      result: 死神は素直に帰った。去り際に、こちらの寿命の代わりに札を一枚置いていった。
