# 第四層の謎
- id: ev_ketsuban_heya
  title: 欠番の部屋
  text: 「6」と「7」の札が掛かった部屋。どちらも、中から鍵がかかっている。
  choices:
    - label: 6の部屋を叩く
      do: [ { 番付を移す: { カテゴリ: 乱数, 先: 欠6 } }, { 気配: 2 } ]
      result: 番付のどこかが、6へ消えた。
    - label: 7の部屋を叩く
      do: [ { 体力: -15 }, { 番付を移す: { カテゴリ: 乱数, 先: 欠7 } } ]
      result: 叩いた手が痛む。番付のどこかが、7へ消えた。
    - label: 素通りする
      result: 二つの部屋は、どちらも静かなままだった。

- id: ev_sakujo_irai
  title: 削除依頼
  text: 掲示板の隅に、削除依頼の用紙。対象の欄は、空いている。
  choices:
    - label: 適当な札を書き込む
      do: [ { デッキから除く: 乱数 }, { 宿銭: 25 } ]
      result: どの札を書いたのか、もう思い出せない。
    - label: 用紙を持ち帰る
      do: [ { お品書きを得る: 品 } ]
      result: 裏に、品書きが一枚貼ってあった。

- id: ev_kiyaku_doc
  title: 宿泊約款
  text: 分厚い約款。第8条だけ、何度も読まれた跡がある。
  choices:
    - label: 第8条を読む
      do: [ { 段位を上げる: { 組: 二対 } }, { 段位を上げる: { 組: 三揃 } }, { 気配: 2 } ]
      result: 「出す札は五枚ずつ」。覚えておこう。
    - label: 同意して閉じる
      do: [ { 宿銭: 20 } ]
      result: 同意の手数料が、なぜか戻ってきた。

- id: ev_kesareta
  title: 消された常連
  text: 名前の消された席が、ひとつ。座布団だけが温かい。
  choices:
    - label: 座る
      do: [ { 常連客を得る: 乱数 }, { 体力: -10 } ]
      result: 隣に、誰かが座っていた。
    - label: 座布団を返す
      do: [ { 気配: -3 } ]
      result: 席は、また誰かを待ち始めた。

- id: ev_bango
  title: 番号札
  text: 下足の番号札が落ちている。「6」と「7」だけが、無い。
  choices:
    - label: 拾い集める
      do: [ { お土産を得る: sv_ketsubanfuda }, { 気配: 3 } ]
      result: 欠けた番号の名札が、一枚混じっていた。
    - label: 番号を数える
      do: [ { 体力: 8 } ]
      result: 数えるたびに、少しずつ数が合わなくなった。
