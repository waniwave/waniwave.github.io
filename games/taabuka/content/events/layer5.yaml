# 第五層の謎（Tier8）
- id: ev_hachi_kagami
  title: 八枚の鏡
  text: 八枚の鏡が円く並ぶ。どの鏡にも自分が映っていて、全員が違うTierを名乗っている。
  choices:
    - label: 一番Tierの高い自分と握手する
      do: [ { 体力: -12 }, { 番付を上げる: { カテゴリ: 乱数, 段: 3 } } ]
      result: 握力がGodだった。手が痛い。番付が3段上がった。
    - label: 全員に「乙」と言う
      do: [ { 気配: -2 } ]
      result: 八人の自分が一斉に「乙」と返した。静かになった。
    - label: "鏡を八角形の家具にする"
      guest: [ikea]
      do: [ { お土産を得る: sv_waretagarasu }, { お土産を得る: sv_hachinoji } ]
      result: "説明書には九枚と書いてあった。"

- id: ev_kami_ka_8
  title: Godか8か
  text: 天秤の皿に「God」と「8」。どちらも、ものすごく軽い。
  choices:
    - label: 両方の皿に乗る
      do: [ { 番付を移す: { カテゴリ: 乱数, 先: God } }, { 番付を移す: { カテゴリ: 乱数, 先: "8" } } ]
      result: 天秤が釣り合った。一つのカテゴリがGodに、一つが8になった。
    - label: 天秤を売る
      do: [ { 宿銭: 30 }, { 気配: 3 } ]
      result: いい値で売れた。誰に売ったのかは思い出せない。
    - label: "taaaam様を天秤に乗せる"
      guest: [taaaam]
      do: [ { 番付を均す: God }, { 体力: -12 } ]
      result: "天秤が壊れた。全部Godになった。taaaam様は少し重かった。"

- id: ev_owakon
  title: 終わったスレ
  text: 「このスレは終了しました。次スレは立ちません。ここが最後です」。でも書き込みが続いている。
  choices:
    - label: 最後の書き込みをする
      do: [ { 番付を上げる: { カテゴリ: 乱数 } }, { 番付を上げる: { カテゴリ: 乱数 } }, { 気配: 3 } ]
      result: 書き込んだ。直後に誰かが書き込んだ。最後にはならなかったが、番付が二つ上がった。
    - label: 終わったことにして休む
      do: [ { 体力: 10 } ]
      result: 終わったスレの中は、意外と居心地がよかった。
    - label: "最後の書き込みで自己紹介する"
      guest: [tsuchi]
      do: [ { 番付を上げる: { カテゴリ: 一番低い, 段: 3 } }, { 気配: 2 } ]
      result: "スレが自己紹介で埋まった。終わったスレが、少しだけ延長された。"
    - label: "【ROM専】黙って見届ける"
      regular: [tj_r_rom]
      do: [ { 気配: -5 }, { 体力: 10 } ]
      result: "最後まで誰も気づかなかった。ROM専の本領だ。"

- id: ev_musubime
  title: 八の字の結び目
  text: 縄が八の字に結ばれている。ほどくとTierが一周する、と書いてある。
  choices:
    - label: 結び目ごと持っていく
      do: [ { お土産を得る: sv_hachinoji }, { 気配: 2 } ]
      result: ほどかないまま持って帰ることにした。それが一番安全だ。
    - label: 縄で縄跳びをする
      do: [ { 体力: 6 }, { 気配: -1 } ]
      result: 八の字跳びを八回。ちょっと楽しかった。

- id: ev_soko_nozoku
  title: 底への穴
  text: 床に穴。覗くと、下の階でも誰かが穴を覗いていて、目が合う。その下にも、その下にも。
  choices:
    - label: 手を振る
      do: [ 襖を見せる, { 気配: 4 } ]
      result: 下の全員が手を振り返した。その拍子に、この階の襖が全部開いて見えた。
    - label: 蓋をする
      do: [ { 気配: -3 }, { 宿銭: 8 } ]
      result: 蓋の上に小銭が置いてあった。きっと、上の階の誰かが落としたのだ。

- id: ev_tier8_party
  title: Tier8の集い
  text: 「Tier8の会　第八回」。全員が胸に「8」のバッジ。こちらを見て「新入りか？」。
  choices:
    - label: バッジを付ける
      hide: true
      do: [ { 番付を均す: "8" }, { 宿銭: 40 } ]
      result: 全カテゴリがTier8になった。会費の代わりに、会員特典の宿銭をもらった。Tier8の強さは出しのたびに変わる。
    - label: 「自分はGodです」と言う
      do: [ { 体力: -10 }, { 番付を上げる: { カテゴリ: 一番高い, 段: 2 } } ]
      result: 袋叩きにされた。でも、一番高いカテゴリはさらに2段上がった。
    - label: "会場に木を植える"
      guest: [tatagi]
      do: [ { 常連客を得る: 乱数 }, { 番付を上げる: { カテゴリ: 動物, 段: 2 } } ]
      result: "Tier8の会は植樹祭になった。一人が宿までついてきた。"

- id: ev_okami_soko
  title: 底の女将
  text: こんな深い所に女将がいる。「あら、こっちの宿にも来てくれたの」。宿の女将とそっくりだが、帯が逆。
  choices:
    - label: お茶をいただく
      do: [ { 体力: 15 }, { 気配: 2 } ]
      result: 番茶だった。逆さに注がれたのに、ちゃんと湯呑みに入った。
    - label: 帯留めを見せる
      do: [ { お土産を得る: sv_obidome }, { 番付を上げる: { カテゴリ: 宿, 段: 2 } } ]
      result: 「それ、私のよ」。帯留めが二つになった。宿の番付も上がった。
    - label: "マープと底の女将がお茶をする"
      guest: [maap]
      do: [ { 体力: 30 }, { お土産を得る: sv_obidome }, { お土産を得る: sv_obidome } ]
      result: "二人は姉妹だったらしい。帯留めを交換して、こちらにも一つずつくれた。"
