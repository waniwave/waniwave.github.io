# 第五層の謎
- id: ev_hachi_kagami
  title: 八枚の鏡
  text: 八枚の鏡が並んでいる。どれにも、Tier8の自分が映っている。
  choices:
    - label: 一枚割る
      do: [ { 体力: -12 }, { 番付を上げる: { カテゴリ: 乱数, 段: 3 } } ]
      result: 割れた鏡の中だけ、番付が上がっていた。
    - label: 見ないふりをする
      do: [ { 気配: -2 } ]
      result: 鏡の自分たちが、そっと目を逸らした。

- id: ev_kami_ka_8
  title: Godか8か
  text: 二つの扉。「God」と「8」。どちらも、同じ廊下に続いている。
  choices:
    - label: Godを開ける
      do: [ { 番付を移す: { カテゴリ: 乱数, 先: God } }, { 番付を移す: { カテゴリ: 乱数, 先: "8" } } ]
      result: 上がったものと、落ちたものがあった。
    - label: 8を開ける
      do: [ { 宿銭: 30 }, { 気配: 3 } ]
      result: 8の部屋は、案外居心地がよかった。

- id: ev_owakon
  title: 終わったスレ
  text: 誰も書き込まなくなったスレ。最後のレスは「8」。
  choices:
    - label: 書き込む
      do: [ { 番付を上げる: { カテゴリ: 乱数 } }, { 番付を上げる: { カテゴリ: 乱数 } }, { 気配: 3 } ]
      result: 久しぶりに、レスが付いた。
    - label: そっとしておく
      do: [ { 体力: 10 } ]
      result: スレは、静かに落ちていった。

- id: ev_musubime
  title: 八の字の結び目
  text: 縄が、八の字に結ばれている。ほどけば、何かが解ける気がする。
  choices:
    - label: ほどく
      do: [ { お土産を得る: sv_hachinoji }, { 気配: 2 } ]
      result: ほどいた縄は、手の中でまた8になった。
    - label: 結び直す
      do: [ { 体力: 6 }, { 気配: -1 } ]
      result: 結び目が、少しだけ固くなった。

- id: ev_soko_nozoku
  title: 底への穴
  text: 床に、小さな穴。覗くと、ずっと下で何かが座っている。
  choices:
    - label: 覗き込む
      do: [ 襖を見せる, { 気配: 4 } ]
      result: 目が合った気がした。この階の「？」が、全部見えた。
    - label: 板で塞ぐ
      do: [ { 気配: -3 }, { 宿銭: 8 } ]
      result: 板の下で、何かがじっと待っている。
