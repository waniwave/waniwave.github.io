# 第三層の謎
- id: ev_tohyo
  title: 投票箱
  text: 「どれが一番強い？」と書かれた投票箱。紙は、もう入れてある。
  choices:
    - label: 自分の票を入れる
      do: [ { 番付を上げる: { カテゴリ: 乱数, 段: 2 } }, { 気配: 2 } ]
      result: 開票は、すぐに終わった。
    - label: 票を抜く
      do: [ { 番付を下げる: { カテゴリ: 乱数, 段: 1 } }, { 宿銭: 15 } ]
      result: 誰かの票が、小銭に変わった。
    - label: 見なかったことにする
      result: 投票箱は、まだ受け付けている。

- id: ev_matome_ban
  title: 張り出された番付表
  text: 壁に、誰かの作った番付表。赤ペンで何度も直されている。
  choices:
    - label: 書き写す
      do: [ { 体力: -8 }, { お品書きを得る: 番付札 }, { お品書きを得る: 番付札 } ]
      result: 写し終える頃には、表はまた直されていた。
    - label: 破る
      do: [ 番付を均す, { 宿銭: 10 } ]
      result: 番付が、最初の形に戻った。

- id: ev_kidoku_suru
  title: 未読の山
  text: 返事を待っているレスが、床一面に積まれている。
  choices:
    - label: 全部読む
      do: [ { 気配: 3 }, { 番付を上げる: { カテゴリ: 乱数 } }, { 番付を上げる: { カテゴリ: 乱数 } } ]
      result: 既読が付いた。どこかで、誰かが顔を上げた。
    - label: 未読のまま閉じる
      do: [ { 気配: -2 }, { 体力: 6 } ]
      result: 通知の数だけが、増えていく。

- id: ev_ronpa_ba
  title: 論破の跡
  text: 床に、誰かが論破された跡。まだ温かい。
  choices:
    - label: 残った言葉を拾う
      do: [ { お品書きを得る: 議題 }, { お品書きを得る: 品 }, { 気配: 2 } ]
      result: 言葉は、拾うと品書きになった。
    - label: 手を合わせる
      do: [ { 体力: 10 } ]
      result: 跡は、静かに薄れた。

- id: ev_sakasa_kakejiku
  title: 逆さの掛け軸
  text: 床の間の掛け軸が、上下逆さまに掛かっている。直しますか。
  choices:
    - label: 直す
      do: [ 番付を反転, { 宿銭: 12 } ]
      result: 掛け軸は直った。番付が逆さまになった。
    - label: そのままにする
      do: [ { 番付を上げる: { カテゴリ: 乱数 } } ]
      result: 逆さのまま読むと、少しだけ意味が通った。

- id: ev_tier_meeting
  title: 番付会議
  text: 13人の論客が円卓を囲んでいる。「ターは何Tierか」で四十年揉めているらしい。
  choices:
    - label: 「God」と言う
      do: [ { 番付を上げる: { カテゴリ: ター, 段: 2 } }, { 気配: 3 } ]
      result: 半分が拍手し、半分が帰った。会議は四十一年目に入る。
    - label: 「人それぞれ」と言う
      do: [ { 体力: 10 } ]
      result: 全員が黙った。お茶が出てきた。
- id: ev_mirror_inn
  title: 宿の鏡
  text: 大きな鏡。映っている宿は、こっちより少しだけゴージャスだ。
  choices:
    - label: 向こうの宿に挨拶する
      do: [ { 宿銭: 20 }, { 気配: 2 } ]
      result: 向こうの女将が会釈した。ご祝儀をもらった。
    - label: 見なかったことにする
      result: 背中で、向こうの宿の暖簾が揺れた気がした。
