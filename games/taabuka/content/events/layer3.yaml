# 第三層の謎（議論の淵）
- id: ev_tohyo
  title: 投票箱
  text: 「次のGodを決める投票箱」。投票用紙の候補は「ター」「ター」「ター」「その他（ター）」。
  choices:
    - label: 「その他」に入れる
      do: [ { 番付を上げる: { カテゴリ: 乱数, 段: 2 } }, { 気配: 2 } ]
      result: 開票の結果、全部ターだった。それでもなぜか別のカテゴリが2段上がった。
    - label: 白票を入れる
      do: [ { 番付を下げる: { カテゴリ: 乱数, 段: 1 } }, { 宿銭: 15 } ]
      result: 白票は「無効票買い取り」窓口で換金できた。代わりに番付が一つ、拗ねて下がった。
    - label: 箱ごと持って帰る
      hide: true
      do: [ { 気配: 5 }, { お品書きを得る: 番付札 }, { お品書きを得る: 番付札 } ]
      result: 重い。中身は全部、番付札だった。後ろから選挙管理委員が走ってくる。

- id: ev_matome_ban
  title: 張り出された番付表
  text: 壁に番付表。誰かが赤ペンで「異議あり」と書き、別の誰かが「異議に異議あり」と書いている。
  choices:
    - label: 「異議に異議に異議あり」と書く
      do: [ { 体力: -8 }, { お品書きを得る: 番付札 }, { お品書きを得る: 番付札 } ]
      result: 赤ペンのインクが尽きるまで書いた。腱鞘炎と引き換えに、番付札を二枚。
    - label: 全部消して書き直す
      do: [ 番付を均す, { 宿銭: 10 } ]
      result: 番付が潜った日の並びに戻った。消しゴムのカスを売ったら宿銭になった。

- id: ev_kidoku_suru
  title: 未読の山
  text: 未読1万件。開くと全部「それな」。
  choices:
    - label: 全部「それな」と返す
      do: [ { 気配: 3 }, { 番付を上げる: { カテゴリ: 乱数 } }, { 番付を上げる: { カテゴリ: 乱数 } } ]
      result: 「それな」の嵐で、番付が二つ同意して上がった。通知音がうるさい。
    - label: 全部既読にする
      do: [ { 気配: -2 }, { 体力: 6 } ]
      result: すっきりした。心も体も軽い。

- id: ev_ronpa_ba
  title: 論破の跡
  text: 床にチョークで人型。「ここで論破されました」。人型の手には、お品書きが握られている。
  choices:
    - label: 人型の手から抜き取る
      do: [ { お品書きを得る: 議題 }, { お品書きを得る: 品 }, { 気配: 2 } ]
      result: 人型が「……それ、まだ使うつもりだった」と言った。気にしないことにした。
    - label: 人型の横に寝てみる
      do: [ { 体力: 10 } ]
      result: ちょうどいい形にくぼんでいて、よく眠れた。

- id: ev_sakasa_kakejiku
  title: 逆さの掛け軸
  text: 掛け軸が逆さに掛かっている。「下が上、上が下、ターがター」。
  choices:
    - label: 掛け軸に従う
      do: [ 番付を反転, { 宿銭: 12 } ]
      result: 番付が全部ひっくり返った。床の間の裏から、ひっくり返ったお年玉。
    - label: 掛け軸を直す
      do: [ { 番付を上げる: { カテゴリ: 乱数 } } ]
      result: 掛け軸が「余計なことを」と言った。番付がひとつだけ、気を使って上がった。

- id: ev_tier_meeting
  title: 番付会議
  text: 座布団が十三枚、円く並んでいる。議長席に「ター」の名札。議題は「ターのTierについて」。
  choices:
    - label: 議長席に座る
      do: [ { 番付を上げる: { カテゴリ: ター, 段: 2 } }, { 気配: 3 } ]
      result: 誰も来ないまま、満場一致でターが2段上がった。議事録はこちらで書いておいた。
    - label: 座布団を全部重ねて寝る
      do: [ { 体力: 10 } ]
      result: 十三段重ねの座布団はふかふかだった。会議は来週に延期された。

- id: ev_mirror_inn
  title: 宿の鏡
  text: 鏡の中にも宿がある。鏡の中の女将が、こちらに手招きしている。宿銭を持って。
  choices:
    - label: 宿銭を受け取る
      do: [ { 宿銭: 20 }, { 気配: 2 } ]
      result: 鏡の向こうの宿銭は、左右が逆の字で「銭宿」と書いてあった。使えた。
    - label: 手を振り返す
      result: 女将も手を振った。こっちの女将より少し若かった。

- id: ev_anka_sama
  title: 安価さま
  text: 祠に「>>3が言ったことは絶対」と書いてある。祠の前の紙に、3つの書き込み。
  choices:
    - label: ">>1「湯に入れ」"
      do: [ { 体力: 12 }, { 番付を上げる: { カテゴリ: 湯 } } ]
      result: ">>1 に従った。気持ちいい。湯の番付も上がった。安価さまは少し不満そうだ。"
    - label: ">>2「麺を食え」"
      do: [ { 体力: 5 }, { 番付を上げる: { カテゴリ: 麺, 段: 2 } } ]
      result: ">>2 に従った。うまい。麺の番付が2段上がった。"
    - label: ">>3「全部捨てろ」"
      hide: true
      do: [ { デッキから除く: 乱数 }, { 宿銭: 30 }, { お品書きを得る: 番付札 } ]
      result: 安価は絶対。デッキの札が1枚どこかへ行った。安価さまは満足して、宿銭と札をくれた。

- id: ev_kaidan_tier
  title: Tier付けされた階段
  text: 階段の一段一段に「T8」「T5」「T4」……「God」。一番上は天井に突き刺さっている。
  choices:
    - label: Godの段まで登る
      do: [ { 体力: -10 }, { 番付を移す: { カテゴリ: 乱数, 先: God } } ]
      result: 頭を天井に打った。でも、カテゴリが一つGodになった。痛いけどGod。
    - label: T8の段で休む
      do: [ { 体力: 8 }, { 気配: -2 } ]
      result: T8の段は誰も来ないので、とても静かだった。

- id: ev_yuge_ronsou
  title: 湯気論争
  text: 湯気が二つ、「湯気はTier1」「いや湯気は気体だからTierがない」と言い争っている。
  choices:
    - label: 窓を開けて換気する
      do: [ { 気配: -3 }, { 宿銭: 8 } ]
      result: 湯気が二つとも外へ出ていった。部屋が静かになり、床に湯気の落とし物（小銭）。
    - label: 両方吸い込む
      do: [ { 体力: -5 }, { お土産を得る: sv_yunohana }, { 番付を上げる: { カテゴリ: 湯 } } ]
      result: むせた。喉の奥で議論が続いている。咳と一緒に湯の花が出てきた。
