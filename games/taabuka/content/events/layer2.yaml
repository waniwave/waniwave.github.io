# 第二層の謎
- id: ev_noren
  title: 暖簾
  text: 通路の突き当たりに、赤い暖簾が下がっている。向こうから、湯気。
  choices:
    - label: くぐる
      do: [ { 体力: -10 }, { お土産を得る: sv_noren } ]
      result: 湯気の向こうに、誰もいない厨房があった。
    - label: くぐらない
      result: 暖簾は、風もないのに揺れていた。

- id: ev_fusumae
  title: 襖絵
  text: 襖に描かれた猫が、こちらを見ている。
  choices:
    - label: 撫でる
      do: [ { 体力: 8 }, { 気配: 1 } ]
      result: 猫は描かれたまま、少し丸くなった。
    - label: 目を逸らす
      result: 視線だけが、ついてきた。

- id: ev_soko
  title: 過去ログ倉庫
  text: 棚いっぱいの古いスレ。一冊だけ、背が新しい。
  choices:
    - label: 読む
      do: [ 番付を均す, { お品書きを得る: 議題 } ]
      result: 番付が、最初の形に戻った。最後の頁に、議題がひとつ。
    - label: 棚に戻す
      do: [ { 気配: -2 } ]
      result: 倉庫が、少し静かになった。

- id: ev_ura
  title: 襖の裏
  text: 襖の裏にも、襖の絵が描いてある。その絵の襖が、少し開いている。
  choices:
    - label: 覗く
      do: [ 襖を見せる, { 気配: 2 } ]
      result: この階の「？」が、全部見えた。
    - label: 閉める
      do: [ { 体力: 5 } ]
      result: 隙間風が止んだ。

- id: ev_dat
  title: 落ちたスレ
  text: 床に、落ちたスレが積まれている。どれも「1000」で終わっている。
  choices:
    - label: 最後まで読む
      do: [ { 体力: -6 }, { 段位を上げる: { 組: 対 } }, { 段位を上げる: { 組: 二対 } } ]
      result: 目が疲れた。「対」と「二対」の段位が上がった。
    - label: 次スレを探す
      do: [ { お品書きを得る: 番付札 } ]
      result: 「次スレ」と書かれた札が挟まっていた。

- id: ev_tsuzumi
  title: 鼓の音
  text: 襖の向こうで、鼓が鳴る。一定の間で、誰かを呼んでいる。
  choices:
    - label: 呼ばれてみる
      do: [ { 常連客を得る: 乱数 }, { 気配: 3 } ]
      result: 席に、誰かが座っていた。
    - label: 音から離れる
      do: [ { 気配: -2 } ]
      result: 鼓は、別の誰かを呼び始めた。

- id: ev_kagami
  title: 曇った鏡
  text: 襖に、鏡が一枚はめ込まれている。映っているのは、こちらの番付だけ。
  choices:
    - label: 拭く
      do: [ 番付を反転 ]
      result: 鏡の中で、番付が逆さまになった。
    - label: 割る
      do: [ { 体力: -5 }, { お土産を得る: sv_waretagarasu } ]
      result: 破片が一枚、懐に入った。
    - label: 触らない
      result: 鏡の番付が、少しだけ揺れた。

- id: ev_obidome
  title: 帯留めの落とし物
  text: 畳の上に、上等な帯留め。誰の物かは、だいたい分かる。
  choices:
    - label: 懐に入れる
      do: [ { お土産を得る: sv_obidome }, { 気配: 4 } ]
      result: 背中に、視線を感じる。
    - label: 帳場に届ける
      do: [ { 宿銭: 10 }, { 気配: -1 } ]
      result: 礼を言われた気がする。誰もいないのに。
