# 第二層の謎
- id: ev_noren
  title: 暖簾
  text: 突き当たりに赤い暖簾。「ターの湯」と書いてある。向こうから、ものすごい湯気と、ものすごい議論の声。
  choices:
    - label: くぐる
      do: [ { 体力: -10 }, { お土産を得る: sv_noren } ]
      result: 湯気で前が見えず、柱に三回ぶつかった。暖簾の切れ端が顔に貼りついたまま戻ってきた。
    - label: くぐらない
      result: 暖簾の向こうで「今の人、Tier低そう」と言われた。

- id: ev_fusumae
  title: 襖絵の猫
  text: 襖に描かれた猫が、こちらの手札をじっと見ている。たまに「にゃーん（それはTier4）」と言う。
  choices:
    - label: 撫でる
      do: [ { 体力: 8 }, { 気配: 1 } ]
      result: 絵なのに温かかった。ゴロゴロ言っているうちに、こちらの体力が戻った。
    - label: 手札を見せてやる
      do: [ { 番付を上げる: { カテゴリ: 動物, 段: 2 } } ]
      result: 猫が「わかってるね」という顔をした。動物の番付が2段上がった。

- id: ev_soko
  title: 過去ログの棚
  text: 天井まで積まれた過去ログ。全部「ターは何Tierか」というスレで、Part1からPart9999まである。
  choices:
    - label: Part1を読む
      do: [ 番付を均す, { お品書きを得る: 議題 } ]
      result: 最初は誰も揉めていなかった。番付が潜った日の並びに戻り、議題を一枚拾った。
    - label: そっと棚を戻す
      do: [ { 気配: -2 } ]
      result: 棚の奥で、Part10000が静かに立った。こちらに気づいた者はいない。

- id: ev_ura
  title: 襖の裏
  text: 襖の裏に、この階の見取り図が描いてある。ただし縮尺が「1：Tier」。
  choices:
    - label: 読み解く
      do: [ 襖を見せる, { 気配: 2 } ]
      result: なんとなくわかった。この階の「？」の襖が全部見えるようになった。
    - label: 見取り図で扇ぐ
      do: [ { 体力: 5 }, { 宿銭: 5 } ]
      result: 涼しい。扇いでいたら、裏から小銭がこぼれた。

- id: ev_dat
  title: 落ちたスレ
  text: 床に「このスレッドは過去ログ倉庫に格納されています」と書かれた穴。中から書き込みの声がする。
  choices:
    - label: 飛び込んで書き込む
      do: [ { 体力: -6 }, { 番付を上げる: { カテゴリ: 乱数 } }, { 番付を上げる: { カテゴリ: 乱数 } } ]
      result: 格納済みのスレに書き込んだ。ありえないので、番付が二つ驚いて上がった。
    - label: 穴に「乙」と言う
      do: [ { お品書きを得る: 番付札 } ]
      result: 穴から「乙」が返ってきて、札の形になった。

- id: ev_tsuzumi
  title: 鼓の音
  text: ポン、ポン、ポン。リズムに合わせて「Tier・Tier・God！」の掛け声。誰かが宴会をしている。
  choices:
    - label: 宴会に混ざる
      do: [ { 常連客を得る: 乱数 }, { 気配: 3 } ]
      result: 意気投合した一人がついてくることになった。宴会は大きな声で続いている。
    - label: 手拍子だけして通り過ぎる
      do: [ { 気配: -2 } ]
      result: 手拍子が上手すぎて、宴会の一部だと思われた。誰にも気づかれずに通れた。

- id: ev_kagami
  title: 曇った鏡
  text: 曇った鏡に指で「ター」と書くと、鏡の中では「—タ」になっている。
  choices:
    - label: 鏡の中に入る
      do: [ 番付を反転 ]
      result: 鏡の中の宿は、番付が全部逆さだった。そのまま出てきてしまった。
    - label: 鏡を割る
      do: [ { 体力: -5 }, { お土産を得る: sv_waretagarasu } ]
      result: 割れた欠片の一枚一枚に、自分の手札が映っている。一枚、持って帰ることにした。
    - label: 曇りを拭く
      result: 拭いたら普通の鏡だった。普通なのが一番怖い。

- id: ev_obidome
  title: 帯留めの落とし物
  text: 廊下に女将の帯留め。拾おうとすると、帯留めが「自分で戻れます」と言う。
  choices:
    - label: 届けてあげる
      do: [ { お土産を得る: sv_obidome }, { 気配: 4 } ]
      result: 「じゃあ、お願いします」。帯留めは道中ずっと女将の悪口を言っていた。
    - label: 帯留めの言うとおりにする
      do: [ { 宿銭: 10 }, { 気配: -1 } ]
      result: 帯留めが転がって帰っていった。お礼の小銭を置いて。

- id: ev_sasaki2
  title: 佐々木が二人
  text: 「佐々木です」「佐々木です」。全く同じ顔の二人が、どっちが本物のTier1か揉めている。
  choices:
    - label: 左の佐々木に味方する
      do: [ { 宿銭: 12 } ]
      result: 左の佐々木がお礼をくれた。右の佐々木も同じ額のお礼をくれようとしたが、断った。
    - label: 「両方Tier8」と言う
      do: [ { 気配: 2 }, { お品書きを得る: 番付札 } ]
      result: 二人が手を取り合って怒り出した。仲直りのきっかけになったので、札をもらった。

- id: ev_ikea_room
  title: 組み立て途中の部屋
  text: 部屋が半分しかない。床に説明書。「1. 番付を立てる　2. Tierを差し込む　3. 余ったネジは気にしない」。
  choices:
    - label: 説明書どおり組む
      do: [ { 体力: -6 }, { 札に付ける: { 対象: 乱数, 仕込み: 乱数 } } ]
      result: ネジが三本余った。余ったネジを札に挿したら、仕込みになった。
    - label: 説明書を読まずに組む
      do: [ { 気配: 3 }, { 宿銭: 10 } ]
      result: 部屋が一部屋半になった。ドアを開けたら、ここに戻ってきた。宿銭が増えていた。

- id: ev_yuoke_tower
  title: 湯桶の塔
  text: 湯桶が天井まで積み上がっている。一番上に「Tier1」と書いた湯桶。一番下に「Tier8」。
  choices:
    - label: 一番下を抜く
      hide: true
      do: [ 番付を反転, { 宿銭: 15 } ]
      result: 塔が崩れた。湯桶が全部ひっくり返り、番付も全部ひっくり返った。下から小銭。
    - label: 一番上だけ取る
      do: [ { 体力: -4 }, { お土産を得る: sv_yunohana } ]
      result: 湯桶の底に湯の花がこびりついていた。削って持って帰る。

- id: ev_bantou_nemuri
  title: 居眠り番頭
  text: 番頭が帳場で寝ている。寝言で「……ロボは……Tier2……いや3……」。
  choices:
    - label: 耳元で「God」とささやく
      do: [ { 番付を上げる: { カテゴリ: ロボ, 段: 2 } }, { 気配: 2 } ]
      result: 番頭が「God……」と復唱した。夢の中の番付が書き換わり、現実のロボの番付も上がった。
    - label: そっと毛布を掛ける
      do: [ { 体力: 6 }, { お品書きを得る: 品 } ]
      result: 番頭のポケットからお品書きが落ちた。寝ている人の物だけど、たぶん大丈夫。
