# 世界のおしゃべり（フレーバー。強さには関わらない）
# talk：客間の雑談。with の常連客を1人でも持っていると読める（女将は誰でも）。lines は [話し手, 台詞]
# enemy：論客の口上（intro）と論破されたときのひと言（defeat）。戦闘の始めと勝ったときに吹き出しで出る
# thread：掲示板の「スレ」に、潜行のあと流れる書き込み。{floor}{guest}{card}{zeni}{enemy}{n} が入る。when で場面を分ける
# doors：襖を開けた瞬間のひと言（種類ごと）
# okami：女将のその日のひと言（宿の絵の上の吹き出し）
# testimony：図鑑の「証言」（敵や札のID → 一言ずつ）
# shop／bath／landing／reward：その部屋の一行（行商人・湯・踊り場・拾い物）
# battleWin／battleLose：戦闘の結果の窓の、女将のひと言

