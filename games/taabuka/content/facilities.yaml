# 宿の施設と段階（仕様書 第6章）。一度上げた段階は下がらない
# levels の1つめが初期（Lv1）。cost は { zeni, souvenirs: { お土産ID: 個数 } }。
# effect は上の段階の値で上書きされる（書いていない項目は前の段階のまま）。
# 本編で全段階を改装できる。
- id: chouba
  name: 帳場
  text: 札とデッキを買う所。初期デッキ（素泊まりセット）ももらえる
  levels:
    - { effect: { shopCards: 5, shopGrades: [並, 上] } }   # 帳場の札はその札の最低レアリティ（コモン・アンコモン）
    - { cost: { zeni: 300 }, effect: { shopCards: 7, shopGrades: [並, 上, 特上] } }
    - { cost: { zeni: 1500, souvenirs: { sv_tsunokakera: 1 } }, effect: { pawnshop: true } }
    - { cost: { zeni: 6000 }, effect: { shopCards: 9, shopGrades: [並, 上, 特上] } }   # 帳場はレアまで。レジェンダリー以上は潜って拾う

- id: kura
  name: 蔵
  text: 持ち物をしまい、デッキを組む所。札の複製もここ
  levels:
    # 棚ごとの上限（札はデッキに入れた分を数えない。お土産は種類の数。同じ種類は stack 個まで重ねられる）
    - { effect: { caps: { card: 60, regular: 12, item: 12, souvenir: 20, stack: 99 }, copyUpTo: null } }
    - { cost: { zeni: 300, souvenirs: { sv_furuikagi: 1 } }, effect: { caps: { card: 120, regular: 20, item: 20, souvenir: 30, stack: 99 }, copyUpTo: アンコモン } }
    - { cost: { zeni: 1200, souvenirs: { sv_kaketahari: 2 } }, effect: { caps: { card: 225, regular: 35, item: 35, souvenir: 45, stack: 199 } } }
    - { cost: { zeni: 5000, souvenirs: { sv_taajirushi: 3 } }, effect: { caps: { card: 450, regular: 60, item: 60, souvenir: 70, stack: 999 } } }

- id: monooki
  name: 物置
  text: 潜るときに持てる量を増やす（懐＝拾った物、お守り袋＝倒れても残る）
  levels:
    - { effect: { pouch: 8, charm: 1 } }
    - { cost: { zeni: 200, souvenirs: { sv_hakusen: 1 } }, effect: { pouch: 10 } }
    - { cost: { zeni: 800, souvenirs: { sv_hakusen: 2 } }, effect: { pouch: 12, charm: 2 } }
    - { cost: { zeni: 2000 }, effect: { pouch: 14 } }
    - { cost: { zeni: 6000, souvenirs: { sv_tsunokakera: 1 } }, effect: { pouch: 16, charm: 3 } }

- id: kyakuma
  name: 客間
  text: 潜行に連れていく常連客の席を増やす
  levels:
    - { effect: { seats: 1 } }
    - { cost: { zeni: 500, souvenirs: { sv_obidome: 1 } }, effect: { seats: 2 } }
    - { cost: { zeni: 4000, souvenirs: { sv_obidome: 2 } }, effect: { seats: 3 } }

- id: kamidana
  name: 神棚
  text: 保険をかける所（倒れて失っても一部戻る）。失った物の供養もここ
  levels:
    - { effect: { returnRate: 0.70, premium: 0.30 } }
    - { cost: { zeni: 600, souvenirs: { sv_yunohana: 2 } }, effect: { returnRate: 0.75, premium: 0.25 } }
    - { cost: { zeni: 3000, souvenirs: { sv_yunohana: 4 } }, effect: { returnRate: 0.80, premium: 0.20 } }

- id: shikomi
  name: 仕込み場
  text: 札を強くする所（仕込み・版・判を付ける）。同じ札3枚の合わせで格上げ
  levels:
    - { effect: { enh: [金箔, 鋼, 守, 重し], ed: [], seal: [] } }
    - { cost: { zeni: 400, souvenirs: { sv_banzukekire: 3 } }, effect: { enh: [金箔, 鋼, 硝子, 多才, 石, 祝, 守, 重し] } }
    - { cost: { zeni: 1500, souvenirs: { sv_waretagarasu: 2 } }, effect: { ed: [箔押し, ホロ] } }
    - { cost: { zeni: 5000, souvenirs: { sv_tsunokakera: 2 } }, effect: { ed: [箔押し, ホロ, 多色], seal: [朱判, 金判, 青判, 紫判] } }

- id: keiko
  name: 稽古場
  text: 一度に出せる札の枚数を増やす
  levels:
    - { effect: { maxPlay: 5 } }
    - { cost: { zeni: 2500, souvenirs: { sv_tsunokakera: 1, sv_taajirushi: 1 } }, effect: { maxPlay: 6 } }
