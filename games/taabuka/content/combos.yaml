# 札同士のコンボ（カテゴリに関係なく、決まった札を同じ出しに入れると発動）
# cards：札の名前かID。[A, B] の要素を配列にすると「そのどれか」。1枚の札は1つのコンボにしか使わない
# 調整の目安：札を自由に選べる枠（配列）がある2枚コンボは控えめ（×2〜2.5、＋6）。看板と4枚コンボは強いまま
# effect：S（強さ＋）・M（倍率＋）・xM（倍率×）・xV（論破値×、最後に掛かる）・zeni（宿銭＋）
# fx：専用の演出（ui/fx/combo.js）。無ければ共通のカットイン。color は演出の色
# spell：呪文の中での呼び名（無ければ name）。shorts：呪文に使う札の短い名前
shorts:
  ウメハラ: ハラ
  ターメリック: ターメ
  ターメリックライス: ライス
  宝石をちりばめた生ハーム: 宝ハーム
  秒速5タームメートル: 秒速5
  分速300タームメートル: 分速300
  ゴールデン・オッペンターム: 金ペン
  シルバー・オッペンターム: 銀ペン
  ブロンズ・オッペンターム: 銅ペン
  ライアン・ゴゴゴーグ: ゴゴゴ
  ライアン・ゴゴゴゴーグ: ゴゴゴゴ
  女将マープ: マープ
  タームのことをワニだと勘違いして発砲しているレオン: レオン
  ターミネーターの弟、ターミネータジュニア: ジュニア
  ターミネータジュニアジュニア: ジュニジュニ
  寿限無寿限無五劫の擦り切れ: 寿限無

