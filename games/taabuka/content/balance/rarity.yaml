# レアリティ（作り直し仕様 D）。札の1枚ごとに付く。札の種類は grade で「最低レアリティ」を持つ
#  mul    … 効果の量（強さ・倍率・受け・体力・宿銭・次の出しの強さ・育つ・主張を削る量）に掛ける
#           掛け（×）は 1＋(x−1)×mul、引くは draw の表
#  repeat … 量の無い効果（番付を動かす・札を変える・行動停止など）を何回起こすか
#  vanilla… 効果の無い札を何回採点するか
#  affixes… 拾ったときに付く刻印の数（mythic はそのうちミシック専用の刻印の数）
order: [コモン, アンコモン, レア, レジェンダリー, ユニーク, ミシック]

defs:
  コモン:         { mul: 1,   repeat: 1, drawAdd: 0, vanilla: 1, affixes: 0, color: "#8d8a84" }
  アンコモン:     { mul: 1.5, repeat: 1, drawAdd: 0, vanilla: 1, affixes: 0, color: "#3f9a55" }
  レア:           { mul: 2,   repeat: 1, drawAdd: 1, vanilla: 1, affixes: 1, color: "#3b73c4" }
  レジェンダリー: { mul: 3,   repeat: 2, drawAdd: 1, vanilla: 2, affixes: 2, color: "#d4a017" }
  ユニーク:       { mul: 5,   repeat: 3, drawAdd: 2, vanilla: 3, affixes: 3, color: "#d4502c" }
  ミシック:       { mul: 8,   repeat: 4, drawAdd: 2, vanilla: 5, affixes: 3, mythic: 1, color: "rainbow" }

# 札の種類の grade（最低レアリティ）
gradeFloor: { 並: コモン, 上: アンコモン, 特上: レア, 極: レジェンダリー, 神: ユニーク }

# 拾う札のレアリティの重み（層ごと）。深度1ごとに、コモン以外を depthUp だけ重くする
weights:
  layer1: { コモン: 75, アンコモン: 25, レア: 0,  レジェンダリー: 0,  ユニーク: 0,  ミシック: 0 }
  layer2: { コモン: 45, アンコモン: 38, レア: 17, レジェンダリー: 0,  ユニーク: 0,  ミシック: 0 }
  layer3: { コモン: 25, アンコモン: 38, レア: 28, レジェンダリー: 9,  ユニーク: 0,  ミシック: 0 }
  layer4: { コモン: 10, アンコモン: 30, レア: 35, レジェンダリー: 20, ユニーク: 5,  ミシック: 0 }
  layer5: { コモン: 0,  アンコモン: 20, レア: 35, レジェンダリー: 30, ユニーク: 13, ミシック: 2 }
  deep:   { コモン: 0,  アンコモン: 0,  レア: 30, レジェンダリー: 40, ユニーク: 25, ミシック: 5 }
depthUp: 0.08

# 合わせ（仕込み場）：同じ札・同じレアリティ count 枚 → 1段上。作れるのは max まで
fuse: { count: 3, max: レジェンダリー, zeni: { コモン: 10, アンコモン: 30, レア: 80 } }

# 蔵の複製：できるのは maxCopy まで。レアリティごとの費用の倍率
copy: { maxCopy: レジェンダリー, costMul: { コモン: 1, アンコモン: 1.5, レア: 2.5, レジェンダリー: 6 } }

# 売値・買値・保険の掛け金に掛ける倍率
value: { コモン: 1, アンコモン: 2, レア: 4, レジェンダリー: 10, ユニーク: 30, ミシック: 100 }

# 帳場で買える札のレアリティ（段階ごと。段階の数字以下で一番上のもの）
shopRarity: { 1: アンコモン, 3: レア }
