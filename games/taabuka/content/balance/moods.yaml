# 場の状態（おふざけ札などが「場の状態」で切り替える。同時には1つ。新しい状態は前の状態を上書き）
# turns：続くターン数。効果（出すたびに掛かる）：
#   perScoredS / perScoredM：採点札1枚ごとに強さ／倍率＋　addM：倍率＋　xM：倍率×　xV：論破値×（最後）
#   zeniPerPlay：出すたび宿銭＋　guardMul：受けの倍率
# bgm：曲の変化（画面だけ）。tempo（速さ×）・shift（半音）・beat（手拍子）・mute（止める）・scale（音階の差し替え）・wave（音色）
