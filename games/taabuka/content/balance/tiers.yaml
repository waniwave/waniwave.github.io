# Tier と番付（仕様書 第3章「Tier」）
# 札の強さ・輪の位置・番付倍率。数値はここだけに書く。

# 共通の13カテゴリ（企画書 第4章）。並び順は「同数のときどれを選ぶか」にも使う。
categories: [食べ物, 死, 宿, 動物, スレ, 湯, 校庭, 速さ, 格ゲー, ター, 老, 麺, ロボ]

# Tierの輪（God→0→1→2→3→4→5→8→God）。位置番号は並び順の0〜7。
ring: [God, "0", "1", "2", "3", "4", "5", "8"]

# 番付（上の表）の段。札の強さは、その札のカテゴリが今いる段の strength
# rank＝番付で「一番高い」を決める順（大きいほど上）
tiers:
  # strength：そのTierにいるカテゴリの札1枚の強さ（札に固有の数字は無い。札の強さ＝カテゴリのTier）
  God: { strength: 60, rank: 10 }
  "0": { strength: 35, rank: 9 }
  "1": { strength: 22, rank: 8 }
  "2": { strength: 15, rank: 7 }
  "3": { strength: 10, rank: 6 }
  "4": { strength: 6,  rank: 5 }
  "5": { strength: 3,  rank: 4 }
  "8": { strength: { random: [3, 60] }, rank: 3 }   # 出しごとに乱数（その出しのTier8は全部同じ値）

missing:
  欠6: { strength: 10, perCardMul: 1.2, rank: 11, fromLayer: 4 }
  欠7: { strength: 10, perCardMul: 1.5, rank: 12, noGuard: true, fromLayer: 4 }

banzukeStart: "3"

# 番付を1段上げる／下げるときの並び（下→上）。欠番は「移す」でだけ出入りする
banzukeSteps: ["8", "5", "4", "3", "2", "1", "0", God]
