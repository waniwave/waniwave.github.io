# 出しの採点（作り直し仕様 B：札の強さ＝カテゴリのTier、倍率＝重なり）と仕込み・版・判
# 出しの土台。ポーカーの組は廃止（作り直し仕様 B）。order・hands は「重なり」1つだけ（古い参照のための形）
order: [重なり]
hands:
  重なり: { S: 0, M: 1, perLevelS: 0, perLevelM: 0 }
levelStart: 1
base: { S: 0, M: 1 }

# 重なり：採点札の中で同じカテゴリが n 枚なら、そのカテゴリの掛けは 1 + step×(n−1)（2枚×1.5、5枚×3）。
# カテゴリごとの掛けを全部掛け合わせる。重ね数で n は5を超えられる（cap まで）
overlap: { step: 0.5, cap: 9 }

# 敵の「封じ（最多カテゴリ）」が続くターン数（1＝次の1ターンだけ）。予告にどのカテゴリか出る
sealTurns: 1

# 論客の降参（論破のほかの勝ち方。engine/yield.js）。n：要る量。kindMul：敵の種類ごとの倍（層主は多め）
yields:
  番付落ち: { at: "5" }            # 相手のカテゴリが Tier5 以下（5か8）で降参
  封殺: { n: 3, kindMul: { 精鋭: 1.34, 層主: 1.67, 底の主: 2.34 } }
  呆れ: { n: 8, perJoke: 2, perMood: 2, kindMul: { 精鋭: 1.5, 層主: 2, 底の主: 3 } }
  根負け: { n: 6, kindMul: { 精鋭: 1.34, 層主: 1.67, 底の主: 2 } }
  論点ずらし: { n: 5, kindMul: { 精鋭: 1.2, 層主: 1.4, 底の主: 1.6 } }
  共感: { n: 10, kindMul: { 精鋭: 1.5, 層主: 2, 底の主: 3 } }

play:
  handSize: 8
  playsPerTurn: 2
  discardsPerTurn: 1
  minCards: 1
  maxPlayCards: 5
  maxDiscardCards: 5
  seats: 5
  itemSlots: 2
  deckMin: 15
  deckMax: 30
  maxEnemies: 3
  maxSummons: 6           # 1回の戦闘で「呼ぶ」で増える敵の上限（受けで耐え続けると戦闘が終わらないのを防ぐ）
  minMultiplier: 1        # 最後に M がこれ未満なら、これにする

# 仕込み（札に1つ）
enhancements:
  金箔: { heldTurnEndZeni: 1 }
  鋼:   { heldMulM: 1.5 }
  硝子: { mulM: 2, breakChance: 0.25 }
  多才: { allCategories: true }
  石:   { addS: 50, noTier: true, alwaysScored: true }
  祝:   { chance: 0.2, addM: 20 }
  守:   { guardMul: 3 }
  重し: { addS: 30, blocksDiscard: true }

# 版（札・常連客に1つ）
editions:
  箔押し: { addS: 50 }
  ホロ:   { addM: 10 }
  多色:   { mulM: 1.5 }
  陰画:   { seats: 1, regularOnly: true }

# 判（札に1つ）
seals:
  朱判: { retrigger: 1 }
  金判: { scoredZeni: 3 }
  青判: { heldTurnEndItem: 議題 }
  紫判: { discardedItem: 番付札 }

# 由来ごとの決まり（第5章「由来」）
origins:
  bet: { sPerGrow: 10 }   # 賭け札：潜行中、育ち1につき S＋10
