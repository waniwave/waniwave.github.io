# 組と採点（仕様書 第2章「組の判定」、第3章「組」、第5章「仕込み・版・判」）

# 優先順（上から最初に当てはまるもの）
order: [神組, 五揃同類, 満員同類, 五揃, 同類階段, 四揃, 満員, 同類, 階段, 三揃, 二対, 対, 単騎]

# S＝強さ、M＝倍率、perLevelS / perLevelM＝段位＋1ごと。段位は1から始まる
hands:
  単騎:     { S: 5,   M: 1,  perLevelS: 10, perLevelM: 1 }
  対:       { S: 10,  M: 2,  perLevelS: 15, perLevelM: 1 }
  二対:     { S: 20,  M: 2,  perLevelS: 20, perLevelM: 1 }
  三揃:     { S: 30,  M: 3,  perLevelS: 20, perLevelM: 2 }
  階段:     { S: 30,  M: 4,  perLevelS: 30, perLevelM: 3 }
  同類:     { S: 35,  M: 4,  perLevelS: 15, perLevelM: 2 }
  満員:     { S: 40,  M: 4,  perLevelS: 25, perLevelM: 2 }
  四揃:     { S: 60,  M: 7,  perLevelS: 30, perLevelM: 3 }
  同類階段: { S: 100, M: 8,  perLevelS: 40, perLevelM: 4 }
  五揃:     { S: 120, M: 12, perLevelS: 35, perLevelM: 3 }
  満員同類: { S: 140, M: 14, perLevelS: 40, perLevelM: 4 }
  五揃同類: { S: 160, M: 16, perLevelS: 50, perLevelM: 3 }
  神組:     { S: 200, M: 20, perLevelS: 60, perLevelM: 5 }

levelStart: 1

# 戦闘の行動の初期値（第3章「体力と行動の初期値」）
play:
  handSize: 8
  playsPerTurn: 2
  discardsPerTurn: 1
  minCards: 1
  maxPlayCards: 5
  maxDiscardCards: 5
  seats: 5
  itemSlots: 2
  deckMin: 15
  deckMax: 30
  maxEnemies: 3
  maxSummons: 6           # 1回の戦闘で「呼ぶ」で増える敵の上限（受けで耐え続けると戦闘が終わらないのを防ぐ）
  minMultiplier: 1        # 最後に M がこれ未満なら、これにする

# 仕込み（札に1つ）
enhancements:
  金箔: { heldTurnEndZeni: 1 }
  鋼:   { heldMulM: 1.5 }
  硝子: { mulM: 2, breakChance: 0.25 }
  多才: { allCategories: true }
  石:   { addS: 50, noTier: true, alwaysScored: true }
  祝:   { chance: 0.2, addM: 20 }
  守:   { guardMul: 3 }
  重し: { addS: 30, blocksDiscard: true }

# 版（札・常連客に1つ）
editions:
  箔押し: { addS: 50 }
  ホロ:   { addM: 10 }
  多色:   { mulM: 1.5 }
  陰画:   { seats: 1, regularOnly: true }

# 判（札に1つ）
seals:
  朱判: { retrigger: 1 }
  金判: { scoredZeni: 3 }
  青判: { heldTurnEndItem: 議題 }
  紫判: { discardedItem: 番付札 }

# 由来ごとの決まり（第5章「由来」）
origins:
  bet: { sPerGrow: 10 }   # 賭け札：潜行中、育ち1につき S＋10
