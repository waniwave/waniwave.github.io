# 敵の標準値（仕様書 第3章「敵の標準値」、第4章「気配」）
# 敵の主張と攻撃＝その階の標準値 × 敵ごとの倍率 × 種類の倍率 × 深度・気配の補正

floors:
  # B1〜B6 は段階8の自動対戦（本編の拾える範囲：流行語は第四層主まで閉じている）で合わせ直した値。B7〜B16 は×約1.45ずつ（通しの宿のボット --campaign で、持ち帰りと改装を重ねて届く伸び）
  1:  { claim: 1100,    atk: 3 }
  2:  { claim: 1650,    atk: 4 }
  3:  { claim: 2350,    atk: 4 }
  4:  { claim: 5000,    atk: 5 }
  5:  { claim: 8300,    atk: 6 }
  6:  { claim: 13300,    atk: 7 }
  7: { claim: 17700, atk: 8 }
  8: { claim: 25700, atk: 9 }
  9: { claim: 37000, atk: 10 }
  10: { claim: 54000, atk: 11 }
  11: { claim: 78000, atk: 12 }
  12: { claim: 113000, atk: 13 }
  13: { claim: 164000, atk: 14 }
  14: { claim: 238000, atk: 15 }
  15: { claim: 345000, atk: 16 }
  16: { claim: 500000, atk: 17 }

# B17以降：前の階×claimMul、前の階＋atkAdd
beyond: { claimMul: 3, atkAdd: 4 }

# 種類の倍率
kinds:
  通常:   { claim: 1,   atk: 1 }
  精鋭:   { claim: 2.5, atk: 1.3 }
  層主:   { claim: 3.6, atk: 0.9 }
  追跡者: { claim: 4,   atk: 1.6 }
  番人:   { claim: 1,   atk: 1.2, claimPerWeight: 0.1 }   # ×（1＋0.1×懐の重さ）
  底の主: { claim: 40,  atk: 1.8 }

# 長引いた戦闘：from ターン目から、毎ターン敵の攻撃×（1＋atkMul）（最低＋1）
enrage: { from: 12, atkMul: 0.25 }

# 通常戦で複数体出るときは、主張の合計が標準値になるよう割り振る
splitGroupClaim: true

# 気配（層ごと）
presence:
  enterRoom: 1
  sideRoom: 2
  battleTurnFrom: 7      # 戦闘のこのターン以降、ターンごとに perBattleTurn
  perBattleTurn: 1
  bath: -3
  # 主張の補正（高い段だけが効く）
  claimSteps:
    - { from: 4,  claim: 0.2 }
    - { from: 12, claim: 0.5 }
  stalker:
    - { from: 8,  chance: 0.2 }
    - { from: 12, chance: 1.0 }

# 階の生成（仕様書 第4章「階の生成」）
map:
  rows: [[3, 3], [2, 3], [2, 2]]     # 列ごとの襖の数（最小・最大）
  floorsPerLayer: 3                  # 層の何階目の終わりに層主戦があるか
  sideRoom: { chance: 0.3, gradeUp: 1 }   # 寄り道（入ると気配＋sideRoom。中身は格が1段高い宝）
  emergencyExit: { chance: 0.1 }     # 非常口（深度の noEmergencyExit で出ない）
  hiddenFromLayer: 2                 # この層から各列で1枚が「？」
  glowHide: { fromGrade: 極, chance: 0.1 }   # 紫以上はこの確率で光らない
  noEliteFirstRow: [1]               # この階の1列目には精鋭を出さない

# 深度5・17の「層主に固有の妨害が1つ追加」の候補（戦闘ごとに乱数で選ぶ。仕様書 第6章 深度）
# rule＝その戦闘に掛けるルール、mod＝出し・流し・手札上限への足し引き
bossHindrances:
  - { rule: 受けを無効, text: 出した札が受けにならない }
  - { rule: 倍率の下限を変える, params: { 下限: 0.5 }, text: 倍率の下限が0.5になる（番付が低いと1を割る） }
  - { mod: discards, delta: -1, text: 流しがターンに1回減る }
  - { mod: handSize, delta: -1, text: 手札の上限が1枚減る }
  - { rule: 採点順を逆に, text: 採点札を右から採点する }
