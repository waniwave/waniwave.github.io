# お品書きの雛形（content/sets/<セット>/items.yaml）。使い切り
- id: xx_i_namae
  name: お品書きの名前
  kind: 番付札               # 議題 / 番付札 / 品
  use: いつでも              # いつでも / 戦闘中 / 戦闘外（潜行中、戦闘の外だけ）
  ask: [カテゴリ]            # 使う前に選ばせるもの（カテゴリ / 札 / 札2 / 手札 / 敵）。無ければ省略
  # once: 潜行               # 1回の潜行で1度だけ
  # 議題は「カテゴリを1段上げる」お品書き（do に 番付を上げる）
  text: 選んだカテゴリの番付を1段上げる
  do:
    - 番付を上げる: { カテゴリ: 選ぶ, 段: 1 }
