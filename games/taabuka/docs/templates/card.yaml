# 札の雛形（content/sets/<セット>/cards.yaml に並べる）。語彙は docs/content-guide.md
# 札に数字（Tier）は書かない。札の強さは、その札のカテゴリが番付（上の表）でいるTierで決まる。
# 効果の量はレアリティで増える（コモン×1〜ミシック×8）。text の数字は {+N}（量）{xN}（掛け）{dN}（引く枚数）と書くと、
# 画面がレアリティに合わせて数字を直す。
- id: xx_namae               # セットの頭文字＋名前（英小文字・数字・_）。一度決めたら変えない
  name: 札の名前
  cat: [食べ物]               # 1〜3個：食べ物・死・宿・動物・スレ・湯・校庭・速さ・格ゲー・ター・老・麺・ロボ
  grade: 並                  # 最低レアリティ：並（コモン）/ 上（アンコモン）/ 特上（レア）/ 極（レジェンダリー）/ 神（ユニーク）
  text: 採点されると倍率{+2}   # 効果文（1行）。効果なしなら省く
  flavor: 笑いの一行。
  fx:                        # 効果。効果なしなら fx ごと省く
    - when: 採点時            # 合図
      if: { 重なり以上: 2, カテゴリ: 食べ物 }   # 条件（省略可）
      do:                    # 効果
        - 倍率: 2
  show:                      # 演出（省略可）
    - スタンプ: うまい
  test:                      # 自己テスト（省略可）
    - hand: [xx_namae, { cat: [食べ物] }]
      expect: { V: 90 }      # 食べ物2枚：(10＋10)×((1＋2)×1.5)
