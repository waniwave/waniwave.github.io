<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#efe6d2">
<title>ター深</title>
<meta property="og:type" content="website"><meta property="og:title" content="ター深">
<meta property="og:description" content="宿の床下に、ター深がある。潜って、拾って、帰ってくるデッキ構築ローグライト。">
<meta property="og:url" content="https://waniwave.com/games/taabuka/"><meta property="og:image" content="https://waniwave.com/games/taabuka/thumb.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; height: 100%; background: #1d1a16; }
  #err { display: none; position: fixed; inset: auto 12px 12px; padding: 12px; background: #2a2520; color: #efe6d2;
         font: 13px/1.5 system-ui, sans-serif; white-space: pre-wrap; border-radius: 6px; }
</style>
</head>
<body>
<div id="frame">
  <aside id="side-l" class="side"></aside>
  <main id="app">
    <div id="boot" class="scr" style="align-items:center;justify-content:center;font-family:var(--mincho);letter-spacing:.3em">読み込み中</div>
    <canvas id="fxc"></canvas>
    <div id="fx"></div>
    <div id="vignette"></div>
    <div id="blocker"></div>
    <div id="toast"></div>
  </main>
  <aside id="side-r" class="side"></aside>
</div>
<div id="tip"></div>
<div id="err"></div>
<script>
  // 更新するときは BUILD を変える。読み込むファイルには ?v=BUILD を付ける
  window.BUILD = '0.9.0-1';
  function showError(msg) {
    var el = document.getElementById('err');
    el.textContent = '読み込みに失敗しました\n' + msg;
    el.style.display = 'block';
  }
  window.addEventListener('error', function (e) { showError(e.message || String(e)); });
  window.addEventListener('unhandledrejection', function (e) {
    var m = String(e.reason && e.reason.message || e.reason);
    if (m !== 'content') showError(m);
  });
  document.write('<link rel="stylesheet" href="ui/style.css?v=' + window.BUILD + '">');
</script>
<script type="module">
  await import(`./ui/main.js?v=${encodeURIComponent(window.BUILD)}`);
</script>
</body>
</html>
