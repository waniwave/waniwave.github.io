<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#efe6d2">
<title>ター深</title>
<meta property="og:type" content="website"><meta property="og:title" content="ター深">
<meta property="og:description" content="宿の床下に、ター深がある。潜って、拾って、帰ってくるデッキ構築ローグライト。">
<meta property="og:url" content="https://waniwave.com/games/taabuka/"><meta property="og:image" content="https://waniwave.com/games/taabuka/thumb.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ター深">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #1d1a16; }
  #boot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; height: 100%; color: #efe6d2; background: #1d1a16; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; }
  #boot .bt { font-size: 44px; font-weight: 700; letter-spacing: .2em; }
  #boot .bfu { display: flex; gap: 6px; height: 64px; perspective: 300px; }
  #boot .bfu i { width: 30px; height: 60px; border: 2px solid #efe6d2; background: repeating-linear-gradient(#0000 0 14px, #efe6d255 14px 16px); transform-origin: left; animation: bfu 1.6s ease-in-out infinite; }
  #boot .bfu i:nth-child(2) { animation-delay: .2s; } #boot .bfu i:nth-child(3) { animation-delay: .4s; }
  @keyframes bfu { 0%, 100% { transform: rotateY(0) translateY(0); opacity: 1; } 50% { transform: rotateY(-70deg) translateY(10px); opacity: .5; } }
  #boot .bbar { width: 220px; height: 8px; border-radius: 4px; background: #3a332b; overflow: hidden; }
  #boot .bbar i { display: block; height: 100%; width: 3%; background: #b8432c; transition: width .2s; }
  #boot .bnum { font-size: 13px; color: #b9aa8e; font-family: system-ui, sans-serif; min-height: 1.4em; }
  #boot .bline { font-size: 14px; min-height: 1.6em; }
  #err { display: none; position: fixed; inset: auto 12px 12px; padding: 12px; background: #2a2520; color: #efe6d2;
         font: 13px/1.5 system-ui, sans-serif; white-space: pre-wrap; border-radius: 6px; }
</style>
</head>
<body>
<div id="frame">
  <aside id="side-l" class="side"></aside>
  <main id="app">
    <div id="boot" class="scr">
      <div class="bt">ター深</div>
      <div class="bfu"><i></i><i></i><i></i></div>
      <div class="bbar"><i id="bootbar"></i></div>
      <div class="bnum" id="bootnum">画面を用意しています…</div>
      <div class="bline" id="bootline">女将「床下はちょっと湿気てるの」</div>
    </div>
    <canvas id="fxc"></canvas>
    <div id="fx"></div>
    <div id="vignette"></div>
    <div id="blocker"></div>
    <div id="toast"></div>
  </main>
  <aside id="side-r" class="side"></aside>
</div>
<div id="tip"></div>
<div id="err"></div>
<script>
  // 更新するときは BUILD を変える。読み込むファイルには ?v=BUILD を付ける
  window.BUILD = '1.7.1';
  function showError(msg) {
    var el = document.getElementById('err');
    el.textContent = '読み込みに失敗しました\n' + msg + '\n';
    var b = document.createElement('button');
    b.textContent = '読み直す';
    b.style.cssText = 'min-height:44px;padding:0 16px;margin-top:8px';
    b.onclick = function () { location.reload(); };
    el.appendChild(b);
    el.style.display = 'block';
  }
  window.addEventListener('error', function (e) { showError(e.message || String(e)); });
  window.addEventListener('unhandledrejection', function (e) {
    var m = String(e.reason && e.reason.message || e.reason);
    if (m !== 'content') showError(m);
  });
  document.write('<link rel="stylesheet" href="ui/style.css?v=' + window.BUILD + '">');
  // 読み込み中：女将の一言を入れ替え、進み具合の帯を動かす（main.js が window.bootProgress を呼ぶ）
  (function () {
    var lines = ['女将「床下はちょっと湿気てるの」', '女将「札を一枚ずつ並べてるところよ」', '女将「番付表、どこにしまったかしら」', '女将「お湯、沸かしてくるわね」', '女将「襖の建て付けが悪くてね」', '女将「論客のみなさん、まだ寝てるみたい」'];
    var i = 0;
    window.__bootTimer = setInterval(function () { var el = document.getElementById('bootline'); if (!el) return clearInterval(window.__bootTimer); i = (i + 1) % lines.length; el.textContent = lines[i]; }, 2400);
    window.bootProgress = function (p) {
      var bar = document.getElementById('bootbar'), num = document.getElementById('bootnum');
      if (!bar || !num) return;
      var t = Math.max(p.total || 0, p.done || 0, 1);
      bar.style.width = Math.max(3, Math.min(100, Math.round((p.done / t) * 100))) + '%';
      num.textContent = (p.retry ? '回線が混んでいます。もう一度取りに行っています　' : '札を並べています… ') + p.done + ' / ' + t;
    };
  })();
</script>
<script type="module">
  // 画面のプログラムが混み合い（503 など）で読めなかったら、間をおいて3回まで自動で読み直す
  try {
    await import(`./ui/main.js?v=${encodeURIComponent(window.BUILD)}`);
    sessionStorage.removeItem('taabuka.reload');
  } catch (e) {
    const n = Number(sessionStorage.getItem('taabuka.reload') || 0);
    if (n < 3) { sessionStorage.setItem('taabuka.reload', String(n + 1)); setTimeout(() => location.reload(), 800 * (n + 1)); }
    else { sessionStorage.removeItem('taabuka.reload'); throw e; }
  }
</script>
</body>
</html>
