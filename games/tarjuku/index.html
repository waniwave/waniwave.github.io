<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>ター宿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 夜の旅館の帳場モニター。左に一人称の廊下と行灯の窓、右に宿帳。対局は座敷3部屋を横に並べた盤面。 */
:root{
  --yoru:#171a2e; --ai:#21254a; --ai2:#2c3263; --line:#3b4278;
  --washi:#efe6d0; --sumi:#25222d; --andon:#f2b648; --shu:#e2553f; --yu:#6cc8bd; --mute:#a5aacd;
  --f-disp:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --f-dot:'DotGothic16','MS Gothic',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--yoru) radial-gradient(ellipse 80% 40% at 50% -10%,rgba(242,182,72,.10),transparent 70%) no-repeat;color:var(--washi);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:2px solid var(--andon);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1,h2,h3{text-wrap:balance;margin:0}

/* header */
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.logo{font-family:var(--f-disp);font-size:26px;letter-spacing:.04em;line-height:1;color:var(--andon);display:flex;align-items:baseline;gap:10px}
.logo small{font-family:var(--f-dot);font-size:11px;color:var(--mute);letter-spacing:.12em}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-dot);font-size:14px;font-variant-numeric:tabular-nums;margin-left:auto;align-items:center}
.stats b{color:var(--andon);font-weight:400}
.chill{display:inline-flex;align-items:center;gap:6px}
.chill i{display:block;width:84px;height:8px;background:var(--ai);border:1px solid var(--line);position:relative;overflow:hidden}
.chill i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v,50%);background:var(--yu)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:6px 12px 7px;font-family:var(--f-dot);font-size:14px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--washi);border-color:var(--andon)}

/* explore */
.ex{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}
@media (max-width:820px){.ex{grid-template-columns:minmax(0,1fr)}}
.viewbox{position:relative;border:2px solid var(--line);background:#000;border-radius:4px;overflow:hidden}
#view{display:block;width:100%;height:auto;aspect-ratio:16/10}
.compass{position:absolute;top:8px;left:8px;font-family:var(--f-dot);font-size:13px;background:rgba(23,26,46,.75);padding:2px 8px;border:1px solid var(--line)}
.floorname{position:absolute;top:8px;right:8px;font-family:var(--f-disp);font-size:14px;background:rgba(23,26,46,.75);padding:3px 10px;border:1px solid var(--line);color:var(--andon)}
.msg{font-family:var(--f-dot);font-size:15px;line-height:1.75;background:var(--ai);border:2px solid var(--washi);border-radius:4px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
#msgbody{min-height:104px;display:flex;flex-direction:column;gap:6px}
.msgfoot{display:flex;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:8px;cursor:default}
#cmdf{display:flex;gap:6px;align-items:center;flex:1;min-width:0}
#cmd{flex:1;min-width:0;font-family:var(--f-dot);font-size:14px;background:var(--yoru);color:var(--washi);border:1px solid var(--line);padding:5px 8px;border-radius:3px}
#cmd:focus{outline:2px solid var(--andon);outline-offset:1px}
.btn.tiny{padding:3px 8px;font-size:12px;flex:none}
.choices button.on{border-color:var(--andon);background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-family:var(--f-dot);font-size:11px;background:var(--ai2);border:1px solid var(--line);border-radius:2px;padding:0 5px;color:var(--washi)}
.info .chip,.modal .chip{background:var(--ai2)}
b.cb{color:var(--andon);font-weight:700}
.card .art.sm{font-size:24cqw}
.card.boxed{box-shadow:0 0 0 2px #b08a4a inset,0 2px 0 rgba(0,0,0,.4)}
.card.boxed::after{content:"箱";position:absolute;left:4%;bottom:31%;font-family:var(--f-dot);font-size:10cqw;background:#b08a4a;color:var(--sumi);padding:0 3%;border-radius:2px}
.pickgrid{display:flex;flex-wrap:wrap;gap:8px;max-height:50vh;overflow:auto}
.pickgrid .card{--cw:70px;cursor:pointer}
.rw{display:flex;flex-direction:column;align-items:center;gap:4px}
h2.dead{color:var(--shu);font-family:var(--f-dot);font-weight:400;font-size:20px;text-align:center}
.ditem .n small{display:block;font-size:10.5px;color:var(--mute);line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.log .cb{color:var(--andon)}
/* v7 deck screen, viewer, guide, themes */
.ditem{display:grid;grid-template-columns:30px 22px minmax(0,1fr) 26px auto auto;gap:6px;align-items:center;cursor:pointer}
.ditem.cur{border-color:var(--andon);background:var(--ai2)}
.ditem .n small{white-space:nowrap}
.dbtn{width:30px;height:28px;border-radius:4px;border:1px solid var(--yu);background:#2c4f4a;color:#bff4ea;font-family:var(--f-disp);font-size:16px;line-height:1;padding:0}
.dbtn.rm{border-color:var(--shu);background:#4a2c2c;color:#ffb3a6}
.dbtn:disabled{opacity:.35;cursor:not-allowed}
.ditem .own{font-family:var(--f-dot);font-size:11px;color:var(--mute)}
.ditem.dis{opacity:.55}
.dcount{font-family:var(--f-disp);font-weight:400;color:var(--shu)}.dcount.ok{color:#7ff0dc}
#deckDetail .detail{grid-template-columns:96px minmax(0,1fr)}#deckDetail .detail .card{--cw:96px}
@media (min-width:721px){#deckDetail{position:sticky;top:8px;z-index:1}}
select{font:inherit;font-size:13px;background:var(--yoru);color:var(--washi);border:1px solid var(--line);border-radius:3px;padding:3px 6px}
.cardview{position:fixed;inset:0;z-index:85;background:rgba(10,12,26,.7);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.cvbox{background:var(--ai);border:2px solid var(--andon);border-radius:6px;max-width:520px;width:100%;padding:16px;display:flex;flex-direction:column;gap:10px}
.cvh{font-family:var(--f-disp);font-weight:400;font-size:18px;color:var(--andon)}
[data-view]{cursor:zoom-in}
.guide{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:78;width:min(620px,calc(100% - 24px));background:#f2d27a;color:var(--sumi);border-radius:6px;padding:12px 16px;box-shadow:0 6px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;gap:6px}
.guide b{font-family:var(--f-dot);font-weight:400;font-size:12px;color:#7a5a12}.guide p{margin:0;font-size:14.5px;line-height:1.65}
.guide .btn{background:var(--sumi);color:var(--washi);border-color:var(--sumi)}.guide .btn.primary{background:var(--shu);border-color:var(--shu);color:#fff}
.guidehl{outline:3px solid #f2d27a!important;outline-offset:3px;box-shadow:0 0 0 8px rgba(242,210,122,.25)!important;position:relative;z-index:2}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.themes{grid-template-columns:minmax(0,1fr)}}
.theme{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--yoru);border:2px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--washi)}
.theme:hover,.theme:focus-visible{border-color:var(--andon)}
.theme b{font-family:var(--f-disp);font-weight:400;font-size:17px;color:var(--andon)}.theme span{font-size:12.5px;line-height:1.5;color:var(--mute)}
.theme .tcards{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}.theme .tcards .card{--cw:48px}
.gaugeb{background:#3a2b52;color:#e6d6ff;padding:1px 8px;border-radius:3px;font-size:12.5px}
/* status strip */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0;font-family:var(--f-body);align-items:stretch;font-size:inherit}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{background:var(--ai);border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stl{font-family:var(--f-dot);font-size:12px;color:var(--mute);letter-spacing:.08em}
.stv{font-family:var(--f-disp);font-size:28px;line-height:1.05;color:var(--andon);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform-origin:left center}
.stv small{font-size:14px;color:var(--mute);margin-left:3px}
.stv.sm{font-size:18px;color:var(--washi);line-height:1.5}
.sts{font-size:12px;color:var(--mute);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sts b{color:var(--washi)}
.stbar{display:block;height:8px;background:var(--yoru);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stbar i{display:block;height:100%;background:var(--yu);transition:width .5s}
.st-chill .stv{color:#7ff0dc}
.st-chill.good{border-color:var(--yu)}.st-chill.good .sts b{color:#7ff0dc}
.st-chill.bad{border-color:var(--shu)}.st-chill.bad .stv,.st-chill.bad .sts b{color:#ff9a8a}.st-chill.bad .stbar i{background:var(--shu)}
.st-cards .stbar i{background:linear-gradient(90deg,var(--yu),var(--andon))}
.st.up .stv{animation:stup .7s ease-out}.st.dn .stv{animation:stdn .7s ease-out}
@keyframes stup{0%{transform:scale(1.25);color:#8fdc9a}100%{transform:none}}
@keyframes stdn{0%{transform:scale(1.15);color:var(--shu)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.st.up .stv,.st.dn .stv{animation:none}}
.toasts{top:auto!important;bottom:max(16px,env(safe-area-inset-bottom,0px))}
/* keyword tooltips */
.kw[data-tip],.kwt[data-tip]{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
.kwt{font-weight:700;color:inherit}
.chip[data-tip]{cursor:help}
.kwtip{position:fixed;z-index:90;max-width:min(300px,calc(100vw - 16px));background:var(--washi);color:var(--sumi);border:2px solid var(--sumi);border-radius:4px;padding:6px 10px;font-family:var(--f-body);font-size:13px;line-height:1.55;box-shadow:0 4px 0 rgba(0,0,0,.35);pointer-events:none}
/* v6 turn tracker & closed rooms */
#bTurn{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.tpips{display:flex;gap:3px}
.tp{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-disp);font-size:11px;border:2px solid var(--line);color:var(--mute);background:var(--yoru)}
.tp.done{background:var(--line);color:#8b90b8;border-color:var(--line)}
.tp.now{background:var(--andon);color:var(--sumi);border-color:var(--andon);transform:scale(1.15);box-shadow:0 0 8px var(--andon)}
.tp.last{border-color:var(--shu)}.tp.last.now{background:var(--shu);color:#fff;border-color:var(--shu);box-shadow:0 0 10px var(--shu)}
.tlab{font-family:var(--f-dot);font-size:13px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tlab b{font-family:var(--f-disp);font-weight:400;font-size:18px;color:var(--andon)}
.tleft b{font-size:16px;color:var(--washi)}
.tlab .fin{color:#ff9a8a;font-size:17px;animation:finp 1s ease-in-out infinite alternate}
@keyframes finp{to{opacity:.55}}
.room.closed{background:repeating-linear-gradient(90deg,#d8ccb0 0 10px,#cbbd9e 10px 12px);}
.room.closed b{letter-spacing:.2em}
.npb{display:block;margin-top:3px;background:var(--shu);color:#fff;font-size:10.5px;border-radius:2px;padding:1px 4px}
@media (prefers-reduced-motion:reduce){.tlab .fin{animation:none}}
/* v5 */
.card .fxe{position:absolute;left:3%;right:3%;top:54%;height:15%;display:flex;align-items:center;justify-content:center;font-size:11cqw;line-height:1;white-space:nowrap;overflow:hidden;background:rgba(255,255,255,.75);border-radius:2px;color:var(--sumi);letter-spacing:-.04em;font-family:var(--f-body);font-weight:700}
.card .nm{height:28%}
.card.unk .fxe{display:none}
.logo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#sndBtn{font-size:12px;margin-left:auto}
.oka{background:#2c4f4a;color:#bff4ea;padding:1px 8px;border-radius:3px;font-size:12.5px}
.advice{background:#f2d27a;color:var(--sumi);border-radius:4px;padding:8px 12px;display:flex;flex-direction:column;gap:3px;font-size:13.5px;line-height:1.5;margin-bottom:8px}
.advice b{font-family:var(--f-dot);font-weight:400;font-size:12px;color:#7a5a12}
.curve{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:110px;padding-top:4px}
.cv{display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;font-variant-numeric:tabular-nums}
.cvbar{flex:1;width:70%;position:relative}
.cvbar i{position:absolute;left:0;right:0;bottom:0;border-radius:2px 2px 0 0}
.cvbar .ideal{border:1px dashed var(--mute);opacity:.6}
.cvbar .cur{background:var(--yu);left:15%;right:15%}
.cvbar .cur.over{background:var(--shu)}.cvbar .cur.under{background:#c9a53a}
.cv b{font-family:var(--f-disp);font-weight:400;font-size:14px}.cv span{font-family:var(--f-dot);font-size:11px;color:var(--mute)}
.side2{display:flex;flex-direction:column;gap:12px;min-width:0}
.side2 input[type=text]{flex:1;min-width:0;font-family:var(--f-dot);font-size:13px}
#bLogBtn{align-self:flex-start}
.coachp{position:relative}.coachp .btn{align-self:flex-end;background:var(--sumi);color:var(--washi);border-color:var(--sumi)}
/* v4: tea / cost */
.card .cost{left:3%;top:3%;width:30cqw;height:24cqw;border-radius:8% 8% 50% 50%/8% 8% 75% 75%;background:var(--yu);color:var(--sumi);border:1px solid rgba(0,0,0,.25);border-top:3px solid #3a9e93;font-size:16cqw;padding-top:1cqw}
.hand .card.ok .cost{background:#7ff0dc;box-shadow:0 0 0 2px #fff,0 0 10px 2px #6cc8bd}
.hand .card.no{opacity:1;filter:grayscale(.85) brightness(.7)}
.hand .card.no .cost{background:var(--shu);color:#fff;border-top-color:#a33a2c}
.hand .card.disc .cost::after{content:"割";position:absolute;right:-30%;top:-30%;font-size:9cqw;background:var(--andon);color:var(--sumi);border-radius:50%;width:14cqw;height:14cqw;display:grid;place-items:center}
.nocha{position:absolute;left:6%;right:6%;top:24%;z-index:4;background:rgba(37,34,45,.88);color:#ffb3a6;font-family:var(--f-dot);font-size:12cqw;line-height:1.3;text-align:center;border-radius:3px;padding:4% 2%}
.bctl{gap:8px 12px}
.tea{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-family:var(--f-dot);font-size:14px;background:var(--ai);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.tea .tl{color:var(--mute);font-size:12px}
.cups{display:flex;gap:4px}
.cup{display:block;width:22px;height:17px;border-radius:8% 8% 50% 50%/8% 8% 75% 75%;border:2px solid #6cc8bd;border-top-width:3px;position:relative}
.cup.full{background:#7ff0dc;box-shadow:0 0 6px #6cc8bd}
.cup.full::before{content:"";position:absolute;left:30%;top:-9px;width:3px;height:6px;border-radius:2px;background:rgba(239,230,208,.55);box-shadow:5px 1px 0 rgba(239,230,208,.4)}
.cup.will{background:var(--andon);border-color:var(--andon);animation:willp .8s ease-in-out infinite alternate}
@keyframes willp{to{opacity:.45}}
.cup.used{background:transparent;border-color:#4a5290;opacity:.7}
.tnum b{font-family:var(--f-disp);font-weight:400;font-size:24px;color:#7ff0dc;vertical-align:-3px;margin-right:2px}
.tnum small{color:var(--mute);font-size:11px;margin-left:4px}
.tsel{background:var(--andon);color:var(--sumi);padding:1px 8px;border-radius:3px;font-size:13px}
.tsel.bad{background:var(--shu);color:#fff}
.coachp{background:#f2d27a;color:var(--sumi);border-radius:4px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.55;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.coachp b{font-family:var(--f-dot);font-weight:400;font-size:12px;color:#7a5a12}
.coachhl{outline:3px solid #f2d27a!important;outline-offset:2px;animation:coachp 1s ease-in-out infinite;position:relative;z-index:2}
@keyframes coachp{50%{box-shadow:0 0 0 6px rgba(242,210,122,.45)}}
@media (prefers-reduced-motion:reduce){.coachhl,.cup.will{animation:none}}
/* v3: battle presentation */
.cap{background:#11132a;border:1px solid var(--line);border-left:4px solid var(--andon);border-radius:4px;padding:8px 12px;min-height:74px;display:flex;flex-direction:column;gap:3px}
.caph{font-family:var(--f-disp);font-size:16px;line-height:1.3;color:var(--andon)}
.capb{font-size:13px;line-height:1.55;color:var(--washi)}
.capl{margin:2px 0 0;padding-left:1.2em;font-family:var(--f-dot);font-size:13px;line-height:1.55;color:#cfd2ea}
.capl li.cb{color:var(--andon)}
.kw{font-weight:700}.kw-in{color:#7fd1ff}.kw-al{color:#a8e07a}.kw-out{color:#ff9a8a}.kw-cb{color:var(--andon)}
.detail .kw-in,.thread .kw-in{color:#2a7fb0}
.bsum{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-family:var(--f-dot);font-size:14px}
.bsum b{font-family:var(--f-disp);font-weight:400;font-size:18px}.bsum .ps{color:var(--yu)}.bsum .es{color:#ff9a8a}
.lane.lp{box-shadow:inset 0 -3px 0 var(--yu)}.lane.le{box-shadow:inset 0 3px 0 var(--shu)}
.score{align-items:center}
.score .es,.score .ps{position:relative}
.win{font-family:var(--f-dot);font-size:10.5px;color:#4b4656;padding:0 4px;border-radius:2px}
.win.p{background:#bfe8e2;color:#1d5f58}.win.e{background:#f6c9c0;color:#8a2a1c}
.sflo{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-style:normal;font-size:14px;font-family:var(--f-disp);animation:flo 1.2s ease-out forwards;white-space:nowrap}
.sflo.up,.flo.up{color:#2f9e55}.sflo.dn,.flo.dn{color:var(--shu)}
.pred{margin-top:4px;background:var(--andon);color:var(--sumi);border-radius:2px;padding:2px 4px;font-size:11px;line-height:1.35;font-weight:700}
.pred span{font-weight:400}.pred small{display:block;font-weight:400;font-size:9.5px;opacity:.8}
.pred.no{background:#c9c3b3;color:#4b4656;font-weight:400}
.room.flash{animation:rflash 1s ease-out}
@keyframes rflash{0%{background:var(--andon)}100%{background:var(--washi)}}
.flo{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--f-disp);font-size:30cqw;text-shadow:0 0 3px #fff,0 0 6px #fff;animation:flo 1.2s ease-out forwards;z-index:3;pointer-events:none}
@keyframes flo{0%{opacity:0;transform:translate(-50%,10px) scale(1.4)}15%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.card.src{outline:3px solid var(--andon);outline-offset:1px;animation:srcp .9s ease-in-out 2}
@keyframes srcp{50%{box-shadow:0 0 18px 4px var(--andon)}}
.card.hitup{box-shadow:0 0 0 2px #2f9e55,0 0 12px #2f9e55}.card.hitdn{box-shadow:0 0 0 2px var(--shu),0 0 12px var(--shu)}
.card.ghost{opacity:.85;animation:die 1.2s ease-in forwards;filter:grayscale(1)}

function roomOf(st,i){const l=st.lanes[i];if(l.open&&st.turn<l.open)return CLOSED_ROOM;return ROOMS[l.room]}
function openRooms(st,L){st.lanes.forEach((l,i)=>{if(l.open&&st.turn===l.open){const r=ROOMS[l.room];L(`部屋が開いた：「${r.name}」──${r.text}`);if(r.onOpen)r.onOpen(st,i,L)}})}
function discardN(st,s,n,L,chooser){let k=0;for(let j=0;j<n;j++){const h=st.hand[s];if(!h.length)break;const x=chooser?chooser(h):pick(h);h.splice(h.indexOf(x),1);st.grave[s].push(x);st.discarded[s]++;k++;if(L)L(`${s==='p'?'あなた':'相手'}は「${nm(x)}」を捨てた。`);watchers(st,'onDiscard').forEach(w=>{if(w.side===s)D(w).onDiscard(st,w,x,L)})}return k}
function returnToHand(st,c,L){if(c.mem.shield&&c.side!==undefined&&L&&!c.mem.selfReturn){c.mem.shield=0;L(`「${nm(c)}」は守りで踏みとどまった。`);return null}const s=c.side;removeFrom(st,c);if(st.hand[s].length<HAND_MAX){const n=inst(c.id==='curry'?'curry':c.id,s);n.lv=c.lv;st.hand[s].push(n);if(L)L(`「${nm(c)}」が手札に戻された。`);return n}st.grave[s].push(c);return null}

  let spent=0;plays.forEach((p,k)=>spent+=costFor(st,s,p.c,k));st.okawari[s]=Math.floor(Math.max(0,st.tea[s]-spent)/2);
  if(plays.length)st.discount[s]=0;
  for(const p of plays){const h=st.hand[s];const k=h.indexOf(p.c);if(k>=0)h.splice(k,1)}
}
function genDeck(pool,size){
  size=size||12;const ok=id=>{const d=CMAP[id];return d&&!d.token&&d.tier!=='G'&&(pool[d.tier]||0)>0};
  const ids=[];const add=id=>{const mx=CMAP[id].max||2;if(ids.length<size&&ids.filter(x=>x===id).length<mx)ids.push(id)};
  const fams=FAMILIES.map(f=>f.filter(ok)).filter(f=>f.length>=2);
  const nf=1+(Math.random()<.6?1:0);for(let k=0;k<nf&&fams.length;k++){shuffle(pick(fams).slice()).forEach(add)}
  const byT={};COLLECTIBLE.forEach(c=>{if(c.tier!=='G')(byT[c.tier]=byT[c.tier]||[]).push(c.id)});
  const tiers=Object.keys(pool).filter(t=>pool[t]>0&&byT[t]);const tot=tiers.reduce((a,t)=>a+pool[t],0);
  for(let g=0;g<400&&ids.length<size;g++){let r=Math.random()*tot,t=tiers[0];for(const k of tiers){r-=pool[k];if(r<=0){t=k;break}}add(pick(byT[t]))}
  while(ids.length<size)ids.push('eo');
  return ids;
}

const ownT=(st,c,t)=>own_(st,c).filter(x=>x!==c&&has(x,t));
function tagKinds(st,s){const set=new Set();mine(st,s).forEach(x=>{if(D(x).wild)return;tagsOf(x).forEach(t=>{if(!['ter','gen'].includes(t))set.add(t)})});return set.size}
function topTag(st,s){const cnt={};[...st.deck[s],...st.hand[s],...mine(st,s)].forEach(x=>{if(D(x).wild)return;tagsOf(x).forEach(t=>{if(!['ter','gen'].includes(t))cnt[t]=(cnt[t]||0)+1})});return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]}

function guardFrom(st,c,kind){
  if(c.lane<0)return null;
  const own=st.lanes[c.lane][c.side];
  for(const x of own){const d=D(x);if(nulled(st,x))continue;
    if(d.laneGuard)return d.name;
    if(d.laneGuardTag&&has(c,d.laneGuardTag)&&(kind==='down'||d.laneGuardKill))return d.name}
  if(kind==='down'&&st.turn>=st.maxTurn){const f=mine(st,c.side).find(x=>D(x).finalGuard&&!nulled(st,x));if(f)return D(f).name}
  return null}

  }else if(NET.role==='guest'){
    if(m.t==='oldver'||(m.t==='hello'&&m.v!==NET_V)){clearInterval(NET.hi);netStatus(NET_ERR.ver,1);const c=NET.conn;NET.live=false;NET.conn=null;try{c&&c.close()}catch(e){}return}
    if(m.t==='hello'){if(!validDeck(m.deck))return;NET.opp={name:String(m.name||'相手').slice(0,16),deck:m.deck};return}

  const pool=[...new Set(FLOORS.flatMap(f=>f.rooms||[]))].filter(r=>ROOMS[r]&&!ROOMS[r].dead);const rooms=[];while(rooms.length<3&&pool.length)rooms.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);

function drawMini(){
  const c=$('#mini');const ctx=c.getContext('2d');const f=FLOORS[G.floor];const H=f.map.length,W=f.map[0].length;const cs=Math.floor(c.width/Math.max(W,H));
  ctx.fillStyle='#11132a';ctx.fillRect(0,0,c.width,c.height);const all=perk('maap');
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(!all&&!G.seen[G.floor][y*W+x])continue;const t=f.map[y][x];
    ctx.fillStyle=t==='#'?'#3b4278':t==='D'?'#a33a2c':t==='*'?'#05060f':'#22264a';ctx.fillRect(x*cs,y*cs,cs-1,cs-1);
    let mark=null;const ev=f.ev[t];
    if(t==='^'||t==='v')mark=['#f2b648',t==='^'?'▲':'▼'];else if(t==='R')mark=['#f2b648','帳'];else if(t==='V')mark=['#6cc8bd','札'];else if(t==='O')mark=['#7aa8ff','湯'];else if(t==='F')mark=['#e2553f','食'];
    else if(ev&&ev.lore)mark=['#efe6d0','・'];else if(ev&&ev.z){if(!(ev.z==='troll'&&G.beaten.troll))mark=['#c9b8f0',(ZICON[ev.z]||['？'])[0]]}
    else if(ev&&ev.npc&&npcVisible(ev.npc))mark=[G.beaten[ev.npc]?'#6b7198':(NPC[ev.npc].boss?'#e2553f':'#efe6d0'),'●'];
    if(mark){ctx.fillStyle=mark[0];ctx.font=`${Math.round(cs*0.62)}px 'DotGothic16',monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(mark[1],x*cs+cs/2,y*cs+cs/2+1)}
  }
  const px=G.x*cs+cs/2,py=G.y*cs+cs/2;ctx.fillStyle='#f2b648';ctx.save();ctx.translate(px,py);ctx.rotate(G.dir*Math.PI/2);ctx.beginPath();ctx.moveTo(0,-cs*0.42);ctx.lineTo(cs*0.32,cs*0.32);ctx.lineTo(-cs*0.32,cs*0.32);ctx.fill();ctx.restore();
}

// ---------- message window (typewriter + auto) ----------
function L(s,t){return{s:s||'',t}}
function norm(lines,name){return lines.filter(x=>x!==''&&x!=null).map(x=>typeof x==='string'?{s:(name&&!x.startsWith('（'))?name:'',t:x}:x)}
function say(lines,choices,onClose){UI.msg={lines:norm(lines),i:0,choices:choices||null,onClose,shown:0,doneAt:0,sel:0};if(!UI.msg.lines.length)UI.msg.lines=[{s:'',t:'……'}];renderMsg()}
function sayN(name,lines,choices,onClose){UI.msg={lines:norm(lines,name),i:0,choices:choices||null,onClose,shown:0,doneAt:0,sel:0};if(!UI.msg.lines.length)UI.msg.lines=[{s:'',t:'……'}];renderMsg()}
function closeMsg(){const m=UI.msg;UI.msg=null;renderMsg();if(m&&m.onClose)m.onClose()}
function msgTyping(){const m=UI.msg;return !!(m&&m.shown<m.lines[m.i].t.length)}
function msgLast(){const m=UI.msg;return !!(m&&m.i>=m.lines.length-1)}
function msgWaitingChoice(){return !!(UI.msg&&UI.msg.choices&&msgLast()&&!msgTyping())}
function advance(){const m=UI.msg;if(!m)return;if(msgTyping()){m.shown=m.lines[m.i].t.length;m.doneAt=Date.now();tickMsg(true);return}
  if(m.i<m.lines.length-1){m.i++;m.shown=0;m.doneAt=0;renderMsg()}else if(!m.choices)closeMsg()}
function renderMsg(){
  const el=$('#msgbody');const m=UI.msg;
  if(!m){const f=FLOORS[G.floor];const amb=f.amb[(G.steps>>3)%f.amb.length];el.innerHTML=`<div class="who">${esc(f.name)}　${dayN()}日目 ${clock()}${night()?'　（深夜）':''}</div><div class="txt">${esc(amb)}</div><div class="small">${esc(tileHint())}</div>`;return}
  if(REDUCED)m.shown=1e9;
  const ln=m.lines[m.i];
  let h=`${ln.s?`<div class="who">${esc(ln.s)}</div>`:''}<div class="txt" id="msgtxt"></div><div class="more" id="msgmore" hidden>▼</div>`;
  if(m.choices)h+=`<div class="choices" id="msgch" hidden>${m.choices.map((c,i)=>`<button type="button" data-ci="${i}" ${c.dis?'disabled':''} class="${i===m.sel?'on':''}">${i+1}. ${esc(c.label)}</button>`).join('')}</div>`;
  el.innerHTML=h;tickMsg(true);
}
function tickMsg(noStep){
  const m=UI.msg;if(!m)return;const ln=m.lines[m.i];const tx=$('#msgtxt');if(!tx)return;
  if(!noStep&&m.shown<ln.t.length){m.shown=Math.min(ln.t.length,m.shown+1)}
  if(m.shown>=ln.t.length&&!m.doneAt)m.doneAt=Date.now();
  tx.textContent=ln.t.slice(0,m.shown);
  const done=m.shown>=ln.t.length;const last=msgLast();
  const mo=$('#msgmore');if(mo)mo.hidden=!done||(last&&!!m.choices);
  const ch=$('#msgch');if(ch)ch.hidden=!(done&&last);
  if(!noStep&&UI.auto&&done&&!(last&&m.choices)&&!UI.b&&$('#ov').hidden&&Date.now()-m.doneAt>1800+ln.t.length*80)advance();
}

// ---------- movement ----------
function act(k){
  if(UI.b||!$('#ov').hidden||UI.tab!=='explore')return;
  if(UI.msg){
    if(msgWaitingChoice()){if(k==='f'||k==='tl')setSel(-1);else if(k==='b'||k==='tr')setSel(1);else if(k==='act')chooseIdx(UI.msg.sel);return}
    if(k==='act'||k==='menu'||msgTyping()||!msgLast()){advance();return}
    closeMsg();if(UI.msg)return;
  }
  if(k==='menu'){actionMenu();return}
  if(k==='tl'){G.dir=(G.dir+3)%4;afterTurn();return}
  if(k==='tr'){G.dir=(G.dir+1)%4;afterTurn();return}
  if(k==='act'){trigger(true);return}
  const dir=k==='f'?G.dir:k==='b'?(G.dir+2)%4:k==='sl'?(G.dir+3)%4:(G.dir+1)%4;
  tryMove(dir);
}
function tryMove(dir){
  const nx=G.x+DIRS[dir][0],ny=G.y+DIRS[dir][1];const t=tileAt(G.floor,nx,ny);

function step(){
  G.steps++;G.min+=3;sfx('step');if(G.floor===3)G.f3++;
  let lampOut=false;if(G.items.lamp&&G.oil>0){G.oil--;if(G.oil===0)lampOut=true}
  const drain=!(perk('tamar')||(perk('syrup')&&night()));
  if(drain&&G.steps%4===0)G.chill=Math.max(0,G.chill-1);
  if(UI.cool>0)UI.cool--;
  if(isDark(G.floor,G.x,G.y)&&!lampLit()){G.darkN++;render();
    const e=evAt(G.floor,G.x,G.y);if(e&&e.z==='grue'){die('グタームに会いに来たら、グタームに食べられた。');return}
    if(G.darkN>=2){die('真っ暗な中を歩きつづけたあなたは、グタームに食べられた。');return}
    say(['真っ暗だ。グタームに食べられてしまうかもしれない。'],[C('引き返す',()=>{G.dir=(G.dir+2)%4;tryMove(G.dir)}),C('進む')]);return}
  G.darkN=0;markSeen();
  const t=tileAt(G.floor,G.x,G.y);
  render();
  if(lampOut){say(['（行灯の火が、ふっと消えた）','（食堂でター油を注げば、また灯るかもしれない）']);return}
  if(t!=='.'&&t!=='*'&&t!=='S'){trigger(false);return}
  if(G.steps%10===0)save();
  const rate=0.065*(night()?1.5:1)*(G.chill<=20?1.4:1)*(perk('byousoku')?0.5:1);
  if(UI.cool<=0&&Math.random()<rate){encounter();return}

}
function trigger(manual){
  const t=tileAt(G.floor,G.x,G.y);const f=FLOORS[G.floor];

  if(t==='R')return chouba();if(t==='V')return vending();if(t==='O')return onsen();if(t==='F')return dining();
  if(t==='S'){if(manual)say(['ここは白い旅館の玄関だ。','東に、小さな郵便受けがある。','（玄関の扉は、外からも中からも開かない。概念の宿なので）']);return}
  const ev=f.ev[t];
  if(ev&&ev.lore)return say(ev.lore);

// ---------- gags ----------
function runGag(g){
  g.run(r=>{
    r=r||{};const lines=[];const first=!G.seenEv[g.id];
    if(first){G.seenEv[g.id]=1;award('gag_'+g.id,2);G.pts+=10;toast(`怪事件録に記録：「${g.title}」（宿ポ+10）`,'ev')}
    if(r.pts&&(first||r.pts<0)){G.pts=Math.max(0,G.pts+r.pts);if(r.pts>0)lines.push(`宿ポ+${r.pts}`)}
    if(r.chill){G.chill=Math.max(0,Math.min(100,G.chill+r.chill));lines.push(`チル${r.chill>0?'+':''}${r.chill}`)}
    if(r.score)award('gs_'+g.id,r.score);
    if(r.title)addTitle(r.title);
    if(r.card){if(own(r.card)<(CMAP[r.card].max||2)||Math.random()<0.5){const gc=giveCard(r.card);lines.push(gc.dup?`「${CMAP[r.card].short||CMAP[r.card].name}」の札（かぶり）を手に入れた`:`「${CMAP[r.card].short||CMAP[r.card].name}」の札を手に入れた！`)}}
    save();render();checkCollection();
    if(lines.length)say(['（'+lines.join('。')+'）'],null,()=>{if(r.card)cardView(r.card,'札を手に入れた！')});
  });
}

function rollCard(pk,forceTier){
  const w=Object.assign({},PACK_W);if(night()){['2','1','0','8','6','7'].forEach(k=>w[k]*=2)}
  if((G.flags.badluck||0)>dayN()){Object.keys(w).forEach(k=>{if(k!=='5')w[k]=0})}
  if(forceTier)Object.keys(w).forEach(k=>{if(!forceTier.includes(k))w[k]=0});
  const pool=COLLECTIBLE.filter(c=>!pk.filter||pk.filter(c));
  const tiers=Object.keys(w).filter(t=>w[t]>0&&pool.some(c=>c.tier===t));if(!tiers.length)return pick(pool).id;
  let r=Math.random()*tiers.reduce((a,t)=>a+w[t],0),t=tiers[0];for(const k of tiers){r-=w[k];if(r<=0){t=k;break}}
  return pick(pool.filter(c=>c.tier===t)).id;
}
function openPack(pk){
  const ids=[];for(let i=0;i<pk.n;i++)ids.push(rollCard(pk,(pk.boost&&i===0)?['2','1','0','8','6','7']:null));

  G.packs++;G.pity++;
  if((G.pity>=10||pk.okami)&&pool.length&&!ids.some(id=>!own(id))){ids[ids.length-1]=pick(pool).id}
  const got=ids.map(id=>giveCard(id,{foilBoost:pk.okami?3:1}));
  if(got.some(g=>g.new))G.pity=0;
  save();render();
  const rare=t=>['G','0','1','8','6','7'].includes(t);
  modal(`<h2>${esc(pk.name)}</h2><div class="cardrow" id="pkrow">${got.map((g,i)=>`<div class="rw"><div class="pk" data-i="${i}">${cardHTML('eo',{cls:'back'})}</div><span class="small pkl" data-l="${i}">&nbsp;</span></div>`).join('')}</div>
   <div class="small">押すとめくれます。めくった札を押すと効果が見られます。天井まで：あと${Math.max(0,10-G.pity)}パック</div>
   <div class="row"><button class="btn" id="pkAll">全部めくる</button><button class="btn primary" data-close>閉じる</button><button class="btn" data-again ${G.pts<pk.price?'disabled':''}>もう1パック（${pk.price}）</button></div>`,
  el=>{
    const flip=i=>{const slot=el.querySelector(`.pk[data-i="${i}"]`);if(!slot||slot.dataset.done)return;slot.dataset.done=1;const g=got[i];const d=CMAP[g.id];
      slot.innerHTML=cardOwnHTML(g.id,{cls:'flipin'+(rare(d.tier)?' rare':''),attr:`data-view="${g.id}" tabindex="0"`});
      sfx(rare(d.tier)?'rare':'flip');el.querySelector(`[data-l="${i}"]`).innerHTML=(g.new?'<b class="newb">NEW!</b> ':'')+(g.foil?'<b class="foilb">キラ！</b> ':'')+(g.dup?`かぶり（宿ポ+${g.v}）${g.star?` <b class="newb">★${starOf(g.id)}</b>`:''}`:'')+(rare(d.tier)?' <b class="rareb">レア</b>':'')};
    el.querySelectorAll('.pk').forEach(s=>s.onclick=()=>flip(+s.dataset.i));
    el.querySelector('#pkAll').onclick=()=>got.forEach((g,i)=>setTimeout(()=>flip(i),i*(REDUCED?0:350)));
    el.querySelector('[data-again]').onclick=()=>{if(G.pts>=pk.price){G.pts-=pk.price;modalClose=null;$('#ov').hidden=true;checkCollection();openPack(pk)}};
  },()=>{checkCollection();if(!G.flags.packTalk){G.flags.packTalk=1;save();sayN('番頭',['はじめてのパックはいかがでしたか。','持っていない札には「NEW!」。たまに光る「キラ札」が出ます。キラ札は強さ+1。','持っている札がかぶると宿ポになり、3枚かぶるごとに★が付いて強さ+1。★は3つまで。','10パック目には、持っていない札が必ず1枚入ります（天井）。'])}});
}

      else sayN(n.name,out==='win'?n.win:out==='lose'?n.lose:['（引き分けだった。強さは、まだ議論の途中だ）'],null,after)}
  });
}

function deckCount(id){return G.deck.filter(x=>x===id).length}
function autoDeck(){
  const ids=COLLECTIBLE.filter(c=>own(c.id)>0).map(c=>c.id);
  const tagCount={};ids.forEach(id=>tagsOf(id).forEach(t=>{if(t!=='ter')tagCount[t]=(tagCount[t]||0)+1}));
  let bestFam=[],bf=0;FAMILIES.forEach(f=>{const u=[...new Set(f)].filter(x=>own(x));if(u.length>bf){bf=u.length;bestFam=u}});
  let theme=Object.keys(tagCount).sort((a,b)=>tagCount[b]-tagCount[a])[0];
  const tc={};bestFam.forEach(id=>tagsOf(id).forEach(t=>{if(t!=='ter')tc[t]=(tc[t]||0)+1}));const ft=Object.keys(tc).sort((a,b)=>tc[b]-tc[a])[0];if(ft&&(tagCount[ft]||0)>=4)theme=ft;
  const fam=new Set(bestFam);FAMILIES.forEach(f=>{const u=[...new Set(f)].filter(x=>own(x));if(u.filter(x=>has(x,theme)).length>=2)u.forEach(x=>fam.add(x))});
  const val=id=>{const d=CMAP[id];let v=d.pow+lvOf(id)+TIER[d.tier].v/6;if(has(id,theme))v+=8;if(fam.has(id))v+=5;const fx=d.fx||'';if(fx.includes('💥'))v+=2.5;if(fx.includes('🃏')||fx.includes('🔍'))v+=1.5;if(fx.includes('🤝')&&!fam.has(id)&&!has(id,theme))v-=4;return v};
  const sorted=ids.slice().sort((a,b)=>val(b)-val(a));
  const bucket=c=>c<=2?'lo':c<=4?'mid':'hi';const need={lo:4,mid:4,hi:2},got={lo:0,mid:0,hi:0};const d=[];
  const cnt2=id=>d.filter(x=>x===id).length,cap=id=>Math.min(own(id),2);
  for(const id of sorted){const b=bucket(CMAP[id].cost);if(d.length<10&&got[b]<need[b]){d.push(id);got[b]++}}
  for(const id of sorted){if(d.length>=10)break;if(cnt2(id)<cap(id)&&(has(id,theme)||fam.has(id))&&CMAP[id].cost<=4){d.push(id)}}
  for(const id of sorted){while(d.length<10&&cnt2(id)<cap(id))d.push(id)}
  if(!d.some(id=>(CMAP[id].fx||'').includes('💥'))){const k=sorted.find(id=>(CMAP[id].fx||'').includes('💥')&&cnt2(id)<cap(id));if(k){let wi=-1,wv=1e9;d.forEach((id,i)=>{const v=val(id);if(v<wv){wv=v;wi=i}});if(wi>=0)d[wi]=k}}
  return{deck:d.slice(0,10),theme};
}

const SND={ctx:null,on:true,master:null,bgm:null,mode:'f1',next:0,beat:0,noiseBuf:null};
try{SND.on=localStorage.getItem('tarjuku-snd')!=='0'}catch(e){}
function sndInit(){
  if(SND.ctx){if(SND.ctx.state==='suspended')SND.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{SND.ctx=new AC()}catch(e){return}
  const c=SND.ctx;SND.master=c.createGain();SND.master.gain.value=SND.on?0.5:0;SND.master.connect(c.destination);
  SND.bgm=c.createGain();SND.bgm.gain.value=0.2;SND.bgm.connect(SND.master);
  const len=c.sampleRate*1;SND.noiseBuf=c.createBuffer(1,len,c.sampleRate);const d=SND.noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  SND.next=c.currentTime+0.1;setInterval(bgmTick,100);
}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,sndInit));
function sndToggle(){SND.on=!SND.on;try{localStorage.setItem('tarjuku-snd',SND.on?'1':'0')}catch(e){}sndInit();if(SND.master)SND.master.gain.value=SND.on?0.5:0;sndLabel()}
function sndLabel(){const b=$('#sndBtn');if(b){b.textContent=SND.on?'音：ON':'音：OFF';b.setAttribute('aria-pressed',SND.on?'true':'false')}}
function tone(f,t0,dur,type,vol,dest,slide){const c=SND.ctx;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(dest||SND.master);o.start(t0);o.stop(t0+dur+0.05)}
function noise(t0,dur,vol,freq,type){const c=SND.ctx;const s=c.createBufferSource();s.buffer=SND.noiseBuf;const f=c.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq||1000;const g=c.createGain();g.gain.setValueAtTime(vol||0.2,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);s.connect(f);f.connect(g);g.connect(SND.master);s.start(t0);s.stop(t0+dur+0.05)}
function sfx(n){if(!SND.ctx||!SND.on)return;const t=SND.ctx.currentTime;try{switch(n){
  case 'step':noise(t,0.06,0.06,500,'lowpass');break;
  case 'bump':tone(90,t,0.14,'square',0.07);break;
  case 'select':tone(880,t,0.06,'triangle',0.08);break;

const BGM={f0:{base:196,bpm:70,drone:1},f1:{base:220,bpm:80},f2:{base:247,bpm:84},f3:{base:165,bpm:66,drone:1},battle:{base:220,bpm:118,taiko:1},title:{base:220,bpm:72}};
const MIYAKO=[0,1,5,7,8,12,13,17];
function bgmMode(m){SND.mode=m}
function bgmTick(){
  if(!SND.ctx||!SND.on)return;const c=SND.ctx;const cfg=BGM[SND.mode]||BGM.f1;const spb=60/cfg.bpm/2;
  while(SND.next<c.currentTime+0.3){const t=SND.next,b=SND.beat;
    if(b%16===0)tone(cfg.base/2,t,spb*14,'sine',0.06,SND.bgm);
    if(cfg.drone&&b%8===4)tone(cfg.base*0.75,t,spb*6,'sine',0.03,SND.bgm);
    if(cfg.taiko&&(b%8===0||b%8===3||b%8===6)){tone(b%8===0?90:120,t,0.25,'sine',0.25,SND.bgm,45)}
    const p=cfg.taiko?0.55:0.38;
    if(Math.random()<p){const f=cfg.base*Math.pow(2,pick(MIYAKO)/12);tone(f,t,1.1,'triangle',0.07,SND.bgm);tone(f*2,t,0.5,'sine',0.02,SND.bgm)}
    SND.next+=spb;SND.beat++}
}

// ---------- deck curve advice ----------
function curveInfo(deck){const by=[0,0,0,0,0,0,0];deck.forEach(id=>{by[Math.min(6,CMAP[id].cost)]++});const low=by[0]+by[1],mid=by[2]+by[3],high=by[4]+by[5]+by[6];const draws=deck.filter(id=>(CMAP[id].fx||'').includes('🃏')||(CMAP[id].fx||'').includes('🔍')).length;return{by,low,mid,high,draws}}
function curveAdvice(deck){
  const c=curveInfo(deck);const out=[];
  if(deck.length<10)out.push(`デッキが${deck.length}枚。勝負には10枚以上いります。`);
  if(c.high===0)out.push('4コスト以上の札が1枚もありません。4ターン目から茶が余ります。強い札を2〜3枚入れましょう。');
  else if(c.high<2)out.push('4コスト以上の札が少なめです。後半の決め手を、もう1枚。');
  if(c.mid<3)out.push('2〜3コストの札が少ないです。2・3ターン目にちょうど置ける札を。');
  if(c.low>5)out.push('0〜1コストが多すぎます。序盤はいいけれど、後半に置くものが足りなくなります。');
  if(c.draws<2)out.push('札を引く（🃏）・探す（🔍）札が少ないです。手札切れにご用心。');
  if(!out.length)out.push('茶の使い方のバランスがいいデッキです。あとは組み合わせ（🤝）を揃えるだけ。');
  return out;
}
function curveHTML(deck){
  const c=curveInfo(deck);const mx=Math.max(4,...c.by);const ideal=[1,3,2,2,1,1,0];
  return `<div class="curve">${c.by.map((n,i)=>`<div class="cv"><div class="cvbar"><i class="ideal" style="height:${ideal[i]/mx*100}%"></i><i class="cur ${n>ideal[i]+2?'over':n<ideal[i]-1?'under':''}" style="height:${n/mx*100}%"></i></div><b>${n}</b><span>${i===6?'6+':i}</span></div>`).join('')}</div><div class="small">棒＝デッキの札の数（コスト別）。うすい枠＝おすすめの目安。</div>`;
}

// ---------- deck code ----------
const CODE_IDS=COLLECTIBLE.map(c=>c.id);
function deckCode(deck){const body=deck.map(id=>CODE_IDS.indexOf(id).toString(36).padStart(2,'0')).join('');let sum=0;for(const ch of body)sum=(sum*31+ch.charCodeAt(0))%1296;return 'TAR-'+body+'-'+sum.toString(36).padStart(2,'0')}
function decodeDeck(code){
  const m=String(code).trim().toUpperCase().replace(/\s/g,'').match(/^TAR-([0-9A-Z]+)-([0-9A-Z]{2})$/);if(!m)return null;
  const body=m[1].toLowerCase();if(body.length%2)return null;let sum=0;for(const ch of body)sum=(sum*31+ch.charCodeAt(0))%1296;if(sum.toString(36).padStart(2,'0')!==m[2].toLowerCase())return null;
  const ids=[];for(let i=0;i<body.length;i+=2){const k=parseInt(body.slice(i,i+2),36);if(!(k>=0&&k<CODE_IDS.length))return null;ids.push(CODE_IDS[k])}
  return ids.length>=8&&ids.length<=20?ids:null;
}
function friendBattle(ids){
  const rooms=shuffle(Object.keys(ROOMS).filter(r=>!ROOMS[r].dead&&r!=='rouka')).slice(0,3);
  let lead=ids[0];ids.forEach(id=>{if(TIER_ORDER.indexOf(CMAP[id].tier)<TIER_ORDER.indexOf(CMAP[lead].tier))lead=id});
  setTab('explore');startBattle({foe:'友達のデッキ（最強CPU）',card:lead,eDeck:ids.slice(),rooms,maxTurn:6,friend:1});
}

const kwTip=document.createElement('div');kwTip.className='kwtip';kwTip.hidden=true;kwTip.setAttribute('role','tooltip');document.body.appendChild(kwTip);
let kwCur=null;
function kwShow(el){const t=el.dataset.tip;if(!t){kwHide();return}kwCur=el;kwTip.textContent=t;kwTip.hidden=false;
  const r=el.getBoundingClientRect();const w=kwTip.offsetWidth,hh=kwTip.offsetHeight;const vw=document.documentElement.clientWidth,vh=window.innerHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),vw-w-8);let y=r.bottom+6;if(y+hh>vh-8)y=r.top-hh-6;kwTip.style.left=x+'px';kwTip.style.top=Math.max(8,y)+'px'}
function kwHide(){kwTip.hidden=true;kwCur=null}

document.addEventListener('mouseout',e=>{const k=e.target.closest&&e.target.closest('[data-tip]');if(k&&!(e.relatedTarget&&k.contains(e.relatedTarget)))kwHide()});
document.addEventListener('focusin',e=>{const k=e.target.closest&&e.target.closest('[data-tip]');if(k)kwShow(k)});
